<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 5 Assessment - Typing Test</title>
    <style>
        :root {
            /* Delta Serlby Park Color Scheme */
            --navy: #1B1464; 
            --yellow: #F7931D;
            --maroon: #822433;
            --bg-color: #f4f6f8;
            --text-color: #333;
            --light-gray: #e2e8f0;
            
            /* Typing Colors */
            --correct-color: #16a34a; /* Green */
            --incorrect-color: #dc2626; /* Red */
            --untyped-color: #94a3b8;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

       header { 
            background-color: var(--navy); 
            color: white; 
            padding: 20px; 
            display: grid; 
            grid-template-columns: 1fr auto 1fr; /* Creates Left, Center, and Right zones */
            align-items: center; 
            border-bottom: 6px solid var(--maroon); 
        }

        .header-left {
            display: flex;
            justify-content: flex-start;
        }

        .header-center {
            text-align: center;
        }

        .header-right {
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        header img { 
            height: 120px; /* Increased from 80px to make the logo significantly bigger */
            background-color: white; 
            border-radius: 8px; 
            padding: 5px;
        }

        /* Adjustments for smaller screens/mobile */
        @media (max-width: 768px) {
            header {
                grid-template-columns: 1fr;
                text-align: center;
                gap: 15px;
            }
            .header-left, .header-right {
                justify-content: center;
            }
        }

        h1 { margin: 0; font-size: 24px; }

        .back-btn {
            background-color: var(--yellow);
            color: var(--navy);
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            transition: transform 0.2s, background-color 0.2s;
            font-size: 14px;
        }

        .back-btn:hover {
            transform: scale(1.05);
            background-color: #ff9d2a;
        }

        main { 
            padding: 30px 20px; 
            max-width: 900px; 
            margin: 0 auto; 
            width: 100%;
            box-sizing: border-box;
            flex: 1;
        }

        .test-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-top: 5px solid var(--navy);
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .mode-btn {
            background-color: var(--light-gray);
            color: var(--text-color);
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn.active, .mode-btn:hover {
            background-color: var(--yellow);
            color: var(--navy);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background-color: var(--navy);
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 18px;
            font-weight: bold;
        }

        .stat-box span {
            color: var(--yellow);
            font-size: 24px;
            margin-left: 8px;
        }

        .typing-area {
            position: relative;
            font-size: 28px; /* Larger text for easier reading */
            line-height: 1.6;
            font-family: 'Consolas', 'Courier New', monospace;
            padding: 30px;
            background-color: #f8fafc;
            border: 2px solid var(--light-gray);
            border-radius: 8px;
            cursor: text;
            min-height: 120px;
            user-select: none;
            text-align: center; /* Center the chunk visually */
        }

        .typing-area:focus-within {
            border-color: var(--yellow);
            box-shadow: 0 0 0 3px rgba(247, 147, 29, 0.2);
        }

        /* Hidden input element ensures mobile keyboard appears */
        #hidden-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            z-index: 1;
            cursor: text;
            resize: none;
        }

        #text-display {
            position: relative;
            z-index: 2;
            pointer-events: none;
        }

        .char { 
            color: var(--untyped-color); 
            transition: color 0.1s;
        }
        .char.correct { color: var(--correct-color); }
        .char.incorrect { 
            color: white; 
            background-color: var(--incorrect-color); 
            border-radius: 3px;
        }
        
        /* The active underline cursor */
        .char.cursor {
            border-bottom: 4px solid var(--yellow);
            color: var(--navy);
        }

        .bottom-controls {
            margin-top: 25px;
            text-align: center;
        }

        .reset-btn {
            background-color: var(--navy);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .reset-btn:hover {
            transform: translateY(-2px);
            background-color: #2a208c;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(27, 20, 100, 0.8);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            border-top: 6px solid var(--yellow);
        }

        .modal-score {
            font-size: 40px;
            color: var(--maroon);
            font-weight: bold;
            margin: 20px 0;
        }

        footer { 
            text-align: center; 
            padding: 20px; 
            color: #666; 
            border-top: 1px solid #ddd; 
            background-color: white;
            margin-top: auto;
        }

        @media (max-width: 600px) {
            .stats-bar { flex-direction: column; gap: 10px; align-items: center; }
            .typing-area { font-size: 20px; padding: 20px; }
            header { flex-direction: column; text-align: center; justify-content: center; }
            .header-left { flex-direction: column; }
            header img { margin: 0 0 10px 0; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <img src="Logo.jpg" alt="Delta Serlby Park Logo" onerror="this.src='https://placehold.co/100x60/ffffff/1B1464?text=DSP'">
            <div>
                <h1>Typing Assessment</h1>
                <p style="margin: 5px 0 0 0; color: #e0e0e0; font-size: 14px;">Year 7 Unit</p>
            </div>
        </div>
        <a href="index.html" class="back-btn">&larr; Back to Curriculum</a>
    </header>

    <main>
        <div class="test-container">
            <div class="controls">
                <button class="mode-btn active" onclick="selectTime(60, this)">1 Minute Test</button>
                <button class="mode-btn" onclick="selectTime(180, this)">3 Minute Test</button>
                <button class="mode-btn" onclick="selectTime(300, this)">5 Minute Test</button>
            </div>

            <div class="stats-bar">
                <div class="stat-box">Time Left: <span id="time-display">1:00</span></div>
                <div class="stat-box">WPM: <span id="wpm-display">0</span></div>
                <div class="stat-box">Accuracy: <span id="acc-display">100%</span></div>
            </div>

            <!-- The container for our chunks -->
            <div class="typing-area" onclick="document.getElementById('hidden-input').focus()">
                <textarea id="hidden-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
                <div id="text-display"></div>
            </div>

            <div class="bottom-controls">
                <button class="reset-btn" onclick="initTest()">Restart Test</button>
            </div>
        </div>
    </main>

    <!-- Modal for final results -->
    <div class="modal" id="result-modal">
        <div class="modal-content">
            <h2 style="color: var(--navy); margin-top: 0;">Test Complete!</h2>
            <div class="modal-score"><span id="final-wpm">0</span> WPM</div>
            <p style="font-size: 18px; font-weight: bold; color: var(--navy);">Accuracy: <span id="final-acc">0</span>%</p>
            <p style="color: #666; font-size: 14px; margin-top: 10px;">Show this screen to your teacher.</p>
            <button class="reset-btn" style="margin-top: 20px;" onclick="closeModal()">Close & Restart</button>
        </div>
    </div>

    <footer>
        &copy; 2026 Delta Serlby Park - Computing Department
    </footer>

    <script>
        // Computing-specific sentences for infinite generation
        const sentenceBank = [
            "A computer system is made up of hardware and software.",
            "Hardware consists of the physical parts you can touch like the keyboard and monitor.",
            "Software refers to the invisible programs and operating systems that make the hardware work.",
            "When working online e-safety is extremely important to protect your identity.",
            "Always keep your personal information secure and use strong passwords.",
            "Never share your login details with anyone even your friends.",
            "Data inside a computer is processed using a special language called binary code.",
            "Binary code only uses two numbers which are zero and one.",
            "These numbers represent the on and off states of tiny switches inside the processor.",
            "Every document and image is eventually converted into binary format.",
            "A local area network connects computers within a single building or site.",
            "The internet is an example of a wide area network that spans the globe.",
            "An algorithm is a step-by-step set of instructions used to solve a specific problem.",
            "Decomposition involves breaking down a complex problem into smaller manageable parts.",
            "Pattern recognition helps us find similarities to solve problems more efficiently.",
            "Phishing is a cyber attack that tries to trick you into revealing personal information.",
            "It is important to back up your files regularly to prevent data loss.",
            "A central processing unit acts as the main brain of the computer system.",
            "Random access memory is volatile and loses its data when the power is turned off."
        ];

        // DOM Elements
        const textDisplay = document.getElementById('text-display');
        const hiddenInput = document.getElementById('hidden-input');
        const timeDisplay = document.getElementById('time-display');
        const wpmDisplay = document.getElementById('wpm-display');
        const accDisplay = document.getElementById('acc-display');
        const modal = document.getElementById('result-modal');

        // State Variables
        let maxTime = 60; 
        let timeLeft = 60;
        let timeElapsed = 0;
        let timerInterval = null;
        let isTyping = false;
        
        // Chunking Variables
        let wordPool = [];
        let currentChunkText = "";
        let characterSpans = [];
        
        // Global Stats (Persist across chunk clears)
        let globalCorrectChars = 0;
        let globalTotalTyped = 0;

        function replenishWordPool() {
            // Keep the pool filled with at least 50 words
            while (wordPool.length < 50) {
                let randomIndex = Math.floor(Math.random() * sentenceBank.length);
                let words = sentenceBank[randomIndex].split(' ');
                wordPool.push(...words);
            }
        }

        function loadNextChunk() {
            replenishWordPool();
            
            // Take exactly 15 words from the pool
            let chunkWords = wordPool.splice(0, 15);
            
            // Join with spaces and add one trailing space to trigger the next chunk switch
            currentChunkText = chunkWords.join(' ') + ' ';
            
            // Reset the display
            textDisplay.innerHTML = '';
            characterSpans = [];
            hiddenInput.value = '';
            
            // Render the spans
            currentChunkText.split('').forEach(char => {
                const span = document.createElement('span');
                span.innerText = char;
                span.classList.add('char');
                textDisplay.appendChild(span);
                characterSpans.push(span);
            });

            // Set the active cursor on the first letter
            if (characterSpans.length > 0) {
                characterSpans[0].classList.add('cursor');
            }
        }

        function selectTime(seconds, btnElement) {
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            maxTime = seconds;
            initTest();
        }

        function initTest() {
            clearInterval(timerInterval);
            isTyping = false;
            timeLeft = maxTime;
            timeElapsed = 0;
            
            globalCorrectChars = 0;
            globalTotalTyped = 0;
            wordPool = [];
            
            loadNextChunk();
            
            updateTimeDisplay();
            wpmDisplay.innerText = '0';
            accDisplay.innerText = '100%';
            
            hiddenInput.disabled = false;
            hiddenInput.focus();
            modal.style.display = 'none';
        }

        hiddenInput.addEventListener('input', () => {
            if (timeLeft <= 0) return;

            if (!isTyping) {
                startTimer();
                isTyping = true;
            }

            const typedText = hiddenInput.value;
            let localCorrectChars = 0;

            // Update visuals for the current chunk
            characterSpans.forEach((span, index) => {
                span.className = 'char'; // Reset classes
                
                if (index < typedText.length) {
                    if (typedText[index] === currentChunkText[index]) {
                        span.classList.add('correct');
                        localCorrectChars++;
                    } else {
                        span.classList.add('incorrect');
                    }
                } else if (index === typedText.length) {
                    span.classList.add('cursor');
                }
            });

            // Calculate Live Stats
            let totalCorrectSoFar = globalCorrectChars + localCorrectChars;
            let totalTypedSoFar = globalTotalTyped + typedText.length;

            if (totalTypedSoFar > 0) {
                let accuracy = Math.round((totalCorrectSoFar / totalTypedSoFar) * 100);
                accDisplay.innerText = `${accuracy}%`;
            }

            if (timeElapsed > 0) {
                let minutesElapsed = timeElapsed / 60;
                let wpm = Math.round((totalCorrectSoFar / 5) / minutesElapsed);
                wpmDisplay.innerText = Math.max(0, wpm);
            }

            // Check if the user reached the end of the chunk
            if (typedText.length >= currentChunkText.length) {
                // Bank the stats
                globalCorrectChars += localCorrectChars;
                globalTotalTyped += typedText.length;
                
                // Instantly load the next block of text
                loadNextChunk();
            }
        });

        function startTimer() {
            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    timeElapsed++;
                    updateTimeDisplay();
                    
                    // Force WPM recalculation to penalize stopping
                    let localCorrectChars = document.querySelectorAll('.char.correct').length;
                    let totalCorrectSoFar = globalCorrectChars + localCorrectChars;
                    let minutesElapsed = timeElapsed / 60;
                    let wpm = Math.round((totalCorrectSoFar / 5) / minutesElapsed);
                    wpmDisplay.innerText = Math.max(0, wpm);
                } 
                
                if (timeLeft <= 0) {
                    endTest();
                }
            }, 1000);
        }

        function updateTimeDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timeDisplay.innerText = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        }

        function endTest() {
            clearInterval(timerInterval);
            hiddenInput.blur();
            hiddenInput.disabled = true; // Freeze input entirely
            isTyping = false;
            
            // Remove cursor visually
            const cursorSpan = document.querySelector('.char.cursor');
            if (cursorSpan) cursorSpan.classList.remove('cursor');

            // Show results modal
            document.getElementById('final-wpm').innerText = wpmDisplay.innerText;
            document.getElementById('final-acc').innerText = accDisplay.innerText.replace('%', '');
            modal.style.display = 'flex';
        }

        function closeModal() {
            modal.style.display = 'none';
            initTest();
        }

        // Ensure input stays focused if they click anywhere on the page
        document.addEventListener('click', (e) => {
            if(timeLeft > 0 && !modal.style.display.includes('flex')) {
                hiddenInput.focus();
            }
        });

        window.onload = initTest;
    </script>
</body>
</html>
