<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lesson 5 Assessment - Typing Test</title>
    <style>
        :root {
            /* Delta Serlby Park Color Scheme */
            --navy: #1B1464; 
            --yellow: #F7931D;
            --maroon: #822433;
            --bg-color: #f4f6f8;
            --text-color: #333;
            --light-gray: #e2e8f0;
            --correct-color: #1B1464;
            --incorrect-color: #822433;
            --untyped-color: #94a3b8;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header { 
            background-color: var(--navy); 
            color: white; 
            padding: 20px; 
            display: flex; 
            align-items: center; 
            border-bottom: 6px solid var(--maroon); 
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-left {
            display: flex;
            align-items: center;
        }

        header img { 
            height: 60px; 
            margin-right: 20px; 
            background-color: white; 
            border-radius: 8px; 
            padding: 5px;
        }

        h1 { 
            margin: 0; 
            font-size: 24px; 
        }

        .back-btn {
            background-color: var(--yellow);
            color: var(--navy);
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            transition: transform 0.2s, background-color 0.2s;
            font-size: 14px;
        }

        .back-btn:hover {
            transform: scale(1.05);
            background-color: #ff9d2a;
        }

        main { 
            padding: 30px 20px; 
            max-width: 900px; 
            margin: 0 auto; 
            width: 100%;
            box-sizing: border-box;
            flex: 1;
        }

        .test-container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-top: 5px solid var(--navy);
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .mode-btn {
            background-color: var(--light-gray);
            color: var(--text-color);
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .mode-btn.active, .mode-btn:hover {
            background-color: var(--yellow);
            color: var(--navy);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background-color: var(--navy);
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 18px;
            font-weight: bold;
        }

        .stat-box span {
            color: var(--yellow);
            font-size: 24px;
            margin-left: 8px;
        }

        /* Fixed height, scroll-hidden typing area */
        .typing-area {
            position: relative;
            font-size: 22px;
            line-height: 1.8;
            font-family: 'Consolas', 'Courier New', monospace;
            padding: 20px;
            background-color: #f8fafc;
            border: 2px solid var(--light-gray);
            border-radius: 8px;
            cursor: text;
            height: 180px; 
            overflow-y: hidden; /* Hide scrollbar for smooth visual */
            user-select: none;
        }

        .typing-area:focus-within {
            border-color: var(--yellow);
            box-shadow: 0 0 0 3px rgba(247, 147, 29, 0.2);
        }

        /* Hidden input element ensures mobile keyboard appears */
        #hidden-input {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            z-index: 1;
            cursor: text;
            resize: none;
        }

        #text-display {
            position: relative;
            z-index: 2;
            pointer-events: none;
        }

        .char { color: var(--untyped-color); }
        .char.correct { color: var(--correct-color); font-weight: bold; }
        .char.incorrect { 
            color: white; 
            background-color: var(--maroon); 
            border-radius: 2px;
        }
        
        /* The active blinking cursor */
        .char.cursor {
            border-left: 3px solid var(--yellow);
            animation: blink 1s infinite;
        }
        
        @keyframes blink {
            0%, 100% { border-color: var(--yellow); }
            50% { border-color: transparent; }
        }

        .bottom-controls {
            margin-top: 25px;
            text-align: center;
        }

        .reset-btn {
            background-color: var(--navy);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .reset-btn:hover {
            transform: translateY(-2px);
            background-color: #2a208c;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(27, 20, 100, 0.8);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            max-width: 400px;
            border-top: 6px solid var(--yellow);
        }

        .modal-score {
            font-size: 40px;
            color: var(--maroon);
            font-weight: bold;
            margin: 20px 0;
        }

        footer { 
            text-align: center; 
            padding: 20px; 
            color: #666; 
            border-top: 1px solid #ddd; 
            background-color: white;
            margin-top: auto;
        }

        @media (max-width: 600px) {
            .stats-bar { flex-direction: column; gap: 10px; align-items: center; }
            .typing-area { font-size: 18px; height: 160px; }
            header { flex-direction: column; text-align: center; justify-content: center; }
            .header-left { flex-direction: column; }
            header img { margin: 0 0 10px 0; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <img src="Logo.jpg" alt="Delta Serlby Park Logo" onerror="this.src='https://placehold.co/100x60/ffffff/1B1464?text=DSP'">
            <div>
                <h1>Typing Assessment</h1>
                <p style="margin: 5px 0 0 0; color: #e0e0e0; font-size: 14px;">Year 7 Unit</p>
            </div>
        </div>
        <a href="index.html" class="back-btn">&larr; Back to Curriculum</a>
    </header>

    <main>
        <div class="test-container">
            <div class="controls">
                <button class="mode-btn active" onclick="selectTime(60, this)">1 Minute Test</button>
                <button class="mode-btn" onclick="selectTime(180, this)">3 Minute Test</button>
                <button class="mode-btn" onclick="selectTime(300, this)">5 Minute Test</button>
            </div>

            <div class="stats-bar">
                <div class="stat-box">Time Left: <span id="time-display">1:00</span></div>
                <div class="stat-box">WPM: <span id="wpm-display">0</span></div>
                <div class="stat-box">Accuracy: <span id="acc-display">100%</span></div>
            </div>

            <div class="typing-area" onclick="document.getElementById('hidden-input').focus()">
                <textarea id="hidden-input" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
                <div id="text-display"></div>
            </div>

            <div class="bottom-controls">
                <button class="reset-btn" onclick="initTest()">Restart Test</button>
            </div>
        </div>
    </main>

    <!-- Modal strictly for showing final results (no submission form) -->
    <div class="modal" id="result-modal">
        <div class="modal-content">
            <h2 style="color: var(--navy); margin-top: 0;">Test Complete!</h2>
            <div class="modal-score"><span id="final-wpm">0</span> WPM</div>
            <p style="font-size: 18px; font-weight: bold; color: var(--navy);">Accuracy: <span id="final-acc">0</span>%</p>
            <button class="reset-btn" style="margin-top: 20px;" onclick="closeModal()">Close</button>
        </div>
    </div>

    <footer>
        &copy; 2026 Delta Serlby Park - Computing Department
    </footer>

    <script>
        // Computing-specific sentences for infinite generation
        const sentenceBank = [
            "A computer system is made up of hardware and software.",
            "Hardware consists of the physical parts you can touch like the keyboard and monitor.",
            "Software refers to the invisible programs and operating systems that make the hardware work.",
            "When working online e-safety is extremely important to protect your identity.",
            "Always keep your personal information secure and use strong passwords.",
            "Never share your login details with anyone even your friends.",
            "Data inside a computer is processed using a special language called binary code.",
            "Binary code only uses two numbers which are zero and one.",
            "These numbers represent the on and off states of tiny switches inside the processor.",
            "Every document and image is eventually converted into binary format.",
            "A local area network connects computers within a single building or site.",
            "The internet is an example of a wide area network that spans the globe.",
            "An algorithm is a step-by-step set of instructions used to solve a specific problem.",
            "Decomposition involves breaking down a complex problem into smaller manageable parts.",
            "Pattern recognition helps us find similarities to solve problems more efficiently.",
            "Phishing is a cyber attack that tries to trick you into revealing personal information.",
            "It is important to back up your files regularly to prevent data loss.",
            "A central processing unit acts as the main brain of the computer system.",
            "Random access memory is volatile and loses its data when the power is turned off."
        ];

        // DOM Elements
        const textDisplay = document.getElementById('text-display');
        const hiddenInput = document.getElementById('hidden-input');
        const timeDisplay = document.getElementById('time-display');
        const wpmDisplay = document.getElementById('wpm-display');
        const accDisplay = document.getElementById('acc-display');
        const modal = document.getElementById('result-modal');

        // State Variables
        let maxTime = 60; // Default 1 Minute
        let timeLeft = 60;
        let timeElapsed = 0;
        let timerInterval = null;
        let isTyping = false;
        let targetText = "";
        let characterSpans = [];

        function selectTime(seconds, btnElement) {
            // Update active styling
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            maxTime = seconds;
            initTest();
        }

        function initTest() {
            clearInterval(timerInterval);
            isTyping = false;
            timeLeft = maxTime;
            timeElapsed = 0;
            
            hiddenInput.value = '';
            targetText = "";
            textDisplay.innerHTML = '';
            characterSpans = [];
            
            // Add initial block of text
            addMoreText(5); 
            
            updateTimeDisplay();
            wpmDisplay.innerText = '0';
            accDisplay.innerText = '100%';
            
            // Focus input to start
            hiddenInput.disabled = false;
            hiddenInput.focus();
        }

        function addMoreText(sentenceCount = 2) {
            let newSentences = [];
            for(let i = 0; i < sentenceCount; i++) {
                let randomIndex = Math.floor(Math.random() * sentenceBank.length);
                newSentences.push(sentenceBank[randomIndex]);
            }
            
            let stringToAdd = newSentences.join(" ");
            // Add a leading space if we already have text
            if (targetText.length > 0) {
                stringToAdd = " " + stringToAdd;
            }
            
            targetText += stringToAdd;

            // Generate spans for new text
            stringToAdd.split('').forEach((char) => {
                const span = document.createElement('span');
                span.innerText = char;
                span.classList.add('char');
                textDisplay.appendChild(span);
                characterSpans.push(span);
            });

            // Re-apply cursor if needed
            if (!isTyping || hiddenInput.value.length === 0) {
                characterSpans[0].classList.add('cursor');
            }
        }

        hiddenInput.addEventListener('input', () => {
            if (timeLeft <= 0) return; // Ignore typing if test is over

            if (!isTyping) {
                startTimer();
                isTyping = true;
            }

            const typedText = hiddenInput.value;
            let correctChars = 0;

            // Check if we are nearing the end of the generated text (within 100 characters)
            if (targetText.length - typedText.length < 100) {
                addMoreText(3); // Inject more text dynamically
            }

            // Loop through and update character spans based on input
            characterSpans.forEach((span, index) => {
                span.classList.remove('correct', 'incorrect', 'cursor');
                
                if (index < typedText.length) {
                    // Character has been typed
                    if (typedText[index] === span.innerText) {
                        span.classList.add('correct');
                        correctChars++;
                    } else {
                        span.classList.add('incorrect');
                    }
                } else if (index === typedText.length) {
                    // Current cursor position
                    span.classList.add('cursor');
                }
            });

            // Auto-scroll the view to the current cursor position smoothly
            const cursorSpan = document.querySelector('.char.cursor');
            if (cursorSpan) {
                cursorSpan.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            // Calculate live Accuracy
            let accuracy = 100;
            if (typedText.length > 0) {
                accuracy = Math.round((correctChars / typedText.length) * 100);
            }
            accDisplay.innerText = `${accuracy}%`;

            // Calculate live WPM
            if (timeElapsed > 0) {
                const minutesElapsed = timeElapsed / 60;
                const wpm = Math.round((correctChars / 5) / minutesElapsed);
                wpmDisplay.innerText = Math.max(0, wpm);
            }
        });

        function startTimer() {
            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    timeElapsed++;
                    updateTimeDisplay();
                    
                    // Force WPM recalculation every second to degrade if they stop typing
                    const typedText = hiddenInput.value;
                    let correctChars = document.querySelectorAll('.char.correct').length;
                    const minutesElapsed = timeElapsed / 60;
                    const wpm = Math.round((correctChars / 5) / minutesElapsed);
                    wpmDisplay.innerText = Math.max(0, wpm);
                } 
                
                // End test if time runs out
                if (timeLeft <= 0) {
                    endTest();
                }
            }, 1000);
        }

        function updateTimeDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            timeDisplay.innerText = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
        }

        function endTest() {
            clearInterval(timerInterval);
            hiddenInput.blur();
            hiddenInput.disabled = true; // Prevent further typing
            isTyping = false;
            
            // Remove cursor visually
            const cursorSpan = document.querySelector('.char.cursor');
            if (cursorSpan) cursorSpan.classList.remove('cursor');

            // Show results modal
            document.getElementById('final-wpm').innerText = wpmDisplay.innerText;
            document.getElementById('final-acc').innerText = accDisplay.innerText.replace('%', '');
            modal.style.display = 'flex';
        }

        function closeModal() {
            modal.style.display = 'none';
        }

        // Initialize on load
        window.onload = initTest;
    </script>
</body>
</html>
