<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta Serlby Park - Computing</title>
    <style>
        :root {
            /* Delta Serlby Park Color Scheme */
            --navy: #1B1464; 
            --yellow: #F7931D;
            --maroon: #822433;
            --bg-color: #f4f6f8;
            --text-color: #333;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
        }

        header { 
            background-color: var(--navy); 
            color: white; 
            padding: 20px; 
            display: flex; 
            align-items: center; 
            border-bottom: 6px solid var(--maroon); 
        }

        header img { 
            height: 80px; 
            margin-right: 20px; 
            background-color: white; 
            border-radius: 8px; 
            padding: 5px;
        }

        h1 { 
            margin: 0; 
            font-size: 28px; 
            letter-spacing: 1px;
        }

        nav { 
            background-color: white; 
            padding: 15px 20px; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
            display: flex; 
            gap: 15px; 
            justify-content: center;
        }

        nav button { 
            background-color: var(--navy); 
            color: white; 
            border: none; 
            padding: 12px 25px; 
            cursor: pointer; 
            font-size: 16px; 
            border-radius: 6px; 
            font-weight: bold; 
            transition: all 0.3s ease; 
        }

        nav button:hover, nav button.active { 
            background-color: var(--yellow); 
            color: var(--navy); 
            transform: scale(1.05);
        }

        main { 
            padding: 30px 20px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }

        #year-title {
            color: var(--navy);
            border-bottom: 3px solid var(--maroon);
            padding-bottom: 10px;
            margin-bottom: 30px;
        }

        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); 
            gap: 25px; 
        }

        .card { 
            background: white; 
            border-radius: 8px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
            overflow: hidden; 
            border-top: 5px solid var(--navy); 
            transition: transform 0.2s, border-color 0.3s; 
        }

        .card:hover { 
            transform: translateY(-5px); 
            border-top-color: var(--yellow); 
        }

        .card-header { 
            background-color: rgba(27, 20, 100, 0.05); 
            color: var(--navy); 
            padding: 15px 20px; 
            font-size: 20px; 
            font-weight: bold; 
            border-bottom: 1px solid #eaeaea;
        }

        .card-body { 
            padding: 20px; 
        }

        /* Essential formatting for easy-to-read lists */
        .card-body ul { 
            margin: 0; 
            padding-left: 20px; 
            line-height: 1.8; 
        }

        .card-body li { 
            margin-bottom: 8px; 
        }

        footer { 
            text-align: center; 
            padding: 25px; 
            color: #666; 
            margin-top: 50px; 
            border-top: 1px solid #ddd; 
            background-color: white;
        }
    </style>
</head>
<body>

    <header>
        <!-- Ensure this image file is uploaded to the same folder as this index.html on GitHub -->
        <img src="Logo.jpg" alt="Delta Serlby Park Logo">
        <div>
            <h1>Serlby Park Computing</h1>
        </div>
    </header>

    <nav>
        <button id="btn-year7" class="active" onclick="loadYear('year7')">Year 7</button>
        <button id="btn-year8" onclick="loadYear('year8')">Year 8</button>
        <button id="btn-year9" onclick="loadYear('year9')">Year 9</button>
    </nav>

    <main>
        <h2 id="year-title">Year 7 Curriculum</h2>
        <div id="content-grid" class="grid">
            <!-- Cards will be dynamically injected here by the script -->
        </div>
    </main>

    <footer>
        &copy; 2026 Delta Serlby Park - Computing Department
    </footer>

    <script>
        // Data structure containing the half-termly topics
        const curriculumData = {
          year7: [
            { title: "Delta Welcome", description: "<ul><li>Introduction & Computational Thinking</li><li>Keyboard & Mouse Skills</li><li>File Management & Researching</li><li>E-Safety</li><li>Assessment</li></ul>" },
            { title: "Microsoft Tools", description: "<ul><li>Word</li><li>PowerPoint</li><li>Email</li></ul>" },
            { title: "Binary", description: "<ul><li>Binary to Denary</li><li>Denary to Binary</li></ul>" },
            { title: "Vector Graphics", description: "<ul><li>Pixel Power</li><li>Shape Squad</li><li>Build & Combine</li><li>Path Pros</li><li>Design Mission</li><li>Graphics Gallery</li></ul>" },
            { title: "Computational Thinking", description: "<ul><li>Abstraction</li><li>Decomposition</li><li>Pattern Recognition</li><li>Algorithms</li><li>Flowcharts</li></ul>" },
            { title: "Hardware & Software", description: "<ul><li>Hardware vs Software</li><li>Computer Systems</li><li>Inputs & Outputs</li><li>Storage</li><li>Graphics & Processing</li></ul>" },
            { title: "iDEA Award", description: "<ul><li>Citizen</li><li>Worker</li><li>Maker</li><li>Entrepreneur</li><li>Bronze Award</li></ul>" }
          ],
          year8: [
            { title: "E-Safety & Spreadsheets", description: "<ul><li>E-Safety</li><li>Data Entry</li><li>Formulas</li><li>Functions</li><li>Assessment</li></ul>" },
            { title: "Pixel Art", description: "<ul><li>Basic Designs</li><li>Character Creation</li></ul>" },
            { title: "Logical Thinking", description: "<ul><li>Computational Thinking Recap</li><li>Binary Conversions Recap</li><li>Binary Addition</li></ul>" },
            { title: "Edu Blocks", description: "<ul><li>Code Kickoff</li><li>Variable Vault</li><li>Input Impact</li><li>Choice Control</li><li>Loop Lab</li><li>The Big Build</li></ul>" },
            { title: "Gaming", description: "<ul><li>Gaming Hardware</li><li>Objectives</li><li>Characters</li><li>Project & Showcase</li></ul>" },
            { title: "Computing History", description: "<ul><li>1940 - 1959</li><li>1960 - 1979</li><li>1980 - 1999</li><li>2000 - 2019</li><li>2020 - Present Day</li><li>Timeline</li></ul>" },
            { title: "Minecraft Coding", description: "<ul><li>Python Coding Integration</li><li>Challenges & Projects</li></ul>" }
          ],
          year9: [
            { title: "E-Safety & Python Programming", description: "<ul><li>E-Safety</li><li>Sequence</li><li>Selection</li><li>Iteration</li><li>Assessment</li></ul>" },
            { title: "Binary & Cyber Security", description: "<ul><li>Binary Conversions</li><li>Binary Addition & Shifts</li><li>Hexadecimal</li><li>Cyber Security Basics</li><li>Hero or Criminal?</li><li>Malware</li></ul>" },
            { title: "Business", description: "<ul><li>Business Basics</li><li>Behind the Scenes</li><li>Brand Power</li><li>Decision Making</li><li>The Apprentice Challenge</li><li>The Big Showcase</li></ul>" },
            { title: "Digital World", description: "<ul><li>Images</li><li>Compression (Lossy / Lossless)</li><li>Networks (LAN & WAN)</li><li>Logic Gates (inc Boolean)</li><li>Character Sets (ASCII / UNICODE)</li></ul>" },
            { title: "AI & Ethics", description: "<ul><li>What is AI?</li><li>The Reality of AI</li><li>How AI Learns</li><li>Algorithmic Bias</li><li>Responsibility & Policy</li><li>The Grand Summary</li></ul>" },
            { title: "Photoshop", description: "<ul><li>Object Selection</li><li>Airbrushing</li><li>Filters</li><li>Composites</li><li>Final Project</li></ul>" }
          ]
        };

        // Function to load the appropriate cards when a button is clicked
        function loadYear(year) {
            // Update the navigation button styles
            document.querySelectorAll('nav button').forEach(btn => btn.classList.remove('active'));
            document.getElementById('btn-' + year).classList.add('active');

            // Update the main heading
            const titles = { year7: 'Year 7 Curriculum', year8: 'Year 8 Curriculum', year9: 'Year 9 Curriculum' };
            document.getElementById('year-title').innerText = titles[year];

            // Render the curriculum cards
            const grid = document.getElementById('content-grid');
            grid.innerHTML = ''; // Clear out the old cards
            
            curriculumData[year].forEach(unit => {
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-header">${unit.title}</div>
                    <div class="card-body">
                        ${unit.description}
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Initialize the page with Year 7 loaded by default
        window.onload = () => loadYear('year7');
    </script>
</body>
</html>
