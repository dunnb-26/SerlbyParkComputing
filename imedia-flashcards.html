    <style>
        /* Master Template Layout Overrides */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: #f4f6f8; 
            color: #333; 
        }
           
        .flashcard-container {
            padding: 40px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }
        .topic-section {
            margin-bottom: 60px;
        }
        .topic-section h2 {
            color: #1B1464;
            text-align: left;
            margin-bottom: 30px;
            border-bottom: 3px solid #822433;
            padding-bottom: 10px;
            font-size: 2em;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
        }

        .flip-card {
            background-color: transparent;
            width: 100%;
            height: 240px;
            perspective: 1000px;
            cursor: pointer;
        }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }
        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
            border-radius: 8px;
        }
        .flip-card-front {
            background-color: white;
            color: #1B1464;
            border-top: 6px solid #822433;
        }
        .flip-card-front .hint-text {
            font-size: 0.85em;
            color: #888;
            margin-top: 15px;
            font-weight: normal;
        }
        .flip-card-front h3 {
            margin: 0;
            font-size: 1.1em;
            line-height: 1.4;
        }
        .flip-card-back {
            background-color: #1B1464;
            color: white;
            transform: rotateY(180deg);
            border-top: 6px solid #dfaa2b;
            overflow-y: auto;
        }
        .flip-card-back p {
            margin: 0;
            font-size: 1.05em;
            line-height: 1.5;
        }
        footer { 
            text-align: center; 
            padding: 25px; 
            color: #666; 
            margin-top: 50px; 
            border-top: 1px solid #ddd; 
            background-color: white;
        }
