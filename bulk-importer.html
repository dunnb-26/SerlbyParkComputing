<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Firebase Student Importer</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f6f8; padding: 40px; }
        .card { background: white; max-width: 600px; margin: 0 auto 30px auto; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); border-top: 6px solid #1e3a8a; }
        input[type="file"], input[type="text"], input[type="password"] { width: 100%; padding: 10px; margin: 10px 0 20px 0; display: block; font-size: 16px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #dfaa2b; color: #1e3a8a; border: none; padding: 12px 25px; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 16px; width: 100%; }
        button:hover { background: #c99722; }
        .divider { margin: 30px 0; border: 0; border-top: 1px solid #eee; }
        #log { background: #000; color: #4af626; padding: 15px; border-radius: 4px; height: 250px; overflow-y: auto; font-family: monospace; margin-top: 20px; font-size: 13px; }
        label { font-weight: bold; font-size: 14px; color: #333; }
    </style>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div class="card">
        <h2 style="color: #1e3a8a; margin-top:0;">Student Account Importer</h2>
        
        <!-- SINGLE STUDENT IMPORT SECTION -->
        <h3 style="color: #1e3a8a; margin-bottom: 5px;">Add Single Student</h3>
        <label for="singleUsername">Username (e.g. jsmith)</label>
        <input type="text" id="singleUsername" placeholder="Enter username...">

        <label for="singleFullName">Full Name</label>
        <input type="text" id="singleFullName" placeholder="Enter full name...">

        <label for="singleClass">Class Name</label>
        <input type="text" id="singleClass" placeholder="Enter class name...">

        <label for="singlePassword">Password / PIN</label>
        <input type="password" id="singlePassword" placeholder="Enter password...">

        <button onclick="addSingleStudent()">Register Single Student</button>

        <hr class="divider">

        <!-- BULK CSV IMPORT SECTION -->
        <h3 style="color: #1e3a8a; margin-bottom: 5px;">Bulk Import from CSV</h3>
        <p style="margin-top: 5px; font-size: 14px; color: #666;">Select your <strong>students.csv</strong> file below to automatically register multiple students.</p>
        
        <input type="file" id="csvFile" accept=".csv">
        <button onclick="startImport()">Start Bulk Import</button>

        <!-- LOG BOX -->
        <div id="log">Awaiting action...</div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDiRDdgM7VCOxEVob_pZ73AvZaNb7SvA9Y",
            authDomain: "serlby-park-computing.firebaseapp.com",
            projectId: "serlby-park-computing",
            storageBucket: "serlby-park-computing.firebasestorage.app",
            messagingSenderId: "648533806051",
            appId: "1:648533806051:web:1e42a4263dfb1fd8e72ed6",
            measurementId: "G-HDNYEE11WV"
        };

        // Initialize Firebase if not already initialized
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        function logMessage(msg) {
            const logBox = document.getElementById('log');
            logBox.innerHTML += msg + "<br>";
            logBox.scrollTop = logBox.scrollHeight;
        }

        // --- SINGLE STUDENT REGISTRATION FUNCTION ---
        async function addSingleStudent() {
            const username = document.getElementById('singleUsername').value.trim().toLowerCase();
            const fullName = document.getElementById('singleFullName').value.trim();
            const className = document.getElementById('singleClass').value.trim();
            const password = document.getElementById('singlePassword').value.trim();

            if (!username || !fullName || !className || !password) {
                alert("Please fill in all fields for the single student import.");
                return;
            }

            let email = username + "@deltaschool.local";

            try {
                logMessage(`Attempting to register single student: ${fullName}...`);
                
                // 1. Create user in Firebase Auth
                let userCredential = await auth.createUserWithEmailAndPassword(email, password);
                let uid = userCredential.user.uid;

                // 2. Save profile in Firestore users collection
                await db.collection('users').doc(uid).set({
                    username: username,
                    fullName: fullName,
                    className: className,
                    createdAt: Date.now()
                });

                logMessage(`✅ Successfully registered single student: ${fullName} (${className})`);
                
                // Clear form fields after success
                document.getElementById('singleUsername').value = '';
                document.getElementById('singleFullName').value = '';
                document.getElementById('singleClass').value = '';
                document.getElementById('singlePassword').value = '';

            } catch (err) {
                logMessage(`❌ Error registering ${username}: ${err.message}`);
            }
        }

        // --- BULK CSV IMPORT FUNCTION ---
        async function startImport() {
            const fileInput = document.getElementById('csvFile');
            if (fileInput.files.length === 0) {
                alert("Please select your students.csv file first!");
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = async function(e) {
                const text = e.target.result;
                const rows = text.split('\n');
                
                logMessage(`Found ${rows.length - 1} rows in CSV. Starting bulk import...`);

                // Loop through CSV rows (skipping header row 0)
                for (let i = 1; i < rows.length; i++) {
                    let row = rows[i].trim();
                    if (!row) continue;

                    let cols = row.split(',');
                    if (cols.length < 4) continue;

                    let username = cols[0].trim().toLowerCase();
                    let pin = cols[1].trim();
                    let fullName = cols[2].trim();
                    let className = cols[3].trim();
                    let email = username + "@deltaschool.local";

                    try {
                        // 1. Create user in Firebase Auth
                        let userCredential = await auth.createUserWithEmailAndPassword(email, pin);
                        let uid = userCredential.user.uid;

                        // 2. Save profile in Firestore users collection
                        await db.collection('users').doc(uid).set({
                            username: username,
                            fullName: fullName,
                            className: className,
                            createdAt: Date.now()
                        });

                        logMessage(`✅ Successfully imported: ${fullName} (${className})`);
                    } catch (err) {
                        logMessage(`❌ Error for ${username}: ${err.message}`);
                    }
                }
                logMessage("🎉 Bulk import process finished!");
            };

            reader.readAsText(file);
        }
    </script>
</body>
</html>
