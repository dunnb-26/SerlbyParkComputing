<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student Accounts</title>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            /* Delta Serlby Park Color Scheme */
            --navy: #1B1464; 
            --yellow: #F7931D;
            --maroon: #822433;
            --bg-color: #f4f6f8;
            --text-color: #333;
            --btn-gold: #e2a829;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
        }

        header { 
            background-color: var(--navy); 
            color: white; 
            padding: 20px; 
            display: grid; 
            grid-template-columns: 1fr auto 1fr; 
            align-items: center; 
            border-bottom: 6px solid var(--maroon); 
        }

        .header-left { display: flex; justify-content: flex-start; }
        .header-center { text-align: center; }
        .header-right { display: flex; justify-content: flex-end; align-items: center; }

        header img { 
            height: 80px; 
            background-color: white; 
            border-radius: 8px; 
            padding: 5px;
        }

        header h1 { 
            margin: 0; 
            font-size: 28px; 
            letter-spacing: 1px;
        }
        
        .task-plenary { border-top: 6px solid #673ab7; } 
        .task-plenary h2 { color: #673ab7; margin-top: 0; }
        
        .back-btn {
            background-color: var(--yellow);
            color: var(--navy);
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            transition: transform 0.2s;
        }
        .back-btn:hover { transform: scale(1.05); }

        /* Scoreboard Banner */
        .scoreboard {
            max-width: 1450px;
            margin: 20px auto 0 auto;
            padding: 15px 25px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 5px solid var(--maroon);
            font-weight: bold;
            color: var(--navy);
            gap: 15px;
            flex-wrap: wrap;
        }
        .score-item { text-align: center; font-size: 0.95em; }
        .score-item span {
            display: block;
            font-size: 1.2em;
            color: #666;
            margin-top: 5px;
        }
        .status-started { color: #388e3c !important; font-weight: bold; }

        /* Task Card Styling for Prep Section */
        .task-card { 
            background: white; 
            border-radius: 8px; 
            padding: 25px; 
            margin: 30px auto 20px auto; 
            max-width: 900px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            page-break-inside: avoid; 
            box-sizing: border-box;
        }
        .task-prep { border-top: 6px solid #607d8b; } 
        .task-prep h2 { color: #607d8b; margin-top: 0; }

        /* Inputs & Textareas */
        .question-row { margin-bottom: 20px; }
        .question-label { display: block; font-size: 16px; margin-bottom: 8px; color: #333; font-weight: bold; }
        .auto-input { width: 100%; padding: 12px; font-size: 16px; border: 2px solid #ccc; border-radius: 4px; transition: all 0.3s ease; box-sizing: border-box; background-color: white; font-family: inherit; }
        .auto-input:focus { outline: none; border-color: #666; }
        textarea.auto-input { resize: vertical; min-height: 80px; overflow-y: hidden; }

        /* 3-Column Layout for Simulator */
        .ide-container {
            display: grid;
            grid-template-columns: 1fr 1.5fr 1fr;
            gap: 20px;
            max-width: 1450px;
            margin: 20px auto;
            padding: 0 20px;
        }

        @media (max-width: 1100px) {
            .ide-container { grid-template-columns: 1fr; }
        }

        .ide-panel {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-top: 5px solid var(--navy);
            display: flex;
            flex-direction: column;
        }
        
        .editor-panel { border-top-color: #217346; align-items: center; } 
        .output-panel { border-top-color: var(--maroon); }

        .ide-panel h3 {
            margin-top: 0;
            color: var(--navy);
            text-transform: uppercase;
            font-size: 1.1em;
        }

        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: inherit;
        }

        #instruction-panel {
            background-color: #f8f9fa;
            border-left: 4px solid var(--navy);
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 0 4px 4px 0;
            font-family: inherit;
            font-size: 14px;
            color: #333;
            flex-grow: 1;
            line-height: 1.6;
        }

        /* Excel-Style Pixel Grid */
        #spreadsheet-container {
            width: 100%;
            display: flex;
            justify-content: center;
            margin-top: 5px;
        }

        .excel-table {
            border-collapse: collapse;
            background-color: white;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .excel-table td {
            border: 1px solid #d0d7e5;
            padding: 0;
            width: 42px;
            height: 42px;
            position: relative;
        }

        .pixel-input {
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            border: 2px solid transparent;
            text-align: center;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            font-weight: bold;
            color: #333;
            /* Graph paper pattern for unattempted cells */
            background-color: #fafafa;
            background-image: linear-gradient(90deg, rgba(0,0,0,0.06) 1px, transparent 1px), 
                              linear-gradient(0deg, rgba(0,0,0,0.06) 1px, transparent 1px);
            background-size: 10px 10px;
            outline: none;
            transition: all 0.2s;
        }

        .pixel-input:focus {
            border: 2px solid #217346;
            background-color: rgba(255,255,255,0.95) !important;
            background-image: none !important;
            color: #000 !important;
            text-shadow: none !important;
        }

        .pixel-input.valid {
            color: transparent;
            background-image: none !important;
        }

        /* Color Legend Area */
        .legend-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px 12px;
            margin-top: 10px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            font-size: 13px;
            color: #333;
            font-weight: bold;
            background: #f8f9fa;
            padding: 6px;
            border-radius: 4px;
            border: 1px solid #eee;
        }

        .color-box {
            width: 18px;
            height: 18px;
            border: 1px solid #ccc;
            border-radius: 3px;
            margin-right: 8px;
        }

        /* Buttons */
        .btn-pdf { background-color: #217346; color: white; border: none; padding: 15px 30px; border-radius: 4px; font-size: 18px; font-weight: bold; cursor: pointer; transition: background-color 0.2s; display: block; text-align: center; width: 100%; max-width: 300px; }
        .btn-pdf:hover { background-color: #124d2d; }
        
        footer { text-align: center; padding: 25px; color: #666; margin-top: 50px; border-top: 1px solid #ddd; background-color: white; }
    </style>
</head>
<body>

    <!-- HEADER -->
    <header>
        <div class="header-left">
            <a href="index.html"><img src="logo.jpg" alt="Logo"></a>
        </div>
        <div class="header-center">
            <h1>Add Student Accounts</h1>
        </div>
        <div class="header-right">
            <a href="javascript:history.back()" class="back-btn">&larr; Back to Dashboard</a>
        </div>
    </header>

    <!-- MAIN CONTENT -->
    <div class="card">
        <h2 style="color: #1e3a8a; margin-top:0;">Register Student Accounts</h2>
        
        <!-- SINGLE STUDENT IMPORT SECTION -->
        <h3 style="color: #1e3a8a; margin-bottom: 5px;">Add Single Student</h3>
        
        <label for="singleUsername">Username (e.g. jsmith)</label>
        <input type="text" id="singleUsername" placeholder="Enter username...">

        <label for="singleFullName">Full Name</label>
        <input type="text" id="singleFullName" placeholder="Enter full name...">

        <label for="singleClass">Class Name</label>
        <select id="singleClass">
            <option value="" disabled selected>Select a class...</option>
            <optgroup label="Year 7">
                <option value="7x1">7x1</option>
                <option value="7x2">7x2</option>
                <option value="7y1">7y1</option>
                <option value="7y2">7y2</option>
            </optgroup>
            <optgroup label="Year 8">
                <option value="8x1">8x1</option>
                <option value="8x2">8x2</option>
                <option value="8y1">8y1</option>
                <option value="8y2">8y2</option>
            </optgroup>
            <optgroup label="Year 9">
                <option value="9x1">9x1</option>
                <option value="9x2">9x2</option>
                <option value="9y1">9y1</option>
                <option value="9y2">9y2</option>
            </optgroup>
            <optgroup label="GCSE Options">
                <option value="10aEnt1">10aEnt1 (Enterprise)</option>
                <option value="11aEnt1">11aEnt1 (Enterprise)</option>
                <option value="10bCim1">10bCim1 (iMedia)</option>
                <option value="11bCim1">11bCim1 (iMedia)</option>
            </optgroup>
            <option value="Unassigned">Unassigned</option>
        </select>

        <label for="singlePassword">Password / PIN</label>
        <input type="password" id="singlePassword" placeholder="Enter password...">

        <button onclick="addSingleStudent()">Register Single Student</button>

        <hr class="divider">

        <!-- BULK CSV IMPORT SECTION -->
        <h3 style="color: #1e3a8a; margin-bottom: 5px;">Bulk Import from CSV</h3>
        <p style="margin-top: 5px; font-size: 14px; color: #666;">Select your <strong>students.csv</strong> file below to automatically register multiple students.</p>
        
        <input type="file" id="csvFile" accept=".csv">
        <button onclick="startImport()">Start Bulk Import</button>

        <!-- LOG BOX -->
        <div id="log">Awaiting action...</div>
    </div>

    <!-- FOOTER -->
    <footer>
        &copy; 2026 Delta Serlby Park - Computing & Business Department
    </footer>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDiRDdgM7VCOxEVob_pZ73AvZaNb7SvA9Y",
            authDomain: "serlby-park-computing.firebaseapp.com",
            projectId: "serlby-park-computing",
            storageBucket: "serlby-park-computing.firebasestorage.app",
            messagingSenderId: "648533806051",
            appId: "1:648533806051:web:1e42a4263dfb1fd8e72ed6",
            measurementId: "G-HDNYEE11WV"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();

        function logMessage(msg) {
            const logBox = document.getElementById('log');
            logBox.innerHTML += msg + "<br>";
            logBox.scrollTop = logBox.scrollHeight;
        }

        // --- SINGLE STUDENT REGISTRATION FUNCTION ---
        async function addSingleStudent() {
            const username = document.getElementById('singleUsername').value.trim().toLowerCase();
            const fullName = document.getElementById('singleFullName').value.trim();
            const className = document.getElementById('singleClass').value;
            const password = document.getElementById('singlePassword').value.trim();

            if (!username || !fullName || !className || !password) {
                alert("Please fill in all fields (including selecting a class) for the single student import.");
                return;
            }

            let email = username + "@deltaschool.local";

            try {
                logMessage(`Attempting to register single student: ${fullName}...`);
                
                let userCredential = await auth.createUserWithEmailAndPassword(email, password);
                let uid = userCredential.user.uid;

                await db.collection('users').doc(uid).set({
                    username: username,
                    fullName: fullName,
                    className: className,
                    createdAt: Date.now()
                });

                logMessage(`✅ Successfully registered single student: ${fullName} (${className})`);
                
                document.getElementById('singleUsername').value = '';
                document.getElementById('singleFullName').value = '';
                document.getElementById('singleClass').selectedIndex = 0;
                document.getElementById('singlePassword').value = '';

            } catch (err) {
                logMessage(`❌ Error registering ${username}: ${err.message}`);
            }
        }

        // --- BULK CSV IMPORT FUNCTION ---
        async function startImport() {
            const fileInput = document.getElementById('csvFile');
            if (fileInput.files.length === 0) {
                alert("Please select your students.csv file first!");
                return;
            }

            const file = fileInput.files[0];
            const reader = new FileReader();

            reader.onload = async function(e) {
                const text = e.target.result;
                const rows = text.split('\n');
                
                logMessage(`Found ${rows.length - 1} rows in CSV. Starting bulk import...`);

                for (let i = 1; i < rows.length; i++) {
                    let row = rows[i].trim();
                    if (!row) continue;

                    let cols = row.split(',');
                    if (cols.length < 4) continue;

                    let username = cols[0].trim().toLowerCase();
                    let pin = cols[1].trim();
                    let fullName = cols[2].trim();
                    let className = cols[3].trim();
                    let email = username + "@deltaschool.local";

                    try {
                        let userCredential = await auth.createUserWithEmailAndPassword(email, pin);
                        let uid = userCredential.user.uid;

                        await db.collection('users').doc(uid).set({
                            username: username,
                            fullName: fullName,
                            className: className,
                            createdAt: Date.now()
                        });

                        logMessage(`✅ Successfully imported: ${fullName} (${className})`);
                    } catch (err) {
                        logMessage(`❌ Error for ${username}: ${err.message}`);
                    }
                }
                logMessage("🎉 Bulk import process finished!");
            };

            reader.readAsText(file);
        }
    </script>
</body>
</html>
