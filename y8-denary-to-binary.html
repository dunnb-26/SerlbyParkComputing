<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard - Live Portfolio</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f6f8;
            margin: 0;
        }

        .dashboard-layout {
            display: grid;
            grid-template-columns: 310px 1fr;
            gap: 20px;
            max-width: 1450px;
            margin: 20px auto;
            padding: 0 20px;
            box-sizing: border-box;
        }

        /* Sidebar */
        .sidebar {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            border-top: 6px solid #1e3a8a;
            height: 85vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .sidebar h3 {
            margin: 0 0 12px 0;
            color: #1e3a8a;
        }

        select, .sidebar-search {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-weight: bold;
            box-sizing: border-box;
        }

        .sidebar-search {
            font-weight: normal;
        }

        #student-list {
            flex-grow: 1;
            overflow-y: auto;
            margin-top: 6px;
            padding-right: 4px;
        }

        .student-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 11px 12px;
            margin-bottom: 8px;
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 6px;
            text-align: left;
            font-weight: bold;
            font-size: 0.95em;
            cursor: pointer;
            transition: 0.2s;
            color: #1e293b;
        }

        .student-btn:hover, .student-btn.active {
            background: #1e3a8a;
            color: white;
            border-color: #1e3a8a;
        }

        .class-badge {
            background: #dfaa2b;
            color: #1e3a8a;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: bold;
            flex-shrink: 0;
        }

        /* Main View: Live Iframe Window */
        .main-view {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            border-top: 6px solid #dfaa2b;
            height: 85vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-sizing: border-box;
        }

        .workspace-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border-bottom: 3px solid #1e3a8a;
            padding-bottom: 12px;
            margin-bottom: 14px;
            flex-shrink: 0;
        }

        iframe {
            flex-grow: 1;
            width: 100%;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            background: #f8f9fa;
        }

        .header-btn {
            background: #dfaa2b;
            color: #1e3a8a;
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9em;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .header-btn:hover {
            background: #c99722;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <a href="index.html"><img src="logo.jpg" alt="Delta Serlby Park Logo"></a>
        </div>
        <div class="header-center">
            <h1>Teacher Live Portal</h1>
        </div>
        <div class="header-right" style="display: flex; gap: 8px; align-items: center;">
            <a href="bulk-importer.html" class="header-btn" style="background: #607d8b; color: white;">📥 Bulk Importer</a>
            <a href="leaderboard.html" class="header-btn" style="background: #1e3a8a; color: white;">🏆 Leaderboards</a>
            <button class="header-btn" onclick="fetchStudents()">↻ Refresh Roster</button>
            <a href="index.html" class="header-btn" style="background: white;">&larr; Curriculum</a>
        </div>
    </header>

    <div class="dashboard-layout">
        <!-- Sidebar: Class Filter & Student Roster -->
        <div class="sidebar">
            <h3>Class Roster</h3>
            <select id="class-filter" onchange="renderSidebar()">
                <option value="ALL">All Classes</option>
                <option value="Unassigned">⚠️ Unassigned</option>
                <optgroup label="Year 7">
                    <option value="7x1">7x1</option>
                    <option value="7x2">7x2</option>
                    <option value="7y1">7y1</option>
                    <option value="7y2">7y2</option>
                </optgroup>
                <optgroup label="Year 8">
                    <option value="8x1">8x1</option>
                    <option value="8x2">8x2</option>
                    <option value="8y1">8y1</option>
                    <option value="8y2">8y2</option>
                </optgroup>
                <optgroup label="Year 9">
                    <option value="9x1">9x1</option>
                    <option value="9x2">9x2</option>
                    <option value="9y1">9y1</option>
                    <option value="9y2">9y2</option>
                </optgroup>
                <optgroup label="GCSE Options">
                    <option value="10aEnt1">10aEnt1 (Enterprise)</option>
                    <option value="11aEnt1">11aEnt1 (Enterprise)</option>
                    <option value="10bCim1">10bCim1 (iMedia)</option>
                    <option value="11bCim1">11bCim1 (iMedia)</option>
                </optgroup>
            </select>

            <input type="text" id="student-search" class="sidebar-search" placeholder="🔍 Search student name or username..." oninput="renderSidebar()">

            <div id="student-list">
                <p style="color: #666; font-size: 0.9em;">Loading students...</p>
            </div>
        </div>

        <!-- Main View: Student's Live Website View -->
        <div class="main-view" id="work-view">
            <h2 style="color: #666; text-align: center; margin-top: 80px;">&larr; Select a student from the roster to view their live workspace</h2>
        </div>
    </div>

    <script>
        /* --- 1. FIREBASE CONFIGURATION --- */
        const firebaseConfig = {
            apiKey: "AIzaSyDiRDdgM7VCOxEVob_pZ73AvZaNb7SvA9Y",
            authDomain: "serlby-park-computing.firebaseapp.com",
            projectId: "serlby-park-computing",
            storageBucket: "serlby-park-computing.firebasestorage.app",
            messagingSenderId: "648533806051",
            appId: "1:648533806051:web:1e42a4263dfb1fd8e72ed6",
            measurementId: "G-HDNYEE11WV"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // Teacher security check
        if (sessionStorage.getItem('teacherMode') !== 'true') {
            const code = prompt("Enter Teacher Passcode to access Portal:");
            if (code === "2525" || code === "delta") {
                sessionStorage.setItem('teacherMode', 'true');
            } else {
                window.location.href = "index.html";
            }
        }

        let allStudents = [];
        let activeUid = null;

        /* --- 2. FETCH ALL REGISTERED STUDENTS FROM FIREBASE --- */
        async function fetchStudents() {
            const listDiv = document.getElementById('student-list');
            listDiv.innerHTML = "<p style='color:#666;'>Loading students...</p>";

            try {
                const snapshot = await db.collection("users").get();
                allStudents = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    allStudents.push({
                        uid: doc.id,
                        username: data.username || "Unknown",
                        fullName: data.fullName || data.username || "Unknown",
                        className: data.className || "Unassigned"
                    });
                });

                allStudents.sort((a, b) => a.fullName.localeCompare(b.fullName));
                renderSidebar();
            } catch (err) {
                console.error("Error fetching students:", err);
                listDiv.innerHTML = `<p style="color:red;">Error: ${err.message}</p>`;
            }
        }

        /* --- 3. FILTER & RENDER STUDENT BUTTONS --- */
        function renderSidebar() {
            const classFilter = document.getElementById('class-filter').value;
            const searchQuery = document.getElementById('student-search').value.toLowerCase().trim();
            const listDiv = document.getElementById('student-list');
            listDiv.innerHTML = "";

            const filtered = allStudents.filter(s => {
                const matchesClass = (classFilter === "ALL") || String(s.className).toLowerCase().includes(classFilter.toLowerCase());
                const matchesSearch = !searchQuery ||
                    s.fullName.toLowerCase().includes(searchQuery) ||
                    s.username.toLowerCase().includes(searchQuery);
                return matchesClass && matchesSearch;
            });

            if (filtered.length === 0) {
                listDiv.innerHTML = "<p style='color: #666; font-size: 0.9em;'>No students found.<br><small>Students appear here automatically once they log in on the home page.</small></p>";
                return;
            }

            filtered.forEach(student => {
                const btn = document.createElement('button');
                btn.className = 'student-btn' + (activeUid === student.uid ? ' active' : '');
                btn.innerHTML = `
                    <span>
                        ${escapeHtml(student.fullName)}
                        ${student.fullName !== student.username ? `<br><small style="font-weight:normal; opacity:0.8;">@${escapeHtml(student.username)}</small>` : ''}
                    </span>
                    <span class="class-badge">${escapeHtml(student.className)}</span>
                `;
                btn.onclick = () => {
                    activeUid = student.uid;
                    renderSidebar();
                    openStudentWorkspace(student);
                };
                listDiv.appendChild(btn);
            });
        }

        /* --- 4. LOAD STUDENT'S LIVE WORKSPACE IN IFRAME --- */
        function openStudentWorkspace(student) {
            const viewDiv = document.getElementById('work-view');

            sessionStorage.setItem('teacherMode', 'true');
            sessionStorage.setItem('inspectStudentUid', student.uid);
            sessionStorage.setItem('inspectStudentName', student.username);

            const classOptions = [
                "Unassigned",
                "7x1", "7x2", "7y1", "7y2",
                "8x1", "8x2", "8y1", "8y2",
                "9x1", "9x2", "9y1", "9y2",
                "10aEnt1", "11aEnt1", "10bCim1", "11bCim1"
            ];

            const optionsHtml = classOptions.map(c =>
                `<option value="${c}" ${student.className === c ? 'selected' : ''}>${c}</option>`
            ).join('');

            viewDiv.innerHTML = `
                <div class="workspace-topbar">
                    <div>
                        <h2 style="margin: 0; color: #1e3a8a;">Viewing: ${escapeHtml(student.fullName)}</h2>
                        <span style="color: #64748b; font-size: 0.9em;">Click any unit or lesson below to inspect their saved answers live.</span>
                    </div>
                    <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
                        <button class="header-btn" style="background:#1e3a8a; color:white;" onclick="resetIframeHome()">🏠 Student Home</button>
                        <label style="font-weight:bold; color:#1e3a8a;">Class:</label>
                        <select onchange="updateStudentClass('${student.uid}', this.value)" style="width:auto; margin:0; padding:7px 10px;">
                            ${optionsHtml}
                        </select>
                    </div>
                </div>
                <iframe id="student-workspace-frame" src="index.html" onload="lockStudentInputs(this)"></iframe>
            `;
        }

        function resetIframeHome() {
            const frame = document.getElementById('student-workspace-frame');
            if (frame) frame.src = "index.html";
        }

        async function updateStudentClass(uid, newClass) {
            try {
                await db.collection("users").doc(uid).set({ className: newClass }, { merge: true });
                const st = allStudents.find(s => s.uid === uid);
                if (st) st.className = newClass;
                renderSidebar();
            } catch (err) {
                console.error("Error updating student class:", err);
                alert("Failed to update class: " + err.message);
            }
        }

        // Prevent accidental typing/overwriting while teacher browses student's pages
        function lockStudentInputs(iframe) {
            try {
                const doc = iframe.contentWindow.document;
                const loginGate = doc.getElementById('login-gate');
                if (loginGate) {
                    loginGate.style.display = 'none';
                    doc.body.classList.remove('locked');
                }
                const statusPill = doc.getElementById('save-status-pill');
                if (statusPill) {
                    statusPill.innerText = "👨‍🏫 Teacher Inspection Mode";
                }
                doc.querySelectorAll('input[type="text"], textarea').forEach(el => el.readOnly = true);
            } catch (e) {
                console.log("Iframe lockdown active.");
            }
        }

        function escapeHtml(str) {
            return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        window.onload = fetchStudents;
    </script>
</body>
</html>
