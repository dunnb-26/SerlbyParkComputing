<script>
        const firebaseConfig = {
            apiKey: "AIzaSyDiRDdgM7VCOxEVob_pZ73AvZaNb7SvA9Y",
            authDomain: "serlby-park-computing.firebaseapp.com",
            projectId: "serlby-park-computing",
            storageBucket: "serlby-park-computing.firebasestorage.app",
            messagingSenderId: "648533806051",
            appId: "1:648533806051:web:1e42a4263dfb1fd8e72ed6",
            measurementId: "G-HDNYEE11WV"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();

        let allStudents = [];
        let loggedInUserClass = null;

        // 1. Check who is logged in
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                try {
                    const userDoc = await db.collection('users').doc(user.uid).get();
                    if (userDoc.exists) {
                        const userData = userDoc.data();
                        
                        // If they have a class assigned, treat as student
                        if (userData.className && userData.className !== "Unassigned") {
                            loggedInUserClass = userData.className;
                            
                            // Hide dropdown and teacher button
                            document.getElementById('class-filter').style.display = 'none';
                            document.getElementById('back-btn').style.display = 'none';
                            
                            // Personalize title
                            document.getElementById('board-title').innerText = `🏆 ${loggedInUserClass} Leaderboard`;
                        }
                    }
                } catch (e) {
                    console.error("Auth check error:", e);
                }
            }
            fetchStudents();
        });

        // 2. Fetch the roster
        async function fetchStudents() {
            document.getElementById('loading-message').innerText = "Loading student roster...";
            try {
                const snapshot = await db.collection('users').get();
                allStudents = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    allStudents.push({
                        uid: doc.id,
                        fullName: data.fullName || data.username || 'Unnamed Student',
                        className: data.className || 'Unassigned'
                    });
                });
                
                if (loggedInUserClass) {
                    document.getElementById('class-filter').value = loggedInUserClass;
                    renderLeaderboard();
                } else if (document.getElementById('class-filter').value) {
                    renderLeaderboard();
                } else {
                    document.getElementById('loading-message').innerText = "Select a class above to load scores.";
                }
            } catch (err) {
                console.error('Error fetching students:', err);
                document.getElementById('loading-message').innerText = "Error loading data. Check console.";
            }
        }

        // 3. Calculate scores and split subjects
        async function renderLeaderboard() {
            const classFilter = document.getElementById('class-filter').value;
            const contentDiv = document.getElementById('leaderboard-content');

            if (!classFilter) return;
            contentDiv.innerHTML = `<div id="loading-message">Calculating live scores for ${classFilter}...</div>`;

            let classStudents = allStudents.filter(student => {
                const studentClasses = String(student.className || "").toLowerCase();
                return studentClasses.includes(classFilter.toLowerCase());
            });

            if (classStudents.length === 0) {
                contentDiv.innerHTML = `<div id="loading-message">No students found in ${classFilter}.</div>`;
                return;
            }

            try {
                const scorePromises = classStudents.map(async (student) => {
                    const lessonsSnap = await db.collection('users').doc(student.uid).collection('lessons').get();
                    let totalScore = 0;

                    lessonsSnap.forEach(doc => {
                        const lessonData = doc.data();
                        
                        // doc.id is your file name
                        const lessonName = (doc.id + " " + (lessonData.pageTitle || "")).toLowerCase();
                        
                        // Determine which board we are viewing
                        const isEnterpriseBoard = classFilter.toLowerCase().includes('ent');
                        const isImediaBoard = classFilter.toLowerCase().includes('cim') || classFilter.toLowerCase().includes('imedia');
                        
                        let shouldCountThisLesson = false;

                        if (isEnterpriseBoard && (lessonName.includes('ent') || lessonName.includes('enterprise'))) {
                            shouldCountThisLesson = true;
                        } else if (isImediaBoard && (lessonName.includes('cim') || lessonName.includes('imedia'))) {
                            shouldCountThisLesson = true;
                        } else if (!isEnterpriseBoard && !isImediaBoard) {
                            shouldCountThisLesson = true; // Fallback for KS3 or general classes
                        }

                        if (shouldCountThisLesson && lessonData.scoreText) {
                            const match = String(lessonData.scoreText).match(/\d+/);
                            if (match) {
                                totalScore += parseInt(match[0], 10);
                            }
                        }
                    });
                    
                    student.calculatedScore = totalScore;
                    return student;
                });

                await Promise.all(scorePromises);
                classStudents.sort((a, b) => b.calculatedScore - a.calculatedScore);

                let html = '';
                classStudents.forEach((student, index) => {
                    if (student.calculatedScore > 0) {
                        html += `
                            <div class="leaderboard-row">
                                <div>
                                    <span class="rank-circle">${index + 1}</span>
                                    <span>${escapeHtml(student.fullName)}</span>
                                </div>
                                <span class="score-badge">${student.calculatedScore} pts</span>
                            </div>
                        `;
                    }
                });

                if (html === '') {
                    contentDiv.innerHTML = `<div id="loading-message">No points scored yet in ${classFilter}.</div>`;
                } else {
                    contentDiv.innerHTML = html;
                }
            } catch (err) {
                console.error("Error calculating scores:", err);
                contentDiv.innerHTML = `<div id="loading-message">Error calculating scores. Please try again.</div>`;
            }
        }

        function escapeHtml(str) { return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
    </script>
