<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Python IDE</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- CodeMirror for Interactive Syntax Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/dracula.min.css">
    
    <!-- Skulpt for In-Browser Python Execution -->
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>

    <style>
        .ide-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }

        @media (max-width: 768px) {
            .ide-container { grid-template-columns: 1fr; }
        }

        .ide-panel {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-top: 5px solid var(--navy);
            display: flex;
            flex-direction: column;
        }
        
        .output-panel { border-top-color: var(--maroon); }

        .ide-panel h3 {
            margin-top: 0;
            color: var(--navy);
            text-transform: uppercase;
            font-size: 1.2em;
        }

        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: inherit;
        }

        /* Instructions & Block Bank Styling */
        #instruction-panel {
            background-color: #f8f9fa;
            border-left: 4px solid var(--navy);
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 0 4px 4px 0;
            font-family: inherit;
            font-size: 14.5px;
            color: #333;
        }

        .block-bank-container {
            border: 2px dashed #b0bec5;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 220px;
            overflow-y: auto;
        }

        .code-block {
            background-color: #1a1a24;
            color: #e0e0e0;
            padding: 10px 15px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
        }

        .add-btn {
            background-color: #ffb703;
            color: #000000;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: background-color 0.2s;
        }
        
        .add-btn:hover { background-color: #fb8500; }

        /* CodeMirror Editor Customization */
        .CodeMirror {
            height: 280px !important;
            border-radius: 5px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
        }

        pre.terminal-output {
            width: 100%;
            height: 350px;
            background-color: #000000;
            color: #4af626;
            font-family: 'Courier New', Courier, monospace;
            font-size: 15px;
            padding: 15px;
            border: none;
            border-radius: 5px;
            overflow-y: auto;
            box-sizing: border-box;
            margin: 0;
        }

        .btn-run {
            display: block;
            width: 100%;
            margin-top: 15px;
            padding: 15px;
            background-color: #388e3c;
            color: white;
            text-align: center;
            border: none;
            border-radius: 5px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .btn-run:hover { background-color: #2e7d32; }

        .feedback-box {
            margin-top: 15px;
            padding: 15px;
            font-weight: bold;
            border-radius: 4px;
            text-align: center;
            min-height: 50px;
            background-color: #f5f5f5;
            color: var(--navy);
        }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <img src="logo.jpg" alt="Delta Serlby Park Logo">
        </div>
        
        <div class="header-center">
            <h1>Interactive Python IDE</h1>
        </div>
        
        <div class="header-right">
            <a href="y9-python.html" class="back-btn">&larr; Back to Unit</a>
        </div>
    </header>

    <main>
        <div class="ide-container">
            <!-- Left Side: Interactive Editor -->
            <div class="ide-panel">
                <h3>1. Select Challenge</h3>
                
                <select id="task-selector" onchange="loadTask()">
                    <option value="t1">Task 1 (Sequence): Delta Adventure Park</option>
                    <option value="t2">Task 2 (Selection): Rollercoaster height check</option>
                    <option value="t3">Task 3 (Iteration): FOR loop greeting</option>
                    <option value="t4">Task 4 (Iteration): WHILE loop countdown</option>
                </select>

                <!-- Dynamic Instructions Panel -->
                <div id="instruction-panel"></div>

                <!-- The raw textarea is hidden and replaced by CodeMirror -->
                <textarea id="python-code"></textarea>
                
                <button class="btn-run" onclick="runPython()">▶ Run Code & Mark</button>
            </div>

            <!-- Right Side: Terminal & Feedback -->
            <div class="ide-panel output-panel">
                <h3 style="color: var(--maroon);">2. Terminal Output</h3>
                <pre id="output" class="terminal-output"></pre>
                
                <div id="feedback" class="feedback-box">
                    Awaiting code execution...
                </div>
            </div>
        </div>
    </main>
    
    <footer>
        &copy; 2026 Delta Serlby Park - Computing Department
    </footer>

    <!-- CodeMirror JavaScript Files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/python/python.min.js"></script>

    <script>
        // Initialize CodeMirror on the textarea to create the interactive IDE
        var editor = CodeMirror.fromTextArea(document.getElementById("python-code"), {
            mode: "python",
            theme: "dracula",
            lineNumbers: true,
            indentUnit: 4,
            matchBrackets: true
        });

        // Instruction content repository
        const instructions = {
            "t1": `<strong>TASK 1:</strong> Read the block bank below. Some are incorrect distractors! Click '+ Add' to place the correct blocks in the right logical sequence to create a working ticket system.
                   <div class="block-bank-container">
                       <div class="code-block"><span>total = tickets + price</span><button class="add-btn" onclick="addBlock('total = tickets + price')">+ Add</button></div>
                       <div class="code-block"><span>age = int(input("What is your age? "))</span><button class="add-btn" onclick='addBlock("age = int(input(\\"What is your age? \\"))")'>+ Add</button></div>
                       <div class="code-block"><span>print("Welcome to Delta Adventure Park")</span><button class="add-btn" onclick='addBlock("print(\\"Welcome to Delta Adventure Park\\")")'>+ Add</button></div>
                       <div class="code-block"><span>total = tickets * price</span><button class="add-btn" onclick="addBlock('total = tickets * price')">+ Add</button></div>
                       <div class="code-block"><span>name = input("What is your name? ")</span><button class="add-btn" onclick='addBlock("name = input(\\"What is your name? \\")")'>+ Add</button></div>
                       <div class="code-block"><span>tickets = input("How many tickets? ")</span><button class="add-btn" onclick='addBlock("tickets = input(\\"How many tickets? \\")")'>+ Add</button></div>
                       <div class="code-block"><span>tickets = int(input("How many tickets? "))</span><button class="add-btn" onclick='addBlock("tickets = int(input(\\"How many tickets? \\"))")'>+ Add</button></div>
                       <div class="code-block"><span>print(name, "your total is £", total)</span><button class="add-btn" onclick='addBlock("print(name, \\"your total is £\\", total)")'>+ Add</button></div>
                       <div class="code-block"><span>price = 8</span><button class="add-btn" onclick="addBlock('price = 8')">+ Add</button></div>
                   </div>`,
            "t2": `<strong>TASK 2:</strong> Create a variable called <code>height</code> and set it to 150.<br><br>Write an <code>if</code> statement checking if height is greater than 140. If it is, print "You can ride!"`,
            "t3": `<strong>TASK 3:</strong> Write a <code>for</code> loop that repeats exactly 5 times.<br><br>Inside the loop, print the word "Hello".`,
            "t4": `<strong>TASK 4:</strong> Create a variable called <code>timer</code> and set it to 3.<br><br>Write a <code>while</code> loop that runs as long as timer is greater than 0. Inside the loop, print the timer and decrease it by 1.`
        };

        // Inject the block into the CodeMirror editor when the + Add button is clicked
        function addBlock(codeText) {
            var doc = editor.getDoc();
            var cursor = doc.getCursor();
            doc.replaceRange(codeText + "\n", cursor);
            editor.focus();
        }

        // Load the selected task instructions and clear the IDE
        function loadTask() {
            var currentTask = document.getElementById("task-selector").value;
            
            // Set the instructions outside the IDE
            document.getElementById("instruction-panel").innerHTML = instructions[currentTask];
            
            // Clear the IDE for the student
            editor.setValue("# Type your code here:\n\n");
            
            document.getElementById("output").innerHTML = "";
            document.getElementById("feedback").innerHTML = "Awaiting code execution...";
            document.getElementById("feedback").style.backgroundColor = "#f5f5f5";
            document.getElementById("feedback").style.color = "var(--navy)";
        }

        // Initialize first task on load
        window.onload = loadTask;

        // Skulpt file reader configuration
        function builtinRead(x) {
            if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined)
                throw "File not found: '" + x + "'";
            return Sk.builtinFiles["files"][x];
        }

        // Execute the Python code using Skulpt
        function runPython() {
            var code = editor.getValue(); 
            var outputBox = document.getElementById("output");
            var feedbackBox = document.getElementById("feedback");
            var currentTask = document.getElementById("task-selector").value;
            
            outputBox.innerHTML = ''; 
            feedbackBox.innerHTML = 'Running...';
            
            let outputText = "";

            Sk.pre = "output";
            Sk.configure({
                output: function(text) { 
                    outputBox.innerHTML += text; 
                    outputText += text; 
                },
                read: builtinRead
            });
            
            var myPromise = Sk.misceval.asyncToPromise(function() {
                return Sk.importMainWithBody("<stdin>", false, code, true);
            });
            
            myPromise.then(function(mod) {
                checkAnswers(currentTask, outputText, code, feedbackBox);
            }, function(err) {
                outputBox.innerHTML += '<span style="color: #ff5555;">' + err.toString() + '</span>';
                feedbackBox.innerHTML = "⚠️ Syntax Error! Check your spelling, capitalization, and indentation.";
                feedbackBox.style.backgroundColor = "#ffebee";
                feedbackBox.style.color = "#d32f2f";
            });
        }

        // Teacher Auto-Marking Logic
        function checkAnswers(task, output, code, feedbackBox) {
            let cleanOutput = output.trim().toLowerCase();
            let lowerCode = code.toLowerCase();
            let isCorrect = false;
            let successMsg = "";

            if (task === "t1") {
                let stripped = lowerCode.replace(/\s+/g, '');
                
                let hasWelcome = stripped.includes('print("welcometodelta') || stripped.includes("print('welcometodelta");
                let hasCorrectTickets = stripped.includes("tickets=int(input");
                let hasCorrectTotal = stripped.includes("total=tickets*price");
                let hasWrongTotal = stripped.includes("total=tickets+price");
                let hasFinalPrint = stripped.includes('"yourtotalis') || stripped.includes("'yourtotalis");
                
                let priceIdx = stripped.indexOf("price=8");
                let ticketIdx = stripped.indexOf("tickets=int(input");
                let mathIdx = stripped.indexOf("total=tickets*price");
                let printIdx = stripped.indexOf("yourtotalis");

                let orderCorrect = (priceIdx !== -1 && priceIdx < mathIdx) && 
                                   (ticketIdx !== -1 && ticketIdx < mathIdx) &&
                                   (mathIdx !== -1 && mathIdx < printIdx);

                if (hasWelcome && hasCorrectTickets && hasCorrectTotal && !hasWrongTotal && hasFinalPrint && orderCorrect) {
                    isCorrect = true;
                    successMsg = "✅ SEQUENCE PASSED: You selected the correct blocks and built the ticket system!";
                }
            } 
            else if (task === "t2") {
                if (lowerCode.includes("if") && lowerCode.includes(">") && lowerCode.includes("140") && cleanOutput.includes("you can ride")) {
                    isCorrect = true;
                    successMsg = "✅ SELECTION PASSED: Your IF statement worked perfectly!";
                }
            }
            else if (task === "t3") {
                let helloCount = (cleanOutput.match(/hello/g) || []).length;
                if (lowerCode.includes("for") && lowerCode.includes("range") && helloCount === 5) {
                    isCorrect = true;
                    successMsg = "✅ ITERATION PASSED: Your FOR loop successfully ran 5 times!";
                }
            }
            else if (task === "t4") {
                if (lowerCode.includes("while") && lowerCode.includes(">") && lowerCode.includes("0") && (lowerCode.includes("- 1") || lowerCode.includes("-= 1"))) {
                    isCorrect = true;
                    successMsg = "✅ ITERATION PASSED: Your WHILE loop countdown worked!";
                }
            }

            if (isCorrect) {
                feedbackBox.innerHTML = successMsg;
                feedbackBox.style.backgroundColor = "#e8f5e9";
                feedbackBox.style.color = "#2e7d32";
            } else {
                feedbackBox.innerHTML = "❌ Incorrect or incomplete. Read the instructions carefully and try again!";
                feedbackBox.style.backgroundColor = "#ffebee";
                feedbackBox.style.color = "#d32f2f";
            }
        }
    </script>
</body>
</html>
