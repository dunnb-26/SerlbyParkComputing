    <style>
        /* Scoreboard Banner */
        .scoreboard {
            max-width: 1450px;
            margin: 20px auto 0 auto;
            padding: 15px 25px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 5px solid var(--maroon);
            font-weight: bold;
            color: var(--navy);
            gap: 15px;
            flex-wrap: wrap;
        }
        .score-item {
            text-align: center;
            font-size: 0.95em;
        }
        .score-item span {
            display: block;
            font-size: 1.3em;
            color: #388e3c;
            margin-top: 3px;
        }
        .scoreboard-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .btn-ms-form {
            background-color: #0078d4; /* Microsoft Blue */
            color: white;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: bold;
            display: inline-block;
            transition: background-color 0.2s;
            border: none;
            cursor: pointer;
        }
        .btn-ms-form:hover { background-color: #106ebe; }

        .btn-clear-scores {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: bold;
        }
        .btn-clear-scores:hover { background-color: #b71c1c; }

        /* 3-Column Layout */
        .ide-container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            max-width: 1450px;
            margin: 20px auto;
            padding: 0 20px;
        }

        @media (max-width: 1100px) {
            .ide-container { grid-template-columns: 1fr; }
        }

        .ide-panel {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-top: 5px solid var(--navy);
            display: flex;
            flex-direction: column;
        }
        
        .editor-panel { border-top-color: #007acc; }
        .output-panel { border-top-color: var(--maroon); }

        .ide-panel h3 {
            margin-top: 0;
            color: var(--navy);
            text-transform: uppercase;
            font-size: 1.1em;
        }

        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: inherit;
        }

            margin-bottom: 15px;
            border-radius: 0 4px 4px 0;
            font-family: inherit;
            font-size: 13.5px;
            color: #333;
            flex-grow: 1;
            overflow-y: auto;
            max-height: 400px;
            line-height: 1.4;
        }

            margin-top: 8px;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
