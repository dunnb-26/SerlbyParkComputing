<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Y9 Python Assessment</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Skulpt Libraries for running Python in-browser -->
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>

    <style>
        .ide-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .ide-panel {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-top: 5px solid var(--navy);
        }
        
        .output-panel { border-top-color: var(--maroon); }

        .ide-panel h3 {
            margin-top: 0;
            color: var(--navy);
            text-transform: uppercase;
        }

        textarea.code-editor {
            width: 100%;
            height: 300px;
            background-color: #1e1e1e;
            color: #d4d4d4;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            padding: 15px;
            border: none;
            border-radius: 5px;
            resize: vertical;
            box-sizing: border-box;
        }

        pre.terminal-output {
            width: 100%;
            height: 200px;
            background-color: #000000;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            padding: 15px;
            border: none;
            border-radius: 5px;
            overflow-y: auto;
            box-sizing: border-box;
            margin: 0;
        }

        .btn-run {
            display: block;
            width: 100%;
            margin-top: 15px;
            padding: 15px;
            background-color: #388e3c;
            color: white;
            text-align: center;
            border: none;
            border-radius: 5px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
        }
        
        .btn-run:hover { background-color: #2e7d32; }

        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .feedback-box {
            margin-top: 15px;
            padding: 15px;
            font-weight: bold;
            border-radius: 4px;
            text-align: center;
            min-height: 50px;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <img src="logo.jpg" alt="Delta Serlby Park Logo">
        </div>
        
        <div class="header-center">
            <h1>Python Coding Assessment</h1>
        </div>
        
        <div class="header-right">
            <a href="y9-python.html" class="back-btn">&larr; Back to Unit</a>
        </div>
    </header>

    <main>
        <div class="ide-container">
            <!-- Left Side: Editor -->
            <div class="ide-panel">
                <h3>1. Select Challenge & Write Code</h3>
                
                <select id="task-selector" onchange="resetIDE()">
                    <option value="q1">Question 1: Print your favorite color</option>
                    <option value="q2">Question 2: Create a variable 'x' and set it to 50</option>
                    <option value="q3">Question 3: Write an IF statement that prints "Pass" if score > 50</option>
                </select>

                <textarea id="python-code" class="code-editor" spellcheck="false"># Write your Python code here...
</textarea>
                <button class="btn-run" onclick="runPython()">▶ Run Code & Mark</button>
            </div>

            <!-- Right Side: Terminal & Feedback -->
            <div class="ide-panel output-panel">
                <h3 style="color: var(--maroon);">2. Terminal Output</h3>
                <pre id="output" class="terminal-output"></pre>
                
                <div id="feedback" class="feedback-box">
                    Awaiting code execution...
                </div>
            </div>
        </div>
    </main>
    
    <footer>
        &copy; 2026 Delta Serlby Park - Computing Department
    </footer>

    <script>
        function builtinRead(x) {
            if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined)
                throw "File not found: '" + x + "'";
            return Sk.builtinFiles["files"][x];
        }

        function resetIDE() {
            document.getElementById("output").innerHTML = "";
            document.getElementById("feedback").innerHTML = "Awaiting code execution...";
            document.getElementById("feedback").style.backgroundColor = "transparent";
            document.getElementById("feedback").style.color = "var(--navy)";
            document.getElementById("python-code").value = "# Write your Python code here...\n";
        }

        function runPython() {
            var code = document.getElementById("python-code").value;
            var outputBox = document.getElementById("output");
            var feedbackBox = document.getElementById("feedback");
            var currentTask = document.getElementById("task-selector").value;
            
            outputBox.innerHTML = ''; 
            feedbackBox.innerHTML = 'Running...';
            
            let outputText = "";

            Sk.pre = "output";
            Sk.configure({
                output: function(text) { 
                    outputBox.innerHTML += text; 
                    outputText += text; 
                },
                read: builtinRead
            });
            
            var myPromise = Sk.misceval.asyncToPromise(function() {
                return Sk.importMainWithBody("<stdin>", false, code, true);
            });
            
            myPromise.then(function(mod) {
                checkAnswers(currentTask, outputText, code, feedbackBox);
            }, function(err) {
                outputBox.innerHTML += '<span style="color: red;">' + err.toString() + '</span>';
                feedbackBox.innerHTML = "⚠️ Syntax Error! Check your spelling and indentation.";
                feedbackBox.style.backgroundColor = "#ffebee";
                feedbackBox.style.color = "#d32f2f";
            });
        }

        // TEACHER MARKING LOGIC
        function checkAnswers(task, output, code, feedbackBox) {
            let cleanOutput = output.trim().toLowerCase();
            let isCorrect = false;

            if (task === "q1") {
                // Check if they used a print statement and outputted anything
                if (code.includes("print") && cleanOutput.length > 0) {
                    isCorrect = true;
                }
            } 
            else if (task === "q2") {
                // Check if they created variable x and set it to 50
                if ((code.includes("x = 50") || code.includes("x=50")) && !code.includes("==")) {
                    isCorrect = true;
                }
            }
            else if (task === "q3") {
                // Check if they used 'if', '>', and '50'
                if (code.includes("if") && code.includes(">") && code.includes("50") && code.includes("print")) {
                    isCorrect = true;
                }
            }

            // Display Results
            if (isCorrect) {
                feedbackBox.innerHTML = "✅ CORRECT! Great job.";
                feedbackBox.style.backgroundColor = "#e8f5e9";
                feedbackBox.style.color = "#2e7d32";
            } else {
                feedbackBox.innerHTML = "❌ Incorrect. Read the question carefully and try again!";
                feedbackBox.style.backgroundColor = "#ffebee";
                feedbackBox.style.color = "#d32f2f";
            }
        }
    </script>
</body>
</html>
