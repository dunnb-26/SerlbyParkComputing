<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Python IDE</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- CodeMirror for Interactive Syntax Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/dracula.min.css">
    
    <!-- Skulpt for In-Browser Python Execution -->
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>

    <style>
        /* 3-Column Layout for wide screens */
        .ide-container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            max-width: 1450px;
            margin: 20px auto;
            padding: 0 20px;
        }

        @media (max-width: 1100px) {
            .ide-container { grid-template-columns: 1fr; }
        }

        .ide-panel {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-top: 5px solid var(--navy);
            display: flex;
            flex-direction: column;
        }
        
        .editor-panel { border-top-color: #007acc; }
        .output-panel { border-top-color: var(--maroon); }

        .ide-panel h3 {
            margin-top: 0;
            color: var(--navy);
            text-transform: uppercase;
            font-size: 1.1em;
        }

        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: inherit;
        }

        /* Instructions & Block Bank Styling */
        #instruction-panel {
            background-color: #f8f9fa;
            border-left: 4px solid var(--navy);
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 0 4px 4px 0;
            font-family: inherit;
            font-size: 14px;
            color: #333;
            flex-grow: 1;
            overflow-y: auto;
            max-height: 400px;
        }

        .block-bank-container {
            border: 2px dashed #b0bec5;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .code-block {
            background-color: #1a1a24;
            color: #e0e0e0;
            padding: 8px 12px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
        }

        .add-btn {
            background-color: #ffb703;
            color: #000000;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            transition: background-color 0.2s;
        }
        
        .add-btn:hover { background-color: #fb8500; }

        .btn-reset {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            margin-top: 10px;
            width: 100%;
        }
        .btn-reset:hover { background-color: #b71c1c; }

        /* CodeMirror Editor Customization */
        .CodeMirror {
            height: 420px !important;
            border-radius: 5px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
        }

        #output {
            width: 100%;
            height: 350px;
            background-color: #000000;
            color: #4af626;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            padding: 15px;
            border: none;
            border-radius: 5px;
            overflow-y: auto;
            box-sizing: border-box;
            margin: 0;
            white-space: pre-wrap;
        }

        .btn-run {
            display: block;
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            background-color: #388e3c;
            color: white;
            text-align: center;
            border: none;
            border-radius: 5px;
            font-size: 1.05em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .btn-run:hover { background-color: #2e7d32; }

        .feedback-box {
            margin-top: 15px;
            padding: 12px;
            font-weight: bold;
            border-radius: 4px;
            text-align: center;
            min-height: 40px;
            background-color: #f5f5f5;
            color: var(--navy);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <img src="logo.jpg" alt="Delta Serlby Park Logo">
        </div>
        
        <div class="header-center">
            <h1>Interactive Python IDE</h1>
        </div>
        
        <div class="header-right">
            <a href="y9-python.html" class="back-btn">&larr; Back to Unit</a>
        </div>
    </header>

    <main>
        <div class="ide-container">
            <!-- COLUMN 1: Task Selection & Instructions / Block Bank -->
            <div class="ide-panel">
                <h3>1. Instructions</h3>
                
                <select id="task-selector" onchange="loadTask()">
                    <option value="t1">Task 1 (Sequence): Delta Adventure Park</option>
                    <option value="t2">Task 2 (Selection): Theme Park Age Checker</option>
                    <option value="t3">Task 3 (Iteration): Process 5 Visitors</option>
                    <option value="t4">Task 4 (Challenge): The Complete Ticket System</option>
                </select>

                <div id="instruction-panel"></div>
            </div>

            <!-- COLUMN 2: Interactive Code Editor -->
            <div class="ide-panel editor-panel">
                <h3 style="color: #007acc;">2. Code Editor</h3>
                <p style="font-size: 13px; color: #666; margin-top: 0;">Write or assemble your Python solution below:</p>
                
                <textarea id="python-code"></textarea>
                
                <button class="btn-run" onclick="runPython()">▶ Run Code & Mark</button>
            </div>

            <!-- COLUMN 3: Terminal Output & Feedback -->
            <div class="ide-panel output-panel">
                <h3 style="color: var(--maroon);">3. Terminal Output</h3>
                <p style="font-size: 13px; color: #666; margin-top: 0;">View program feedback and results:</p>
                
                <div id="output"></div>
                
                <div id="feedback" class="feedback-box">
                    Awaiting code execution...
                </div>
            </div>
        </div>
    </main>
    
    <footer>
        &copy; 2026 Delta Serlby Park - Computing Department
    </footer>

    <!-- CodeMirror JavaScript Files -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/mode/python/python.min.js"></script>

    <script>
        var editor = CodeMirror.fromTextArea(document.getElementById("python-code"), {
            mode: "python",
            theme: "dracula",
            lineNumbers: true,
            indentUnit: 4,
            matchBrackets: true
        });

        // Master list of blocks for Task 1
        const originalBlocks = [
            { id: 'b1', text: 'total = tickets + price' },
            { id: 'b2', text: 'age = int(input("What is your age? "))' },
            { id: 'b3', text: 'print("Welcome to Delta Adventure Park")' },
            { id: 'b4', text: 'total = tickets * price' },
            { id: 'b5', text: 'name = input("What is your name? ")' },
            { id: 'b6', text: 'tickets = input("How many tickets? ")' },
            { id: 'b7', text: 'tickets = int(input("How many tickets? "))' },
            { id: 'b8', text: 'print(name, "your total is £", total)' },
            { id: 'b9', text: 'price = 8' }
        ];

        let currentBlocks = [];

        function loadTask() {
            var currentTask = document.getElementById("task-selector").value;
            
            if (currentTask === "t1") {
                currentBlocks = JSON.parse(JSON.stringify(originalBlocks));
                renderBlockBank();
            } else {
                let textInstr = "";
                if (currentTask === "t2") {
                    textInstr = `<strong>Refactor your program so it makes a decision.</strong><br><br>
                                 1. Age <strong>16 or above</strong>: display that they can ride without an adult.<br><br>
                                 2. Age <strong>12–15</strong>: display that they can ride with an adult.<br><br>
                                 3. Age <strong>under 12</strong>: display that they cannot ride.<br><br>
                                 <em>Use <code>if</code>, <code>elif</code> and <code>else</code>.</em>`;
                } else if (currentTask === "t3") {
                    textInstr = `<strong>The park needs to process 5 visitors.</strong><br><br>
                                 1. Refactor your program using a <strong>for loop</strong>.<br><br>
                                 2. The loop should repeat 5 times.<br><br>
                                 3. Ask for each visitor's name and age inside the loop.<br><br>
                                 4. Apply the Thunderbolt decision to every visitor.`;
                } else if (currentTask === "t4") {
                    textInstr = `<strong>Bring everything together.</strong><br><br>
                                 1. Your program should use <strong>sequence</strong>, <strong>selection</strong> and <strong>iteration</strong>.<br><br>
                                 2. It should run without syntax errors.<br><br>
                                 3. Keep your output clear and easy to understand.<br><br>
                                 4. <strong>Challenge:</strong> add a sensible extra feature of your own.`;
                }
                document.getElementById("instruction-panel").innerHTML = textInstr;
            }
            
            editor.setValue("# Type your code here:\n\n");
            document.getElementById("output").innerHTML = "";
            document.getElementById("feedback").innerHTML = "Awaiting code execution...";
            document.getElementById("feedback").style.backgroundColor = "#f5f5f5";
            document.getElementById("feedback").style.color = "var(--navy)";
        }

        function renderBlockBank() {
            let html = `<strong>TASK 1:</strong> Click '+ Add' to place correct blocks in order. Distractors included!<br><div class="block-bank-container">`;
            
            if (currentBlocks.length === 0) {
                html += `<p style="text-align:center; color:#666; font-size:13px; margin:5px 0;">All blocks added!</p>`;
            } else {
                currentBlocks.forEach(b => {
                    let escapedText = b.text.replace(/"/g, '&quot;');
                    html += `<div class="code-block"><span>${b.text}</span><button class="add-btn" onclick="addBlock('${b.id}', '${escapedText}')">+ Add</button></div>`;
                });
            }
            html += `</div><button class="btn-reset" onclick="resetBlocks()">Reset Blocks</button>`;
            document.getElementById("instruction-panel").innerHTML = html;
        }

        function addBlock(id, codeText) {
            currentBlocks = currentBlocks.filter(b => b.id !== id);
            renderBlockBank();

            var doc = editor.getDoc();
            var cursor = doc.getCursor();
            doc.replaceRange(codeText + "\n", cursor);
            editor.focus();
        }

        function resetBlocks() {
            currentBlocks = JSON.parse(JSON.stringify(originalBlocks));
            renderBlockBank();
            editor.setValue("# Type your code here:\n\n");
        }

        window.onload = loadTask;

        function builtinRead(x) {
            if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined)
                throw "File not found: '" + x + "'";
            return Sk.builtinFiles["files"][x];
        }

        function runPython() {
            var code = editor.getValue(); 
            var outputBox = document.getElementById("output");
            var feedbackBox = document.getElementById("feedback");
            var currentTask = document.getElementById("task-selector").value;
            
            outputBox.innerHTML = ''; 
            feedbackBox.innerHTML = 'Running...';
            
            Sk.pre = "output";
            Sk.configure({
                output: function(text) { 
                    outputBox.innerHTML += text; 
                    outputBox.scrollTop = outputBox.scrollHeight;
                },
                read: builtinRead,
                // Custom In-Terminal Input Handler (No browser popup boxes!)
                inputfun: function (promptMsg) {
                    return new Promise(function(resolve, reject) {
                        outputBox.innerHTML += promptMsg;
                        
                        let inputField = document.createElement("input");
                        inputField.type = "text";
                        inputField.style.background = "transparent";
                        inputField.style.border = "none";
                        inputField.style.borderBottom = "1px solid #4af626";
                        inputField.style.color = "#4af626";
                        inputField.style.fontFamily = "inherit";
                        inputField.style.fontSize = "inherit";
                        inputField.style.outline = "none";
                        inputField.style.width = "150px";
                        inputField.style.marginLeft = "5px";
                        
                        outputBox.appendChild(inputField);
                        outputBox.scrollTop = outputBox.scrollHeight;
                        inputField.focus();
                        
                        inputField.addEventListener("keydown", function(e) {
                            if (e.key === "Enter") {
                                let val = inputField.value;
                                outputBox.removeChild(inputField);
                                outputBox.innerHTML += val + "\n";
                                resolve(val);
                            }
                        });
                    });
                }
            });
            
            var myPromise = Sk.misceval.asyncToPromise(function() {
                return Sk.importMainWithBody("<stdin>", false, code, true);
            });
            
            myPromise.then(function(mod) {
                let outputText = outputBox.innerText;
                checkAnswers(currentTask, outputText, code, feedbackBox);
            }, function(err) {
                outputBox.innerHTML += '<span style="color: #ff5555;">' + err.toString() + '</span>';
                feedbackBox.innerHTML = "⚠️ Syntax Error! Check your spelling or indentation.";
                feedbackBox.style.backgroundColor = "#ffebee";
                feedbackBox.style.color = "#d32f2f";
            });
        }

        function checkAnswers(task, output, code, feedbackBox) {
            let cleanOutput = output.trim().toLowerCase();
            let lowerCode = code.toLowerCase();
            let isCorrect = false;
            let successMsg = "";

            if (task === "t1") {
                let stripped = lowerCode.replace(/\s+/g, '');
                let hasWelcome = stripped.includes('print("welcometodelta') || stripped.includes("print('welcometodelta");
                let hasCorrectTickets = stripped.includes("tickets=int(input");
                let hasCorrectTotal = stripped.includes("total=tickets*price");
                let hasWrongTotal = stripped.includes("total=tickets+price");
                let hasFinalPrint = stripped.includes('"yourtotalis') || stripped.includes("'yourtotalis");
                
                let priceIdx = stripped.indexOf("price=8");
                let ticketIdx = stripped.indexOf("tickets=int(input");
                let mathIdx = stripped.indexOf("total=tickets*price");
                let printIdx = stripped.indexOf("yourtotalis");

                let orderCorrect = (priceIdx !== -1 && priceIdx < mathIdx) && 
                                   (ticketIdx !== -1 && ticketIdx < mathIdx) &&
                                   (mathIdx !== -1 && mathIdx < printIdx);

                if (hasWelcome && hasCorrectTickets && hasCorrectTotal && !hasWrongTotal && hasFinalPrint && orderCorrect) {
                    isCorrect = true;
                    successMsg = "✅ SEQUENCE PASSED: Ticket system built successfully!";
                }
            } 
            else if (task === "t2") {
                if (lowerCode.includes("if") && lowerCode.includes("elif") && lowerCode.includes("else") && lowerCode.includes("16") && lowerCode.includes("12")) {
                    isCorrect = true;
                    successMsg = "✅ SELECTION PASSED: Decision logic covers all age boundaries!";
                }
            }
            else if (task === "t3") {
                if (lowerCode.includes("for") && lowerCode.includes("range") && lowerCode.includes("input") && (lowerCode.includes("5") || lowerCode.includes("range(5)"))) {
                    isCorrect = true;
                    successMsg = "✅ ITERATION PASSED: Loop correctly configured for 5 visitors!";
                }
            }
            else if (task === "t4") {
                if (lowerCode.includes("if") && (lowerCode.includes("for") || lowerCode.includes("while")) && cleanOutput.length > 0) {
                    isCorrect = true;
                    successMsg = "🎉 ASSESSMENT COMPLETE: Sequence, selection, and iteration combined successfully!";
                }
            }

            if (isCorrect) {
                feedbackBox.innerHTML = successMsg;
                feedbackBox.style.backgroundColor = "#e8f5e9";
                feedbackBox.style.color = "#2e7d32";
            } else {
                feedbackBox.innerHTML = "❌ Incorrect or incomplete. Check the instructions and try again!";
                feedbackBox.style.backgroundColor = "#ffebee";
                feedbackBox.style.color = "#d32f2f";
            }
        }
    </script>
</body>
</html>
