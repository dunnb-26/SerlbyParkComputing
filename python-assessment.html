<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Y9 Python Assessment</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Skulpt Libraries for running Python in-browser -->
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/skulpt@1.2.0/dist/skulpt-stdlib.js"></script>

    <style>
        .ide-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 1200px;
            margin: 20px auto;
            padding: 0 20px;
        }

        .ide-panel {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-top: 5px solid var(--navy);
        }
        
        .output-panel { border-top-color: var(--maroon); }

        .ide-panel h3 {
            margin-top: 0;
            color: var(--navy);
            text-transform: uppercase;
        }

        textarea.code-editor {
            width: 100%;
            height: 300px;
            background-color: #1e1e1e;
            color: #d4d4d4;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            padding: 15px;
            border: none;
            border-radius: 5px;
            resize: vertical;
            box-sizing: border-box;
        }

        pre.terminal-output {
            width: 100%;
            height: 200px;
            background-color: #000000;
            color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            padding: 15px;
            border: none;
            border-radius: 5px;
            overflow-y: auto;
            box-sizing: border-box;
            margin: 0;
        }

        .btn-run {
            display: block;
            width: 100%;
            margin-top: 15px;
            padding: 15px;
            background-color: #388e3c;
            color: white;
            text-align: center;
            border: none;
            border-radius: 5px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
        }
        
        .btn-run:hover { background-color: #2e7d32; }

        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .feedback-box {
            margin-top: 15px;
            padding: 15px;
            font-weight: bold;
            border-radius: 4px;
            text-align: center;
            min-height: 50px;
        }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <img src="logo.jpg" alt="Delta Serlby Park Logo">
        </div>
        
        <div class="header-center">
            <h1>Python Coding Assessment</h1>
        </div>
        
        <div class="header-right">
            <a href="y9-python.html" class="back-btn">&larr; Back to Unit</a>
        </div>
    </header>

    <main>
        <div class="ide-container">
            <!-- Left Side: Editor -->
            <div class="ide-panel">
                <h3>1. Select Challenge & Write Code</h3>
                
                <select id="task-selector" onchange="resetIDE()">
                    <option value="t1">Task 1 (Sequence): Fix the jumbled code</option>
                    <option value="t2">Task 2 (Selection): Rollercoaster height check</option>
                    <option value="t3">Task 3 (Iteration): FOR loop greeting</option>
                    <option value="t4">Task 4 (Iteration): WHILE loop countdown</option>
                </select>

                <textarea id="python-code" class="code-editor" spellcheck="false"></textarea>
                <button class="btn-run" onclick="runPython()">▶ Run Code & Mark</button>
            </div>

            <!-- Right Side: Terminal & Feedback -->
            <div class="ide-panel output-panel">
                <h3 style="color: var(--maroon);">2. Terminal Output</h3>
                <pre id="output" class="terminal-output"></pre>
                
                <div id="feedback" class="feedback-box">
                    Awaiting code execution...
                </div>
            </div>
        </div>
    </main>
    
    <footer>
        &copy; 2026 Delta Serlby Park - Computing Department
    </footer>

    <script>
        // Load the first task's starter code automatically when the page opens
        window.onload = resetIDE;

        function builtinRead(x) {
            if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined)
                throw "File not found: '" + x + "'";
            return Sk.builtinFiles["files"][x];
        }

        // This function changes the starter text based on the dropdown selection
        function resetIDE() {
            var currentTask = document.getElementById("task-selector").value;
            var editor = document.getElementById("python-code");
            
            if (currentTask === "t1") {
                editor.value = 'print("Pour water")\nprint("Drink tea")\nprint("Boil kettle")\nprint("Put teabag in cup")\n\n# TASK: Reorder the lines above into the correct logical sequence!';
            } else if (currentTask === "t2") {
                editor.value = '# TASK: Create a variable called height and set it to 150.\n# Write an IF statement checking if height is greater than 140.\n# If it is, print "You can ride!"\n\n';
            } else if (currentTask === "t3") {
                editor.value = '# TASK: Write a FOR loop that repeats exactly 5 times.\n# Inside the loop, print the word "Hello".\n\n';
            } else if (currentTask === "t4") {
                editor.value = '# TASK: Create a variable called timer and set it to 3.\n# Write a WHILE loop that runs as long as timer is greater than 0.\n# Inside the loop, print the timer and decrease it by 1.\n\n';
            }

            document.getElementById("output").innerHTML = "";
            document.getElementById("feedback").innerHTML = "Awaiting code execution...";
            document.getElementById("feedback").style.backgroundColor = "transparent";
            document.getElementById("feedback").style.color = "var(--navy)";
        }

        function runPython() {
            var code = document.getElementById("python-code").value;
            var outputBox = document.getElementById("output");
            var feedbackBox = document.getElementById("feedback");
            var currentTask = document.getElementById("task-selector").value;
            
            outputBox.innerHTML = ''; 
            feedbackBox.innerHTML = 'Running...';
            
            let outputText = "";

            Sk.pre = "output";
            Sk.configure({
                output: function(text) { 
                    outputBox.innerHTML += text; 
                    outputText += text; 
                },
                read: builtinRead
            });
            
            var myPromise = Sk.misceval.asyncToPromise(function() {
                return Sk.importMainWithBody("<stdin>", false, code, true);
            });
            
            myPromise.then(function(mod) {
                checkAnswers(currentTask, outputText, code, feedbackBox);
            }, function(err) {
                outputBox.innerHTML += '<span style="color: red;">' + err.toString() + '</span>';
                feedbackBox.innerHTML = "⚠️ Syntax Error! Check your spelling, capitalization, and indentation.";
                feedbackBox.style.backgroundColor = "#ffebee";
                feedbackBox.style.color = "#d32f2f";
            });
        }

        // TEACHER MARKING LOGIC
        function checkAnswers(task, output, code, feedbackBox) {
            let cleanOutput = output.trim().toLowerCase();
            let lowerCode = code.toLowerCase();
            let isCorrect = false;
            let successMsg = "";

            if (task === "t1") {
                // Checks if the output matches the logical sequence of making tea
                if (cleanOutput === "boil kettle\nput teabag in cup\npour water\ndrink tea") {
                    isCorrect = true;
                    successMsg = "✅ SEQUENCE PASSED: You placed the commands in the right order!";
                }
            } 
            else if (task === "t2") {
                // Checks for IF statement syntax and the correct output phrase
                if (lowerCode.includes("if") && lowerCode.includes(">") && lowerCode.includes("140") && cleanOutput.includes("you can ride")) {
                    isCorrect = true;
                    successMsg = "✅ SELECTION PASSED: Your IF statement worked perfectly!";
                }
            }
            else if (task === "t3") {
                // Checks for FOR loop syntax and ensures "hello" printed 5 times
                let helloCount = (cleanOutput.match(/hello/g) || []).length;
                if (lowerCode.includes("for") && lowerCode.includes("range") && helloCount === 5) {
                    isCorrect = true;
                    successMsg = "✅ ITERATION PASSED: Your FOR loop successfully ran 5 times!";
                }
            }
            else if (task === "t4") {
                // Checks for WHILE loop syntax, a condition, and a decrement
                if (lowerCode.includes("while") && lowerCode.includes(">") && lowerCode.includes("0") && (lowerCode.includes("- 1") || lowerCode.includes("-= 1"))) {
                    isCorrect = true;
                    successMsg = "✅ ITERATION PASSED: Your WHILE loop countdown worked!";
                }
            }

            // Display Results
            if (isCorrect) {
                feedbackBox.innerHTML = successMsg;
                feedbackBox.style.backgroundColor = "#e8f5e9";
                feedbackBox.style.color = "#2e7d32";
            } else {
                feedbackBox.innerHTML = "❌ Incorrect or incomplete. Read the # TASK instructions carefully and try again!";
                feedbackBox.style.backgroundColor = "#ffebee";
                feedbackBox.style.color = "#d32f2f";
            }
        }
    </script>
</body>
</html>
