<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Lesson 4 - Assessment</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- CodeMirror for Interactive Syntax Highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.2/theme/dracula.min.css">
    
    <!-- Skulpt for In-Browser Python Execution -->

    <style>
        /* Scoreboard Banner */
        .scoreboard {
            max-width: 1450px;
            margin: 20px auto 0 auto;
            padding: 15px 25px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 5px solid var(--maroon);
            font-weight: bold;
            color: var(--navy);
            gap: 15px;
            flex-wrap: wrap;
        }
        .score-item {
            text-align: center;
            font-size: 0.95em;
        }
        .score-item span {
            display: block;
            font-size: 1.3em;
            color: #388e3c;
            margin-top: 3px;
        }
        .scoreboard-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .btn-ms-form {
            background-color: #0078d4; /* Microsoft Blue */
            color: white;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 4px;
            font-size: 0.85em;
            font-weight: bold;
            display: inline-block;
            transition: background-color 0.2s;
            border: none;
            cursor: pointer;
        }
        .btn-ms-form:hover { background-color: #106ebe; }

        .btn-clear-scores {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85em;
            font-weight: bold;
        }
        .btn-clear-scores:hover { background-color: #b71c1c; }

        /* 3-Column Layout */
        .ide-container {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
            max-width: 1450px;
            margin: 20px auto;
            padding: 0 20px;
        }

        @media (max-width: 1100px) {
            .ide-container { grid-template-columns: 1fr; }
        }

        .ide-panel {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-top: 5px solid var(--navy);
            display: flex;
            flex-direction: column;
        }
        
        .editor-panel { border-top-color: #007acc; }
        .output-panel { border-top-color: var(--maroon); }

        .ide-panel h3 {
            margin-top: 0;
            color: var(--navy);
            text-transform: uppercase;
            font-size: 1.1em;
        }

        select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-family: inherit;
        }

        /* Instructions & Block Bank Styling */
        #instruction-panel {
            background-color: #f8f9fa;
            border-left: 4px solid var(--navy);
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 0 4px 4px 0;
            font-family: inherit;
            font-size: 13.5px;
            color: #333;
            flex-grow: 1;
            overflow-y: auto;
            max-height: 400px;
            line-height: 1.4;
        }

        .block-bank-container {
            border: 2px dashed #b0bec5;
            padding: 8px;
            border-radius: 8px;
            margin-top: 8px;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .code-block {
            background-color: #1a1a24;
            color: #e0e0e0;
            padding: 6px 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Courier New', Courier, monospace;
            font-size: 12px;
        }

        .add-btn {
            background-color: #ffb703;
            color: #000000;
            border: none;
            padding: 3px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
            transition: background-color 0.2s;
        }
        
        .add-btn:hover { background-color: #fb8500; }

        .btn-reset {
            background-color: #d32f2f;
            color: white;
            border: none;
            padding: 6px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            margin-top: 8px;
            width: 100%;
        }
        .btn-reset:hover { background-color: #b71c1c; }

        /* CodeMirror Editor Customization */
        .CodeMirror {
            height: 420px !important;
            border-radius: 5px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
        }

        #output {
            width: 100%;
            height: 350px;
            background-color: #000000;
            color: #4af626;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            padding: 15px;
            border: none;
            border-radius: 5px;
            overflow-y: auto;
            box-sizing: border-box;
            margin: 0;
            white-space: pre-wrap;
        }

        .btn-run {
            display: block;
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            background-color: #388e3c;
            color: white;
            text-align: center;
            border: none;
            border-radius: 5px;
            font-size: 1.05em;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        .btn-run:hover { background-color: #2e7d32; }

        .feedback-box {
            margin-top: 15px;
            padding: 12px;
            font-weight: bold;
            border-radius: 4px;
            text-align: center;
            min-height: 40px;
            background-color: #f5f5f5;
            color: var(--navy);
            font-size: 13px;
            line-height: 1.4;
        }
    </style>
</head>
