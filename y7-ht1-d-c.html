<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Y7 HT1 - Demonstrate & Connect</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .task-container { max-width: 900px; margin: 0 auto 40px auto; padding: 20px; }
        .task-card { background: white; border-radius: 8px; padding: 30px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); border-top: 6px solid #1e3a8a; margin-bottom: 20px; }
        
        .red-task { border-top-color: #d32f2f; }
        .amber-task { border-top-color: #f57c00; }
        .green-task { border-top-color: #388e3c; }
        
        .task-title { font-size: 1.5em; font-weight: bold; margin-bottom: 20px; color: #1e3a8a; }
        .red-task .task-title { color: #d32f2f; }
        .amber-task .task-title { color: #f57c00; }
        .green-task .task-title { color: #388e3c; }

        .instruction-box { background-color: #f8f9fa; border-left: 4px solid #dfaa2b; padding: 15px; margin-bottom: 25px; color: #555; font-style: italic; }
        .question-group { margin-bottom: 20px; }
        .question-group label { display: block; font-weight: bold; margin-bottom: 8px; color: #333; }
        .question-group textarea { width: 100%; padding: 12px; border: 2px solid #ccc; border-radius: 6px; font-family: inherit; font-size: 16px; box-sizing: border-box; resize: vertical; min-height: 80px; }
        
        .btn-row { display: flex; gap: 15px; margin-top: 20px; }
        .btn-mark, .btn-spag { flex: 1; padding: 15px; text-align: center; border: none; border-radius: 6px; font-size: 1.1em; font-weight: bold; cursor: pointer; }
        .btn-mark { background-color: #dfaa2b; color: #1e3a8a; }
        .btn-spag { background-color: #607d8b; color: white; }
        .btn-submit-final { display: block; width: 100%; padding: 15px; background-color: #1e3a8a; color: white; border: none; border-radius: 6px; font-size: 1.2em; font-weight: bold; cursor: pointer; margin-top: 20px; }
        
        .correct { border-color: #388e3c !important; background-color: #e8f5e9; }
        .incorrect { border-color: #d32f2f !important; background-color: #ffebee; }
        .hidden { display: none !important; }

        #score-display { font-size: 1.2em; font-weight: bold; text-align: center; margin-top: 20px; padding: 15px; border-radius: 6px; }
    </style>
</head>
<body>
    <header>
        <div class="header-left"><a href="index.html"><img src="logo.jpg" alt="Logo"></a></div>
        <div class="header-center"><h1>Year 7 Computing</h1></div>
        <div class="header-right"><a href="javascript:history.back()" class="back-btn">&larr; Back</a></div>
    </header>

    <main>
        <div class="task-container">
            <!-- STAGE 1 -->
            <div id="demonstrate-stage" class="task-card">
                <div class="task-title">Part 1: Demonstrate (Knowledge Check)</div>
                <div class="instruction-box">Write short, full sentences to answer the 5 questions below.</div>

                <div class="question-group"><label>1. Write a sentence explaining what you use a computer keyboard for:</label><textarea id="q1" spellcheck="false" placeholder="Type your sentence here..."></textarea></div>
                <div class="question-group"><label>2. Why is it important to save your files inside correctly named folders?</label><textarea id="q2" spellcheck="false" placeholder="Type your sentence here..."></textarea></div>
                <div class="question-group"><label>3. Write down one important rule for staying safe on the internet:</label><textarea id="q3" spellcheck="false" placeholder="Type your sentence here..."></textarea></div>
                <div class="question-group"><label>4. Explain what you use a computer mouse for on the screen:</label><textarea id="q4" spellcheck="false" placeholder="Type your sentence here..."></textarea></div>
                <div class="question-group"><label>5. Why is it important to keep your password a secret from other people?</label><textarea id="q5" spellcheck="false" placeholder="Type your sentence here..."></textarea></div>

                <div class="btn-row" id="stage1-buttons">
                    <button class="btn-spag" onclick="runSpagCheck()">🔍 SPAG Check</button>
                    <button class="btn-mark" onclick="markStage1()">✅ Mark My Work</button>
                </div>
                <div id="score-display" class="hidden"></div>
            </div>

            <!-- STAGE 2 (RAG) -->
            <div id="task-red" class="task-card red-task hidden">
                <div class="task-title">Part 2: Connect - RED TASK</div>
                <div class="question-group"><label>List 3 rules you should always follow to stay safe when using the internet:</label><textarea id="ans-red" placeholder="Type your list here..."></textarea></div>
                <button class="btn-submit-final" onclick="submitFinalWork()">💾 Save Final Answer</button>
            </div>

            <div id="task-amber" class="task-card amber-task hidden">
                <div class="task-title">Part 2: Connect - AMBER TASK</div>
                <div class="question-group"><label>Explain the difference between clicking "Save" and "Save As" when working on a document:</label><textarea id="ans-amber" placeholder="Type your explanation here..."></textarea></div>
                <button class="btn-submit-final" onclick="submitFinalWork()">💾 Save Final Answer</button>
            </div>

            <div id="task-green" class="task-card green-task hidden">
                <div class="task-title">Part 2: Connect - GREEN TASK</div>
                <div class="question-group"><label>Write a short paragraph explaining what a "digital footprint" is, and how you can make sure your footprint is positive:</label><textarea id="ans-green" placeholder="Type your response here..."></textarea></div>
                <button class="btn-submit-final" onclick="submitFinalWork()">💾 Save Final Answer</button>
            </div>
        </div>
    </main>
    
    <footer>&copy; 2026 Delta Serlby Park - Computing Department</footer>

    <script>
        // --- DATABASE CONNECTION ---
        const supabaseUrl = 'https://zqvrmmhiqxmghtxgjrtk.supabase.co';
        const supabaseKey = 'sb_publishable_iD26_DKTKRUWP7Jj3giEPA_f2xd5OCW';
        const db = window.supabase.createClient(supabaseUrl, supabaseKey);
        
        let dbRecordId = null;
        let globalScore = 0;
        let assignedRagLevel = "";
        
        // Pull student details from the browser memory (saved during index.html login)
        let studentName = localStorage.getItem('loggedInName');
        let className = localStorage.getItem('loggedInClass');

        // Auto-start session on load
        window.onload = async function() {
            // Kick out users who bypassed the login screen
            if (!studentName || !className) {
                alert("You are not logged in. Please return to the home page to log in.");
                window.location.href = "index.html";
                return;
            }

            // Create initial blank record in the database quietly in the background
            const { data, error } = await supabase.from('dnc_responses').insert([
                { student_name: studentName, class_name: className, task_id: 'Y7-HT1', score: 0 }
            ]).select();

            if (data && data.length > 0) {
                dbRecordId = data[0].id;
            }
        };

        async function syncToDatabase(isFinal) {
            if (!dbRecordId) return;

            let finalRagAnswer = "";
            if (assignedRagLevel === "Red Task") finalRagAnswer = document.getElementById('ans-red').value;
            if (assignedRagLevel === "Amber Task") finalRagAnswer = document.getElementById('ans-amber').value;
            if (assignedRagLevel === "Green Task") finalRagAnswer = document.getElementById('ans-green').value;

            await supabase.from('dnc_responses').update({
                q1: document.getElementById('q1').value,
                q2: document.getElementById('q2').value,
                q3: document.getElementById('q3').value,
                q4: document.getElementById('q4').value,
                q5: document.getElementById('q5').value,
                score: globalScore,
                rag_level: assignedRagLevel,
                rag_answer: finalRagAnswer
            }).eq('id', dbRecordId);

            if (isFinal) {
                alert("Task Complete! Your work has been successfully sent to the teacher dashboard.");
            }
        }

        // --- MARKING LOGIC ---
        function runSpagCheck() {
            alert("SPAG Check Enabled! Look for the red squiggly lines.");
            for (let i = 1; i <= 5; i++) {
                let box = document.getElementById('q' + i);
                box.setAttribute('spellcheck', 'true');
                let temp = box.value; box.value = ''; box.value = temp; 
            }
            document.getElementById('q1').focus(); 
        }

        function checkSentenceAnswer(inputId, keywords) {
            const el = document.getElementById(inputId);
            const ans = el.value.toLowerCase().trim();
            if (ans === "") { el.classList.add('incorrect'); return 0; }
            if (keywords.some(k => ans.includes(k.toLowerCase()))) { el.classList.add('correct'); return 1; } 
            else { el.classList.add('incorrect'); return 0; }
        }

        function markStage1() {
            globalScore = 0;
            globalScore += checkSentenceAnswer('q1', ['type', 'typing', 'write', 'enter', 'letters', 'words', 'text']);
            globalScore += checkSentenceAnswer('q2', ['organise', 'organize', 'find', 'save', 'store', 'neat', 'tidy', 'lose', 'sort']);
            globalScore += checkSentenceAnswer('q3', ['stranger', 'tell', 'adult', 'password', 'private', 'personal', 'name', 'address', 'safe', 'careful']);
            globalScore += checkSentenceAnswer('q4', ['click', 'point', 'select', 'move', 'drag', 'scroll', 'cursor', 'arrow']);
            globalScore += checkSentenceAnswer('q5', ['hack', 'hacker', 'steal', 'delete', 'account', 'safe', 'secure', 'protect', 'log in', 'login', 'guess']);

            for (let i = 1; i <= 5; i++) document.getElementById('q' + i).disabled = true;
            document.getElementById('stage1-buttons').style.display = 'none';

            const scoreDisplay = document.getElementById('score-display');
            scoreDisplay.classList.remove('hidden');
            scoreDisplay.innerText = `You scored ${globalScore} out of 5!`;

            if (globalScore <= 2) { assignedRagLevel = "Red Task"; document.getElementById('task-red').classList.remove('hidden'); scoreDisplay.style.backgroundColor = "#ffebee"; scoreDisplay.style.color = "#d32f2f"; }
            else if (globalScore >= 3 && globalScore <= 4) { assignedRagLevel = "Amber Task"; document.getElementById('task-amber').classList.remove('hidden'); scoreDisplay.style.backgroundColor = "#fff3e0"; scoreDisplay.style.color = "#ef6c00"; }
            else if (globalScore === 5) { assignedRagLevel = "Green Task"; document.getElementById('task-green').classList.remove('hidden'); scoreDisplay.style.backgroundColor = "#e8f5e9"; scoreDisplay.style.color = "#2e7d32"; }

            // Silently sync score and Q1-Q5 to database
            syncToDatabase(false);
        }

        function submitFinalWork() {
            syncToDatabase(true);
        }
    </script>
</body>
</html>
