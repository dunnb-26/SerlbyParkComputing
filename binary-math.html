<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binary Addition & Shifts - Lesson</title>
    
    <!-- HTML to PDF Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <style>
        :root {
            /* FIXED: Removed the var() wrapper from definitions */
            --navy: #1B1464; 
            --yellow: #F7931D;
            --maroon: #822433;
            --bg-color: #f4f6f8;
            --text-color: #333;
        }

        /* Using the variables to ensure colors match perfectly */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
        }

        header { 
            background-color: var(--navy); 
            color: white; 
            padding: 20px; 
            display: grid; 
            grid-template-columns: 1fr auto 1fr; 
            align-items: center; 
            border-bottom: 6px solid var(--maroon); 
        }

        .header-left { display: flex; justify-content: flex-start; }
        .header-center { text-align: center; }
        .header-right { display: flex; justify-content: flex-end; align-items: center; }
        header img { height: 80px; background-color: white; border-radius: 8px; padding: 5px; }
        header h1 { margin: 0; font-size: 28px; letter-spacing: 1px; }
        
        .back-btn { 
            background-color: var(--yellow); 
            color: var(--navy); 
            text-decoration: none; 
            padding: 10px 20px; 
            border-radius: 6px; 
            font-weight: bold; 
            transition: transform 0.2s; 
        }
        .back-btn:hover { transform: scale(1.05); }

        .task-container { max-width: 1000px; margin: 30px auto; padding: 20px; }
        .task-card { background: white; border-radius: 8px; padding: 25px; margin-bottom: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); page-break-inside: avoid; }
        
        /* Section Header Colors */
        .task-prep { border-top: 6px solid #607d8b; } 
        .task-prep h2 { color: #607d8b; margin-top: 0; }
        
        .task-maroon { border-top: 6px solid var(--maroon); } 
        .task-maroon h2 { color: var(--maroon); margin-top: 0; }
        .task-maroon .instruction-box { border-left: 4px solid var(--maroon); }

        .task-amber { border-top: 6px solid #ffb300; } 
        .task-amber h2 { color: #ffb300; margin-top: 0; text-shadow: 1px 1px 1px rgba(0,0,0,0.1); }
        .task-amber .instruction-box { border-left: 4px solid #ffb300; }

        .task-green { border-top: 6px solid #008f39; } 
        .task-green h2 { color: #008f39; margin-top: 0; }
        .task-green .instruction-box { border-left: 4px solid #008f39; }

        .task-navy { border-top: 6px solid var(--navy); } 
        .task-navy h2 { color: var(--navy); margin-top: 0; }
        .task-navy .instruction-box { border-left: 4px solid var(--navy); }

        .instruction-box { background-color: #f8f9fa; padding: 15px; border-radius: 0 4px 4px 0; font-size: 16px; line-height: 1.5; margin-bottom: 20px; text-align: center; }
        
        /* Standard Inputs */
        .question-row { margin-bottom: 25px; }
        .question-label { display: block; font-size: 16px; margin-bottom: 8px; color: var(--text-color); font-weight: bold; }
        
    </style>
</head>
<body>
    
    <header>
        <div class="header-left">
            <img src="logo.jpg" alt="Delta Serlby Park Logo">
        </div>
        <div class="header-center">
            <h1>Binary Addition & Shifts</h1>
        </div>
        <div class="header-right">
            <a href="index.html" class="back-btn">&larr; Back to Unit</a>
        </div>
    </header>

    <main class="task-container">
        <!-- Paste your lesson tasks here! -->
    </main>

</body>
</html>
