<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta Serlby Park - Computing Curriculum</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <!-- Login Modal -->
    <div id="login-modal" class="modal" style="display: flex;">
        <div class="modal-content">
            <img src="logo.jpg" alt="Delta Logo" style="max-width: 150px; margin-bottom: 20px;">
            <h2 style="color: #1e3a8a; margin-top: 0;">Student Portal Login</h2>
            <p style="color: #666; font-size: 0.9em; margin-bottom: 20px;">Enter your school username and PIN to access your saved work.</p>
            
            <input type="text" id="login-username" class="search-box" placeholder="School Username (e.g., jsmith)">
            
            <input type="password" id="login-pin" class="search-box" placeholder="PIN (default: 1234)">
            
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button class="btn-gold" style="flex: 1;" onclick="studentLogin()">Log In</button>
                <button class="btn-outline" style="flex: 1;" onclick="window.location.href='teacher-dashboard.html'">Teacher Access</button>
            </div>
            <p id="login-error" style="color: red; font-weight: bold; display: none; margin-top: 15px;"></p>
        </div>
    </div>

    <header>
        <div class="header-left">
            <a href="index.html">
                <img src="logo.jpg" alt="Delta Serlby Park Logo">
            </a>
        </div>
        <div class="header-center">
            <h1>Computing Curriculum</h1>
        </div>
        <div class="header-right">
            <span id="welcome-msg" style="color: white; font-weight: bold; margin-right: 15px;"></span>
        </div>
    </header>

    <nav>
        <button id="btn-year7" class="active" onclick="loadYear('year7')">Year 7</button>
        <button id="btn-year8" onclick="loadYear('year8')">Year 8</button>
        <button id="btn-year9" onclick="loadYear('year9')">Year 9</button>
        <button id="btn-year10" onclick="loadYear('year10')">Year 10</button>
        <button id="btn-year11" onclick="loadYear('year11')">Year 11</button>
    </nav>

    <main>
        <h2 id="year-title" style="color: #1e3a8a; text-align: center; margin-top: 30px;">Year 7 Curriculum</h2>
        <div id="content-grid" class="grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; max-width: 1200px; margin: 20px auto; padding: 20px;">
            <!-- Curriculum Cards Inject Here -->
        </div>
    </main>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyDiRDdgM7VCOxEVob_pZ73AvZaNb7SvA9Y",
            authDomain: "serlby-park-computing.firebaseapp.com",
            projectId: "serlby-park-computing",
            storageBucket: "serlby-park-computing.firebasestorage.app",
            messagingSenderId: "648533806051",
            appId: "1:648533806051:web:1e42a4263dfb1fd8e72ed6",
            measurementId: "G-HDNYEE11WV"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // Login Logic
       async function processStudentLogin() {
            const user = document.getElementById('student-username').value.trim();
            const pin = document.getElementById('student-pin').value.trim();
            const errorBox = document.getElementById('login-error');
            const submitBtn = document.getElementById('btn-student-submit');

            if (user === "" || pin === "") {
                errorBox.innerText = "Please enter both your Username and PIN.";
                errorBox.style.display = 'block';
                return;
            }

            errorBox.style.display = 'none';
            submitBtn.innerText = "Logging in...";

            try {
                const userCredential = await auth.signInWithEmailAndPassword(formatEmail(user), pin);
                const uid = userCredential.user.uid;
                
                let displayName = user; // Fallback to username

                const userDoc = await db.collection("users").doc(uid).get();
                if (!userDoc.exists) {
                    await db.collection("users").doc(uid).set({
                        username: user,
                        fullName: user,
                        className: "Unassigned",
                        lastLogin: Date.now()
                    });
                } else {
                    // Grab their actual full name from Firebase instantly
                    const data = userDoc.data();
                    if (data.fullName) {
                        displayName = data.fullName;
                    }
                }

                // Instantly update the header with their Full Name
                const welcomeMsg = document.getElementById('welcome-msg');
                if (welcomeMsg) {
                    welcomeMsg.innerText = "Logged in: " + displayName;
                }

                document.getElementById('login-gate').style.opacity = '0';
                setTimeout(() => {
                    document.getElementById('login-gate').style.display = 'none';
                    document.body.classList.remove('locked');
                }, 500);
            } catch (err) {
                submitBtn.innerText = "Log In";
                errorBox.innerText = "Incorrect username or PIN.";
                errorBox.style.display = 'block';
            }
        }

        // Curriculum Data
        const curriculumData = {
            year7: [
                { title: "Delta Welcome", description: "<ul><li>Introduction to Computational Thinking</li><li>Keyboard & Mouse Skills</li><li>File Management</li><li>Researching</li><li>E-Safety</li></ul>" },
                { title: "Microsoft Tools", description: "<ul><li>Word</li><li>PowerPoint</li><li>Email</li></ul>" },
                { title: "Binary", description: "<ul><li>Binary to Denary</li><li>Denary to Binary</li></ul>" }
            ],
            year8: [
                { title: "E-Safety & Spreadsheets", description: "<ul><li>E-Safety rules</li><li>Data Entry</li><li>Formulas</li><li>Functions</li></ul>" },
                { title: "Pixel Art", description: "<ul><li>Basic Designs</li><li>Character Creation</li></ul>" }
            ],
            year9: [
                { title: "E-Safety & Python Programming", description: "<ul><li>E-Safety rules</li><li>Sequence</li><li>Selection</li><li>Iteration</li></ul>" },
                { title: "Binary & Cyber Security", description: "<ul><li>Binary Conversions</li><li>Addition & Shifts</li><li>Hexadecimal</li><li>Security Basics</li></ul>" }
            ],
            year10: [
                { title: "Creative iMedia", description: "<ul><li>R093 - Exam</li><li>R094 - Coursework</li><li>R097 - Coursework</li></ul>" },
                { title: "Enterprise", description: "<ul><li>Component 1 - Coursework</li><li>Component 2 - Coursework</li><li>Component 3 - Exam</li></ul>" }
            ],
            year11: [
                { title: "Enterprise Coursework", description: "<ul><li>Component 1 Completion</li><li>Component 2 Final Polish</li></ul>" },
                { title: "iMedia Exam & Revision", description: "<ul><li>R093 Exam Prep</li><li>Coursework Finalisation</li></ul>" }
            ]
        };

        function loadYear(year) {
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
            document.getElementById('btn-' + year).classList.add('active');
            
            const titles = { year7: 'Year 7 Curriculum', year8: 'Year 8 Curriculum', year9: 'Year 9 Curriculum', year10: 'Year 10 Curriculum', year11: 'Year 11 Curriculum' };
            document.getElementById('year-title').innerText = titles[year];
            
            const grid = document.getElementById('content-grid');
            grid.innerHTML = "";
            
            curriculumData[year].forEach((unit, index) => {
                grid.innerHTML += `
                    <div style="background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); border-top: 6px solid #800000; display: flex; flex-direction: column;">
                        <div style="color: #800000; font-weight: bold; font-size: 0.85em; margin-bottom: 10px;">UNIT ${index + 1}</div>
                        <h3 style="color: #1e3a8a; margin-top: 0;">${unit.title}</h3>
                        <div style="color: #555; flex-grow: 1;">${unit.description}</div>
                        <button onclick="window.location.href='${unit.title.toLowerCase().replace(/ & /g, '-').replace(/ /g, '-')}.html'" style="background: #dfaa2b; color: #1e3a8a; font-weight: bold; border: none; padding: 12px; border-radius: 6px; cursor: pointer; width: 100%; margin-top: 20px;">View Unit Modules</button>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
