<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard</title>
    
    <link rel="stylesheet" href="style.css">

    <!-- Firebase SDKs (Added Auth) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f6f8; margin: 0; }
        .container { max-width: 800px; margin: 40px auto; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); border-top: 6px solid #1e3a8a; }
        select { width: 100%; padding: 12px; font-size: 1.1em; margin-bottom: 30px; border: 2px solid #cbd5e1; border-radius: 6px; font-weight: bold; color: #1e3a8a; }
        .leaderboard-row { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-bottom: 1px solid #eee; font-size: 1.2em; }
        .leaderboard-row:nth-child(1) { background: #fff8e1; font-weight: bold; font-size: 1.4em; }
        .leaderboard-row:nth-child(2) { background: #f8f9fa; font-weight: bold; font-size: 1.3em; }
        .leaderboard-row:nth-child(3) { background: #f8f9fa; font-weight: bold; font-size: 1.25em; }
        .rank-circle { background: #1e3a8a; color: white; width: 35px; height: 35px; display: inline-flex; justify-content: center; align-items: center; border-radius: 50%; margin-right: 15px; font-size: 0.9em; font-weight: bold; }
        .leaderboard-row:nth-child(1) .rank-circle { background: #dfaa2b; color: #1e3a8a; }
        .leaderboard-row:nth-child(2) .rank-circle { background: #94a3b8; }
        .leaderboard-row:nth-child(3) .rank-circle { background: #b45309; }
        .score-badge { color: #dfaa2b; font-weight: bold; background: #1e3a8a; padding: 6px 12px; border-radius: 20px; }
        #loading-message { text-align: center; color: #64748b; font-size: 1.2em; margin-top: 20px; }
        .btn-gold { background: #dfaa2b; color: #1e3a8a; border: none; padding: 8px 14px; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; text-decoration: none; display: inline-block; }
        .btn-gold:hover { background: #c99722; }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <a href="index.html"><img src="logo.jpg" alt="Logo"></a>
        </div>
        <div class="header-center">
            <h1>Leaderboard</h1>
        </div>
        <div class="header-right" style="display: flex; gap: 10px; align-items: center;">
            <a href="index.html" id="back-btn" class="back-btn" style="background-color: #607d8b; color: white; padding: 8px 14px; text-decoration: none; border-radius: 4px; font-weight: bold; font-size: 0.9em;">🔙 Back to Markbook</a>
            <button class="btn-gold" onclick="fetchStudents()">Refresh Scores</button>
        </div>
    </header>

    <div class="container">
        <h2 id="board-title" style="color:#1e3a8a; margin-top:0; text-align:center; border-bottom: 2px solid #eee; padding-bottom: 15px; margin-bottom: 20px;">🏆 Class Leaderboards</h2>
        
        <select id="class-filter" onchange="renderLeaderboard()">
            <option value="" disabled selected>Select a class to view leaderboard...</option>
            <optgroup label="Year 7"><option value="7x1">7x1</option><option value="7x2">7x2</option><option value="7y1">7y1</option><option value="7y2">7y2</option></optgroup>
            <optgroup label="Year 8"><option value="8x1">8x1</option><option value="8x2">8x2</option><option value="8y1">8y1</option><option value="8y2">8y2</option></optgroup>
            <optgroup label="Year 9"><option value="9x1">9x1</option><option value="9x2">9x2</option><option value="9y1">9y1</option><option value="9y2">9y2</option></optgroup>
            <optgroup label="GCSE Options">
                <option value="10aEnt1">10aEnt1 (Enterprise)</option>
                <option value="11aEnt1">11aEnt1 (Enterprise)</option>
                <option value="10bCim1">10bCim1 (iMedia)</option>
                <option value="11bCim1">11bCim1 (iMedia)</option>
            </optgroup>
        </select>

        <div id="leaderboard-content">
            <div id="loading-message">Authenticating user...</div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDiRDdgM7VCOxEVob_pZ73AvZaNb7SvA9Y",
            authDomain: "serlby-park-computing.firebaseapp.com",
            projectId: "serlby-park-computing",
            storageBucket: "serlby-park-computing.firebasestorage.app",
            messagingSenderId: "648533806051",
            appId: "1:648533806051:web:1e42a4263dfb1fd8e72ed6",
            measurementId: "G-HDNYEE11WV"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();

        let allStudents = [];
        let loggedInUserClass = null;

        // 1. Check who is logged in first
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                try {
                    const userDoc = await db.collection('users').doc(user.uid).get();
                    if (userDoc.exists) {
                        const userData = userDoc.data();
                        
                        // If they have a class assigned, we treat them as a student
                        if (userData.className && userData.className !== "Unassigned") {
                            loggedInUserClass = userData.className;
                            
                            // Hide the dropdown menu and teacher button
                            document.getElementById('class-filter').style.display = 'none';
                            document.getElementById('back-btn').style.display = 'none';
                            
                            // Personalize the title
                            document.getElementById('board-title').innerText = `🏆 ${loggedInUserClass} Leaderboard`;
                        }
                    }
                } catch (e) {
                    console.error("Auth check error:", e);
                }
            }
            // Once we know who they are, load the scores
            fetchStudents();
        });

        // 2. Fetch the roster
        async function fetchStudents() {
            document.getElementById('loading-message').innerText = "Loading student roster...";
            try {
                const snapshot = await db.collection('users').get();
                allStudents = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    allStudents.push({
                        uid: doc.id,
                        fullName: data.fullName || data.username || 'Unnamed Student',
                        className: data.className || 'Unassigned'
                    });
                });
                
                // If a student is logged in, auto-select their class
                if (loggedInUserClass) {
                    document.getElementById('class-filter').value = loggedInUserClass;
                    renderLeaderboard();
                } else if (document.getElementById('class-filter').value) {
                    renderLeaderboard();
                } else {
                    document.getElementById('loading-message').innerText = "Select a class above to load scores.";
                }
            } catch (err) {
                console.error('Error fetching students:', err);
                document.getElementById('loading-message').innerText = "Error loading data. Check console.";
            }
        }

        // 3. Calculate scores
        async function renderLeaderboard() {
            const classFilter = document.getElementById('class-filter').value;
            const contentDiv = document.getElementById('leaderboard-content');

            if (!classFilter) return;
            contentDiv.innerHTML = `<div id="loading-message">Calculating live scores for ${classFilter}...</div>`;

            let classStudents = allStudents.filter(student => {
                const studentClasses = String(student.className || "").toLowerCase();
                return studentClasses.includes(classFilter.toLowerCase());
            });

            if (classStudents.length === 0) {
                contentDiv.innerHTML = `<div id="loading-message">No students found in ${classFilter}.</div>`;
                return;
            }

            try {
                const scorePromises = classStudents.map(async (student) => {
                    const lessonsSnap = await db.collection('users').doc(student.uid).collection('lessons').get();
                    let totalScore = 0;

                    lessonsSnap.forEach(doc => {
                        const lessonData = doc.data();
                        let pts = 0;
                        if (lessonData.scoreText) {
                            const match = String(lessonData.scoreText).match(/\d+/);
                            if (match) pts = parseInt(match[0], 10);
                        }
                        totalScore += pts;
                    });
                    student.calculatedScore = totalScore;
                    return student;
                });

                await Promise.all(scorePromises);
                classStudents.sort((a, b) => b.calculatedScore - a.calculatedScore);

                let html = '';
                classStudents.forEach((student, index) => {
                    if (student.calculatedScore > 0) {
                        html += `
                            <div class="leaderboard-row">
                                <div>
                                    <span class="rank-circle">${index + 1}</span>
                                    <span>${escapeHtml(student.fullName)}</span>
                                </div>
                                <span class="score-badge">${student.calculatedScore} pts</span>
                            </div>
                        `;
                    }
                });

                if (html === '') {
                    contentDiv.innerHTML = `<div id="loading-message">No points scored yet in ${classFilter}.</div>`;
                } else {
                    contentDiv.innerHTML = html;
                }
            } catch (err) {
                console.error("Error calculating scores:", err);
                contentDiv.innerHTML = `<div id="loading-message">Error calculating scores. Please try again.</div>`;
            }
        }

        function escapeHtml(str) { return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
    </script>
</body>
</html>
