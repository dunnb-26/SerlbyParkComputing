<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta Serlby Park - Character Creation</title>
    
    <!-- 1. FIREBASE SDKS -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --navy: #1B1464; 
            --yellow: #F7931D;
            --maroon: #822433;
            --bg-color: #f4f6f8;
            --text-color: #333;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-color); }

        header { background-color: var(--navy); color: white; padding: 20px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; border-bottom: 6px solid var(--maroon); }
        .header-left { display: flex; justify-content: flex-start; }
        .header-center { text-align: center; }
        .header-right { display: flex; justify-content: flex-end; align-items: center; }
        header img { width: 250px; height: auto; background-color: white; border-radius: 8px; padding: 5px; }
        header h1 { margin: 0; font-size: 28px; letter-spacing: 1px; }

        #save-status-pill { font-size: 14px; margin-top: 8px; background: rgba(0,0,0,0.2); padding: 4px 12px; border-radius: 12px; display: inline-block; }

        .back-btn { background-color: var(--yellow); color: var(--navy); text-decoration: none; padding: 10px 20px; border-radius: 6px; font-weight: bold; transition: transform 0.2s; margin-left: 15px; }
        .back-btn:hover { transform: scale(1.05); }

        main { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        
        .task-card { background: white; border-radius: 8px; padding: 25px; margin-bottom: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border-top: 5px solid var(--navy); }
        .task-card h2 { color: var(--navy); margin-top: 0; }

        .instruction-box { background-color: #f8f9fa; padding: 15px; border-left: 4px solid var(--yellow); border-radius: 0 4px 4px 0; font-size: 15px; line-height: 1.5; margin-bottom: 20px; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 8px; color: var(--navy); }
        
        .auto-input { width: 100%; padding: 12px; font-size: 16px; border: 2px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: inherit; }
        .auto-input:focus { outline: none; border-color: var(--navy); }
        textarea.auto-input { resize: vertical; min-height: 90px; }

        /* Character Preview Box */
        .avatar-preview { width: 150px; height: 150px; border-radius: 50%; background: #e0e0e0; margin: 0 auto 20px auto; display: flex; align-items: center; justify-content: center; font-size: 50px; border: 4px solid var(--navy); }

        /* Universal Hidden Inputs */
        .hidden-input { display: none; }
    </style>
</head>
<body>

    <header>
        <div class="header-left">
            <img src="logo.jpg" alt="Delta Serlby Park Logo">
        </div>
        <div class="header-center">
            <h1>Lesson 3 - Character Creation</h1>
            <div id="save-status-pill">☁️ Waiting for sync...</div>
        </div>
        <div class="header-right">
            <a href="index.html" class="back-btn">&larr; Back to Unit</a>
        </div>
    </header>

    <main>
        <!-- Hidden inputs allow cloud-sync.js to seamlessly save the state -->
        <input type="text" class="auto-input hidden-input" id="hidden-task-data">

        <div class="task-card">
            <h2>Character Profile Setup</h2>
            <div class="instruction-box">Design your game character by giving them a name, choosing their class, and describing their background story. Changes save automatically to the cloud.</div>

            <div class="avatar-preview" id="avatar-icon">🛡️</div>

            <div class="form-group">
                <label>Character Name</label>
                <input type="text" class="auto-input profile-input" placeholder="Enter character name...">
            </div>

            <div class="form-group">
                <label>Character Class / Role</label>
                <select class="auto-input profile-input" onchange="updateAvatar(this.value)">
                    <option value="🛡️">Warrior (Defender)</option>
                    <option value="🔮">Mage (Spellcaster)</option>
                    <option value="🏹">Ranger (Scout)</option>
                    <option value="⚙️">Engineer (Builder)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Special Ability / Skill</label>
                <input type="text" class="auto-input profile-input" placeholder="e.g. Fireball, Stealth, Rapid Build...">
            </div>

            <div class="form-group">
                <label>Backstory & Attributes</label>
                <textarea class="auto-input profile-input" placeholder="Describe your character's history, strengths, and weaknesses..."></textarea>
            </div>
        </div>
    </main>

    <script>
        // UNIQUE LESSON ID FOR THIS PAGE
        window.LESSON_ID = 'character-creation';

        function updateAvatar(val) {
            document.getElementById('avatar-icon').innerText = val;
            syncData();
        }

        // State collection for cloud-sync.js
        function syncData() {
            let stateArr = [];
            document.querySelectorAll('.auto-input:not(.hidden-input)').forEach(inp => {
                stateArr.push(inp.value);
            });
            // Also store selected avatar icon
            stateArr.push(document.getElementById('avatar-icon').innerText);

            document.getElementById('hidden-task-data').value = JSON.stringify(stateArr);
            document.getElementById('hidden-task-data').dispatchEvent(new Event('input', { bubbles: true }));
        }

        // Attach event listeners
        document.querySelectorAll('.auto-input:not(.hidden-input)').forEach(input => {
            input.addEventListener('input', syncData);
        });

        // Wait for cloud-sync.js to load the saved state into the hidden inputs, then apply it
        let cloudLoadCheck = setInterval(() => {
            let hiddenData = document.getElementById('hidden-task-data').value;
            
            if (hiddenData && hiddenData.length > 5) {
                try {
                    let state = JSON.parse(hiddenData);
                    let visibleInputs = document.querySelectorAll('.auto-input:not(.hidden-input)');
                    state.forEach((val, i) => {
                        if (visibleInputs[i]) visibleInputs[i].value = val;
                    });
                    if (state.length > visibleInputs.length) {
                        let avatar = state[state.length - 1];
                        document.getElementById('avatar-icon').innerText = avatar;
                        // Match select option if possible
                        let select = document.querySelector('select');
                        for(let opt of select.options) {
                            if(opt.value === avatar) select.value = avatar;
                        }
                    }
                    clearInterval(cloudLoadCheck);
                } catch(e) {}
            }
        }, 500);

        setTimeout(() => clearInterval(cloudLoadCheck), 4000);
    </script>
    
    <!-- 6. THE UNIVERSAL FIREBASE SYNC ENGINE -->
    <script src="cloud-sync.js"></script>

</body>
</html>
