        :root {
            /* Delta Serlby Park Color Scheme */
            --navy: #1B1464; 
            --yellow: #F7931D;
            --maroon: #822433;
            --bg-color: #f4f6f8;
            --text-color: #333;
            --btn-gold: #e2a829;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            padding: 0; 
            background-color: var(--bg-color); 
            color: var(--text-color); 
        }

        header { 
            background-color: var(--navy); 
            color: white; 
            padding: 20px; 
            display: grid; 
            grid-template-columns: 1fr auto 1fr; 
            align-items: center; 
            border-bottom: 6px solid var(--maroon); 
        }

        .header-left { display: flex; justify-content: flex-start; }
        .header-center { text-align: center; }
        .header-right { display: flex; justify-content: flex-end; align-items: center; }

        header img { 
            height: 80px; 
            background-color: white; 
            border-radius: 8px; 
            padding: 5px;
        }

        header h1 { 
            margin: 0; 
            font-size: 28px; 
            letter-spacing: 1px;
        }
        
        .task-plenary { border-top: 6px solid #673ab7; } 
        .task-plenary h2 { color: #673ab7; margin-top: 0; }
        
        .back-btn {
            background-color: var(--yellow);
            color: var(--navy);
            text-decoration: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: bold;
            transition: transform 0.2s;
        }
        .back-btn:hover { transform: scale(1.05); }

        /* Scoreboard Banner */
        .scoreboard {
            max-width: 1450px;
            margin: 20px auto 0 auto;
            padding: 15px 25px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 5px solid var(--maroon);
            font-weight: bold;
            color: var(--navy);
            gap: 15px;
            flex-wrap: wrap;
        }
        .score-item { text-align: center; font-size: 0.95em; }
        .score-item span {
            display: block;
            font-size: 1.2em;
            color: #666;
            margin-top: 5px;
        }
        .status-started { color: #388e3c !important; font-weight: bold; }

        /* Task Card Styling for Prep Section */
        .task-card { 
            background: white; 
            border-radius: 8px; 
            padding: 25px; 
            margin: 30px auto 20px auto; 
            max-width: 900px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            page-break-inside: avoid; 
            box-sizing: border-box;
        }
        .task-prep { border-top: 6px solid #607d8b; } 
        .task-prep h2 { color: #607d8b; margin-top: 0; }

        /* Inputs & Textareas */
        .question-row { margin-bottom: 20px; }
        .question-label { display: block; font-size: 16px; margin-bottom: 8px; color: #333; font-weight: bold; }
        .auto-input { width: 100%; padding: 12px; font-size: 16px; border: 2px solid #ccc; border-radius: 4px; transition: all 0.3s ease; box-sizing: border-box; background-color: white; font-family: inherit; }
        .auto-input:focus { outline: none; border-color: #666; }
        textarea.auto-input { resize: vertical; min-height: 80px; overflow-y: hidden; }

        /* 3-Column Layout for Simulator */
        .ide-container {
            display: grid;
            grid-template-columns: 1fr 1.5fr 1fr;
            gap: 20px;
            max-width: 1450px;
            margin: 20px auto;
            padding: 0 20px;
        }

        @media (max-width: 1100px) {
            .ide-container { grid-template-columns: 1fr; }
        }
