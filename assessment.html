<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Test - Assessment</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .text-display { min-height: 120px; }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <img src="Logo.jpg" alt="Delta Serlby Park Logo">
        </div>
        
        <div class="header-center">
            <h1>Typing Assessment</h1>
            <p style="margin: 5px 0 0 0; color: #e0e0e0;">Year 7 Unit</p>
        </div>
        
        <div class="header-right">
            <a href="index.html" class="back-btn">&larr; Back to Curriculum</a>
        </div>
    </header>

    <main class="typing-main">
        <div class="stats-bar">
            <div>Time Left: <span id="time">60</span>s</div>
            <div>WPM: <span id="wpm">0</span></div>
            <div>Accuracy: <span id="accuracy">100</span>%</div>
        </div>

        <div class="controls">
            <button class="time-btn active" onclick="setTimer(60, this)">1 Minute</button>
            <button class="time-btn" onclick="setTimer(180, this)">3 Minutes</button>
            <button class="time-btn" onclick="setTimer(300, this)">5 Minutes</button>
            <button class="btn-restart" onclick="initTest()">Restart Test</button>
        </div>

        <div style="text-align: left; padding: 0 20px;">
            <ul class="instruction-list" style="color: var(--maroon); font-weight: bold; margin-bottom: 10px;">
                <li>Click the text box below.</li>
                <li>Start typing to begin the test!</li>
            </ul>
        </div>

        <div class="text-display" id="text-display" onclick="document.getElementById('hidden-input').focus()"></div>
        <input type="text" id="hidden-input" autocomplete="off">
    </main>

    <!-- Enhanced Score Pop-up Modal -->
    <div class="modal" id="result-modal">
        <div class="modal-content">
            <h2>Time's Up!</h2>
            
            <div class="results-grid">
                <div class="result-box">
                    <h3>Final WPM</h3>
                    <p class="score" id="final-wpm">0</p>
                </div>
                <div class="result-box">
                    <h3>Accuracy</h3>
                    <p class="score"><span id="final-accuracy">100</span>%</p>
                </div>
            </div>
            
            <button onclick="closeModal()">Try Again</button>
        </div>
    </div>
    
    <footer>
        &copy; 2026 Delta Serlby Park - Computing Department
    </footer>

    <script>
        const computingPhrases = [
            "Computer hardware refers to the physical parts of a computer.",
            "Software is the invisible programs and instructions for the hardware.",
            "Always log out of your accounts on shared school devices.",
            "Binary code is a special language made of ones and zeros.",
            "Algorithms are step-by-step instructions to solve a specific problem.",
            "A strong password should include numbers, symbols, and uppercase letters.",
            "Phishing is a scam where criminals try to steal your personal data.",
            "The central processing unit is often called the brain of the computer.",
            "Random access memory stores data temporarily while the computer runs.",
            "A computer network allows multiple devices to share information securely.",
            "Spreadsheets use formulas to calculate complex mathematical equations automatically.",
            "Cyber security protects networks, devices, and data from unauthorized access.",
            "A motherboard is the main circuit board that connects all computer parts together.",
            "Output devices like monitors and speakers display the results of processed data.",
            "An operating system manages all the hardware and software on a computer.",
            "A bit is the smallest unit of data in a computer and has a single binary value.",
            "Eight bits make up one byte, which is enough to store a single letter or symbol.",
            "Denary is the standard number system we use every day, based on the number ten.",
            "A Local Area Network connects computers that are close together in one building.",
            "The internet is a massive global network connecting millions of different devices.",
            "Bandwidth measures how much data can be sent over a network connection at once.",
            "Decomposition is the process of breaking a large problem down into smaller parts.",
            "Pattern recognition helps us find similarities when solving complex programming tasks.",
            "Abstraction means ignoring the unnecessary details to focus only on what is important.",
            "A sequence is a set of instructions that are executed in a specific, strict order.",
            "Iteration in programming means repeating a set of instructions using a loop.",
            "Selection uses rules to decide which path a computer program should take.",
            "Malware is malicious software designed to damage or gain access to a system.",
            "A digital footprint is the trail of data you leave behind while using the internet.",
            "Cyberbullying is unacceptable and should always be reported to a trusted adult.",
            "Two-factor authentication adds an extra layer of security to your online accounts.",
            "Vector graphics use mathematical coordinates to draw shapes that never lose quality.",
            
        ];
        
        let chunk1 = [];
        let chunk2 = [];
        let currentText = [];
        let currentLetterIndex = 0;
        let totalCorrectKeystrokes = 0;
        let totalKeystrokes = 0;
        let isTyping = false;
        let timeLeft = 60;
        let maxTime = 60;
        let timer = null;

        const displayArea = document.getElementById('text-display');
        const inputField = document.getElementById('hidden-input');
        const timeDisplay = document.getElementById('time');
        const wpmDisplay = document.getElementById('wpm');
        const accuracyDisplay = document.getElementById('accuracy');
        const modal = document.getElementById('result-modal');

        function generateChunk() {
            let chunkText = "";
            while (chunkText.split(' ').length < 15) {
                const randomPhrase = computingPhrases[Math.floor(Math.random() * computingPhrases.length)];
                chunkText += randomPhrase + " "; 
            }
            return chunkText.split('');
        }

        function renderText() {
            displayArea.innerHTML = '';
            currentText.forEach(char => {
                let span = document.createElement('span');
                span.innerText = char;
                displayArea.appendChild(span);
            });
            if(currentText.length > 0) {
                displayArea.childNodes[currentLetterIndex].classList.add('active');
            }
        }

        function shiftChunks() {
            chunk1 = chunk2;
            chunk2 = generateChunk();
            currentText = [...chunk1, ...chunk2];
            currentLetterIndex = 0;
            renderText();
        }

        function initTest() {
            chunk1 = generateChunk();
            chunk2 = generateChunk();
            currentText = [...chunk1, ...chunk2];
            currentLetterIndex = 0;
            
            renderText();
            
            inputField.value = '';
            inputField.disabled = false;
            totalCorrectKeystrokes = 0;
            totalKeystrokes = 0;
            isTyping = false;
            clearInterval(timer);
            timeLeft = maxTime;
            timeDisplay.innerText = timeLeft;
            wpmDisplay.innerText = '0';
            accuracyDisplay.innerText = '100';
            modal.style.display = 'none';
        }

        function setTimer(seconds, btn) {
            maxTime = seconds;
            document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            initTest();
        }

        function endTest() {
            clearInterval(timer);
            inputField.disabled = true; 
            
            document.getElementById('final-wpm').innerText = wpmDisplay.innerText;
            document.getElementById('final-accuracy').innerText = accuracyDisplay.innerText;
            modal.style.display = 'flex';
        }

        function closeModal() {
            modal.style.display = 'none';
            initTest();
        }

        function updateStats() {
            if (totalKeystrokes === 0) return;
            let minutesElapsed = (maxTime - timeLeft) / 60;
            if (minutesElapsed === 0) return;
            
            let wpm = Math.round((totalCorrectKeystrokes / 5) / minutesElapsed);
            let accuracy = Math.round((totalCorrectKeystrokes / totalKeystrokes) * 100);
            
            wpmDisplay.innerText = wpm > 0 ? wpm : 0;
            accuracyDisplay.innerText = accuracy > 0 ? accuracy : 100;
        }

        inputField.addEventListener('input', (e) => {
            if (!isTyping && timeLeft > 0) {
                isTyping = true;
                timer = setInterval(() => {
                    if (timeLeft > 0) {
                        timeLeft--;
                        timeDisplay.innerText = timeLeft;
                        updateStats();
                    } else {
                        endTest();
                    }
                }, 1000);
            }

            let typedChar = inputField.value;
            inputField.value = ''; 
            
            if (timeLeft > 0) {
                let span = displayArea.childNodes[currentLetterIndex];
                totalKeystrokes++;
                
                if (typedChar === span.innerText) {
                    span.classList.add('correct');
                    totalCorrectKeystrokes++;
                } else {
                    span.classList.add('incorrect');
                }
                
                span.classList.remove('active');
                currentLetterIndex++;
                
                if (currentLetterIndex === chunk1.length) {
                    shiftChunks();
                } else {
                    displayArea.childNodes[currentLetterIndex].classList.add('active');
                }
                
                updateStats();
            }
        });

        document.addEventListener('click', (e) => {
            if(e.target.closest('#text-display') || e.target.tagName === 'BODY') {
                if(timeLeft > 0) inputField.focus();
            }
        });

        initTest();
    </script>
</body>
</html>
