<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard - Visual Worksheet Markbook (Option 1)</title>
    <link rel="stylesheet" href="style.css">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f6f8;
            margin: 0;
        }

        .dashboard-layout {
            display: grid;
            grid-template-columns: 310px 1fr;
            gap: 20px;
            max-width: 1450px;
            margin: 20px auto;
            padding: 0 20px;
        }

        /* Sidebar */
        .sidebar {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            border-top: 6px solid #1e3a8a;
            height: 85vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .sidebar h3 { color: #1e3a8a; margin-top: 0; margin-bottom: 10px; }

        select, .search-box {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-weight: bold;
            box-sizing: border-box;
        }
        .search-box { font-weight: normal; }

        #student-list {
            flex-grow: 1;
            overflow-y: auto;
            margin-top: 6px;
            padding-right: 4px;
        }

        .student-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            margin-bottom: 8px;
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 6px;
            text-align: left;
            font-weight: bold;
            font-size: 0.95em;
            cursor: pointer;
            transition: 0.2s;
            color: #333;
        }
        .student-btn:hover, .student-btn.active {
            background: #1e3a8a;
            color: white;
            border-color: #1e3a8a;
        }
        .class-pill {
            background: #dfaa2b;
            color: #1e3a8a;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: bold;
            flex-shrink: 0;
        }
        .sidebar-message {
            color: #64748b;
            font-size: 0.9em;
            text-align: center;
            line-height: 1.5;
            margin: 20px 5px;
        }

        /* Main View */
        .main-view {
            background: white;
            padding: 28px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            border-top: 6px solid #dfaa2b;
            height: 85vh;
            overflow-y: auto;
            box-sizing: border-box;
        }

        .student-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 3px solid #1e3a8a;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        /* Lesson Accordion */
        .lesson-card {
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            margin-bottom: 12px;
            overflow: hidden;
            background: #fff;
        }
        .lesson-card.open {
            border-color: #1e3a8a;
            box-shadow: 0 4px 14px rgba(30, 58, 138, 0.14);
            margin-bottom: 22px;
        }
        .lesson-card-header {
            background: #f8fafc;
            color: #1e3a8a;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            user-select: none;
        }
        .lesson-card-header:hover { background: #e2e8f0; }
        .lesson-card.open .lesson-card-header { background: #1e3a8a; color: white; }

        .lesson-title-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: bold;
            font-size: 1.05em;
        }
        .chevron { display: inline-block; transition: transform 0.2s ease; font-size: 0.85em; color: #dfaa2b; }
        .lesson-card.open .chevron { transform: rotate(90deg); }
        .lesson-meta { font-size: 0.85em; color: #64748b; font-weight: bold; margin-left: 8px; white-space: nowrap; }
        .lesson-card.open .lesson-meta { color: #dfaa2b; }

        .lesson-card-body {
            display: none;
            padding: 22px;
            background: #f1f5f9;
            border-top: 2px solid #e2e8f0;
        }
        .lesson-card.open .lesson-card-body { display: block; }

        /* --- VISUAL WORKSHEET REPLICA CARDS --- */
        .ws-card {
            background: white;
            border-radius: 8px;
            padding: 20px 22px;
            margin-bottom: 20px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
            position: relative;
        }
        .ws-prep    { border-top: 6px solid #607d8b; }
        .ws-prep h3 { color: #607d8b; margin-top: 0; }
        .ws-maroon  { border-top: 6px solid #800000; }
        .ws-maroon h3 { color: #800000; margin-top: 0; }
        .ws-amber   { border-top: 6px solid #ffb300; }
        .ws-amber h3 { color: #d97706; margin-top: 0; }
        .ws-green   { border-top: 6px solid #008f39; }
        .ws-green h3 { color: #008f39; margin-top: 0; }
        .ws-navy    { border-top: 6px solid #1e3a8a; }
        .ws-navy h3 { color: #1e3a8a; margin-top: 0; }
        .ws-plenary { border-top: 6px solid #673ab7; }
        .ws-plenary h3 { color: #673ab7; margin-top: 0; }

        .ws-question-row {
            margin-bottom: 14px;
            padding: 10px 12px;
            border-radius: 6px;
            background: #fafafa;
            border: 1px solid #e2e8f0;
            position: relative;
        }
        .ws-question-row:last-child { margin-bottom: 0; }

        .ws-label {
            font-weight: bold;
            color: #333;
            font-size: 0.95em;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .ws-input-box {
            width: 100%;
            padding: 10px 12px;
            font-size: 15px;
            border: 2px solid #cbd5e1;
            border-radius: 4px;
            background: white;
            color: #1e293b;
            box-sizing: border-box;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
        .ws-input-box.empty {
            color: #94a3b8;
            font-style: italic;
            border-style: dashed;
            background: #f8fafc;
        }
        .ws-input-box.correct {
            border-color: #008f39;
            background: #e8f5e9;
            color: #006100;
            font-weight: bold;
        }
        .ws-input-box.incorrect {
            border-color: #d32f2f;
            background: #ffebee;
            color: #b71c1c;
            font-weight: bold;
        }

        /* --- PINNED TEACHER STAMPS INSIDE WORKSHEET REPLICA --- */
        .pinned-stamps-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 8px;
        }
        .ws-stamp {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 11px;
            border-radius: 6px;
            font-size: 12.5px;
            font-weight: bold;
            border: 2px solid;
            box-shadow: 0 2px 5px rgba(0,0,0,0.14);
            transform: rotate(-1.5deg);
        }
        .ws-stamp-assisted { background: #e3f2fd; color: #0d47a1; border-color: #1976d2; }
        .ws-stamp-spag     { background: #fff3e0; color: #e65100; border-color: #f57c00; }
        .ws-stamp-proud    { background: #fff8e1; color: #7f6000; border-color: #dfaa2b; }
        .ws-stamp-comment  { background: #f3e5f5; color: #4a148c; border-color: #8e24aa; transform: rotate(0deg); }

        .ws-stamp-del {
            background: rgba(0,0,0,0.1);
            border: none;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            font-size: 11px;
            line-height: 18px;
            text-align: center;
            cursor: pointer;
            color: inherit;
            padding: 0;
        }
        .ws-stamp-del:hover { background: #d32f2f; color: white; }

        .btn-add-row-stamp {
            background: #eef2ff;
            color: #1e3a8a;
            border: 1px dashed #1e3a8a;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-add-row-stamp:hover { background: #1e3a8a; color: white; }

        /* Badges & Buttons */
        .status-badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 0.78em; font-weight: bold; text-transform: uppercase; }
        .badge-verified { background: #dfaa2b; color: #1e3a8a; margin-right: 6px; }
        .btn-gold { background: #dfaa2b; color: #1e3a8a; border: none; padding: 8px 14px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-gold:hover { background: #c99722; }
        .btn-delete-lesson { background-color: #d32f2f; color: white; border: none; padding: 5px 10px; border-radius: 4px; font-size: 0.8em; font-weight: bold; cursor: pointer; margin-left: 6px; }
        .btn-delete-lesson:hover { background-color: #b71c1c; }
        .screenshot-img { max-width: 100%; max-height: 380px; border: 2px solid #1e3a8a; border-radius: 6px; margin-top: 8px; display: block; }
    </style>
</head>

<body>
    <header>
        <div class="header-left"><a href="index.html"><img src="logo.jpg" alt="Logo"></a></div>
        <div class="header-center"><h1>Teacher Cloud Markbook</h1></div>
        <div class="header-right" style="display: flex; gap: 10px; align-items: center;">
            <a href="bulk-importer.html" class="back-btn" style="background-color: #607d8b; color: white;">📥 Bulk Importer</a>
            <a href="leaderboard.html" class="btn-gold" style="background-color: #1e3a8a; color: white; text-decoration: none; font-size: 0.9em;">🏆 Leaderboards</a>
            <button class="btn-gold" onclick="fetchStudents()">Refresh Roster</button>
        </div>
    </header>

    <div class="dashboard-layout">
        <div class="sidebar">
            <h3>Class Filter</h3>
            <select id="class-filter" onchange="handleClassChange()">
                <option value="" disabled selected>Select a class...</option>
                <optgroup label="Year 7">
                    <option value="7x1">7x1</option><option value="7x2">7x2</option><option value="7y1">7y1</option><option value="7y2">7y2</option>
                </optgroup>
                <optgroup label="Year 8">
                    <option value="8x1">8x1</option><option value="8x2">8x2</option><option value="8y1">8y1</option><option value="8y2">8y2</option>
                </optgroup>
                <optgroup label="Year 9">
                    <option value="9x1">9x1</option><option value="9x2">9x2</option><option value="9y1">9y1</option><option value="9y2">9y2</option>
                </optgroup>
                <optgroup label="GCSE Options">
                    <option value="10aEnt1">10aEnt1 (Enterprise)</option><option value="11aEnt1">11aEnt1 (Enterprise)</option>
                    <option value="10bCim1">10bCim1 (iMedia)</option><option value="11bCim1">11bCim1 (iMedia)</option>
                </optgroup>
                <option value="Unassigned">Unassigned</option>
            </select>

            <input type="text" id="student-search" class="search-box" placeholder="Search student name or username..." oninput="renderSidebar()">

            <div id="student-list">
                <p class="sidebar-message">Select a class from the dropdown above to view students.</p>
            </div>
        </div>

        <div class="main-view" id="work-view">
            <h2 style="color:#666; text-align:center; margin-top:80px;">Select a class on the left to begin.</h2>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDiRDdgM7VCOxEVob_pZ73AvZaNb7SvA9Y",
            authDomain: "serlby-park-computing.firebaseapp.com",
            projectId: "serlby-park-computing",
            storageBucket: "serlby-park-computing.firebasestorage.app",
            messagingSenderId: "648533806051",
            appId: "1:648533806051:web:1e42a4263dfb1fd8e72ed6",
            measurementId: "G-HDNYEE11WV"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let allStudents = [];
        let activeStudent = null;
        let activeLessonsCache = {};
        let portfolioRequestId = 0;

        async function fetchStudents() {
            try {
                const snapshot = await db.collection('users').get();
                allStudents = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    allStudents.push({
                        uid: doc.id,
                        username: data.username || doc.id,
                        fullName: data.fullName || data.username || 'Unnamed Student',
                        className: data.className || 'Unassigned'
                    });
                });
                allStudents.sort((a, b) => a.fullName.localeCompare(b.fullName));
                if (activeStudent) activeStudent = allStudents.find(s => s.uid === activeStudent.uid) || null;
                renderSidebar();
            } catch (err) {
                console.error('Error fetching students:', err);
            }
        }

        function handleClassChange() {
            portfolioRequestId++;
            activeStudent = null;
            document.getElementById('student-search').value = '';
            document.getElementById('work-view').innerHTML = `<h2 style="color:#666; text-align:center; margin-top:80px;">Select a student from the roster to view their visual worksheet.</h2>`;
            renderSidebar();
        }

        function renderSidebar() {
            const listDiv = document.getElementById('student-list');
            const classFilter = document.getElementById('class-filter').value;
            const searchQuery = document.getElementById('student-search').value.toLowerCase().trim();
            listDiv.innerHTML = '';

            if (!classFilter && !searchQuery) {
                listDiv.innerHTML = `<p class="sidebar-message">Please select a class from the dropdown above.</p>`;
                return;
            }

            const filtered = allStudents.filter(student => {
                const studentClasses = String(student.className || "").toLowerCase();
                const matchesClass = !classFilter || studentClasses.includes(classFilter.toLowerCase());
                const matchesSearch = !searchQuery || student.fullName.toLowerCase().includes(searchQuery) || student.username.toLowerCase().includes(searchQuery);
                return matchesClass && matchesSearch;
            });

            if (filtered.length === 0) {
                listDiv.innerHTML = `<p class="sidebar-message">No students found matching your filters.</p>`;
                return;
            }

            filtered.forEach(student => {
                const btn = document.createElement('button');
                btn.className = 'student-btn' + (activeStudent && activeStudent.uid === student.uid ? ' active' : '');
                btn.innerHTML = `
                    <span>${escapeHtml(student.fullName)}<br><small style="font-weight:normal; opacity:0.8;">@${escapeHtml(student.username)}</small></span>
                    <span class="class-pill">${escapeHtml(student.className)}</span>
                `;
                btn.onclick = () => {
                    activeStudent = student;
                    renderSidebar();
                    loadStudentPortfolio(student);
                };
                listDiv.appendChild(btn);
            });
        }

        async function loadStudentPortfolio(student) {
            const viewDiv = document.getElementById('work-view');
            const requestId = ++portfolioRequestId;
            viewDiv.innerHTML = `<h3 style="color:#1e3a8a;">Loading visual worksheets for ${escapeHtml(student.fullName)}...</h3>`;

            try {
                const lessonsSnap = await db.collection('users').doc(student.uid).collection('lessons').get();
                if (requestId !== portfolioRequestId || !activeStudent || activeStudent.uid !== student.uid) return;

                let lessons = [];
                activeLessonsCache = {};
                lessonsSnap.forEach(doc => {
                    const obj = { id: doc.id, ...doc.data() };
                    lessons.push(obj);
                    activeLessonsCache[doc.id] = obj;
                });

                lessons.sort((a, b) => (b.lastUpdated || 0) - (a.lastUpdated || 0));

                let html = `
                    <div class="student-header">
                        <div>
                            <h2 style="margin:0; color:#1e3a8a;">${escapeHtml(student.fullName)}</h2>
                            <p style="margin:5px 0 0 0; color:#64748b; font-weight:bold;">Completed Lessons: <strong style="color:#1e3a8a;">${lessons.length}</strong></p>
                        </div>
                        <button class="btn-gold" onclick="refreshActivePortfolio()">Refresh Work</button>
                    </div>
                `;

                if (lessons.length === 0) {
                    html += `<div style="text-align:center; padding:50px 20px; background:#f8f9fa; border-radius:8px; border:2px dashed #cbd5e1;"><h3 style="color:#64748b;">No Cloud Work Saved Yet</h3></div>`;
                    viewDiv.innerHTML = html;
                    return;
                }

                html += `<div id="lessons-accordion-container">`;
                lessons.forEach((lesson, index) => {
                    html += renderVisualWorksheetCard(student, lesson, index);
                });
                html += `</div>`;
                viewDiv.innerHTML = html;
            } catch (err) {
                console.error('Error loading portfolio:', err);
            }
        }

        /* --- GROUP ITEMS INTO VISUAL RAGB WORKSHEET CARDS --- */
        function detectSectionStyle(classStr, idx, total) {
            const c = (classStr || '').toLowerCase();
            if (c.includes('red-input') || c.includes('maroon')) return { key: 'maroon', title: 'Red Task', css: 'ws-maroon' };
            if (c.includes('amber-input')) return { key: 'amber', title: 'Amber Task', css: 'ws-amber' };
            if (c.includes('green-input')) return { key: 'green', title: 'Green Task', css: 'ws-green' };
            if (c.includes('navy-input') || c.includes('blue-input')) return { key: 'navy', title: 'Blue Task', css: 'ws-navy' };
            if (idx >= total - 3) return { key: 'plenary', title: 'Lesson Plenary', css: 'ws-plenary' };
            return { key: 'prep', title: 'Lesson Preparation & Notes', css: 'ws-prep' };
        }

        function renderStampBadge(studentUid, lessonId, stamp) {
            const cls = stamp.type === 'comment' ? 'ws-stamp-comment' : `ws-stamp-${stamp.type || 'assisted'}`;
            return `
                <span class="ws-stamp ${cls}">
                    ${escapeHtml(stamp.text)}
                    <button class="ws-stamp-del" title="Remove stamp" onclick="removeMarkbookStamp('${studentUid}', '${lessonId}', '${stamp.id}')">×</button>
                </span>
            `;
        }

        function renderVisualWorksheetCard(student, lesson, index) {
            const title = lesson.pageTitle || lesson.id.replace(/-/g, ' ');
            const updatedDate = lesson.lastUpdated
                ? new Date(lesson.lastUpdated).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })
                : 'Saved';

            const stamps = Array.isArray(lesson.teacherStamps) ? lesson.teacherStamps : [];
            let usedStampIds = new Set();

            // Header Badges
            let badgesHtml = '';
            if (lesson.scoreText) badgesHtml += `<span class="status-badge badge-verified">${escapeHtml(lesson.scoreText)}</span>`;
            stamps.forEach(s => {
                const cls = s.type === 'comment' ? 'ws-stamp-comment' : `ws-stamp-${s.type || 'assisted'}`;
                badgesHtml += `<span class="ws-stamp ${cls}" style="padding:2px 8px; font-size:11px; transform:none; box-shadow:none;">${escapeHtml(s.text)}</span>`;
            });
            badgesHtml += `<button class="btn-delete-lesson" onclick="event.stopPropagation(); deleteStudentLesson('${student.uid}', '${lesson.id}', '${escapeHtml(title)}')">🗑️ Delete</button>`;

            let bodyHtml = '';
            const items = Array.isArray(lesson.items) ? lesson.items : [];

            if (items.length > 0) {
                // Group questions into visual RAGB cards
                const sections = [];
                items.forEach((item, idx) => {
                    const rawClass = lesson['class_' + idx] || '';
                    const secInfo = detectSectionStyle(rawClass, idx, items.length);
                    let lastSec = sections[sections.length - 1];
                    if (!lastSec || lastSec.key !== secInfo.key) {
                        lastSec = { ...secInfo, rows: [] };
                        sections.push(lastSec);
                    }
                    lastSec.rows.push({ item, idx });
                });

                sections.forEach(sec => {
                    // Find any stamps pinned to this card's heading (e.g. "Amber Task: 4-Bit...")
                    const cardStamps = stamps.filter(s => !usedStampIds.has(s.id) && s.targetLabel && s.targetLabel.toLowerCase().startsWith(sec.title.toLowerCase()));
                    cardStamps.forEach(s => usedStampIds.add(s.id));

                    let cardStampsHtml = cardStamps.length > 0
                        ? `<div class="pinned-stamps-bar">${cardStamps.map(s => renderStampBadge(student.uid, lesson.id, s)).join('')}</div>`
                        : '';

                    let rowsHtml = '';
                    sec.rows.forEach(({ item, idx }) => {
                        const labelText = item.label || `Question ${idx + 1}`;
                        const val = (item.value || '').trim();
                        const isEmpty = val === '';
                        let boxClass = 'ws-input-box' + (isEmpty ? ' empty' : '');
                        if (item.status === 'correct') boxClass += ' correct';
                        else if (item.status === 'incorrect') boxClass += ' incorrect';

                        // Find any stamps pinned directly to this exact question row
                        const rowStamps = stamps.filter(s => !usedStampIds.has(s.id) && s.targetLabel && s.targetLabel === labelText);
                        rowStamps.forEach(s => usedStampIds.add(s.id));

                        const rowStampsHtml = rowStamps.length > 0
                            ? `<div class="pinned-stamps-bar">${rowStamps.map(s => renderStampBadge(student.uid, lesson.id, s)).join('')}</div>`
                            : '';

                        rowsHtml += `
                            <div class="ws-question-row">
                                ${rowStampsHtml}
                                <div class="ws-label">
                                    <span>${escapeHtml(labelText)}</span>
                                    <button class="btn-add-row-stamp" onclick="addMarkbookStamp('${student.uid}', '${lesson.id}', '${escapeHtml(labelText)}')">+ Stamp / Note</button>
                                </div>
                                <div class="${boxClass}">${isEmpty ? '(Left blank)' : escapeHtml(val)}</div>
                            </div>
                        `;
                    });

                    bodyHtml += `
                        <div class="ws-card ${sec.css}">
                            <h3>${escapeHtml(sec.title)}</h3>
                            ${cardStampsHtml}
                            ${rowsHtml}
                        </div>
                    `;
                });
            }

            // Any general stamps placed on the page that didn't match a specific row
            const generalStamps = stamps.filter(s => !usedStampIds.has(s.id));
            if (generalStamps.length > 0) {
                bodyHtml = `
                    <div class="ws-card" style="border-top: 6px solid #1e3a8a;">
                        <h3 style="color:#1e3a8a; margin-top:0;">📌 General Page Stamps</h3>
                        <div class="pinned-stamps-bar">
                            ${generalStamps.map(s => renderStampBadge(student.uid, lesson.id, s)).join('')}
                        </div>
                    </div>
                ` + bodyHtml;
            }

            // Render any pasted screenshots
            ['maroon', 'amber', 'green', 'navy'].forEach(zone => {
                const imgKey = 'img_' + zone;
                if (lesson[imgKey] && String(lesson[imgKey]).startsWith('data:image')) {
                    bodyHtml += `
                        <div class="ws-card ws-${zone}">
                            <h3>📸 Task Screenshot (${zone.toUpperCase()})</h3>
                            <img class="screenshot-img" src="${lesson[imgKey]}" alt="Student Screenshot">
                        </div>
                    `;
                }
            });

            if (!bodyHtml) {
                bodyHtml = `<p style="color:#94a3b8; font-style:italic; margin:0;">Student opened this lesson, but no inputs were recorded.</p>`;
            }

            return `
                <div class="lesson-card" id="lesson-card-${index}">
                    <div class="lesson-card-header" onclick="toggleLessonCard(${index})">
                        <div class="lesson-title-wrap">
                            <span class="chevron">&#9654;</span>
                            <span>${escapeHtml(title)}</span>
                        </div>
                        <div style="display:flex; align-items:center; flex-wrap:wrap; gap: 6px;">
                            ${badgesHtml}
                            <span class="lesson-meta">${updatedDate}</span>
                        </div>
                    </div>
                    <div class="lesson-card-body">
                        ${bodyHtml}
                    </div>
                </div>
            `;
        }

        /* --- ADD / REMOVE STAMPS DIRECTLY INSIDE THE MARKBOOK --- */
        async function addMarkbookStamp(studentUid, lessonId, targetLabel) {
            const choice = prompt("Choose a stamp number or type a custom comment:\n1 = 🤝 Teacher Assisted\n2 = ✍️ SPaG Issues\n3 = 🏆 Proud Thursday Given\nOr type any custom comment:");
            if (!choice || !choice.trim()) return;

            let type = 'comment';
            let text = "💬 " + choice.trim();
            if (choice.trim() === '1') { type = 'assisted'; text = "🤝 Teacher Assisted"; }
            else if (choice.trim() === '2') { type = 'spag'; text = "✍️ SPaG Issues"; }
            else if (choice.trim() === '3') { type = 'proud'; text = "🏆 Proud Thursday Given"; }

            const lesson = activeLessonsCache[lessonId] || {};
            const updatedStamps = Array.isArray(lesson.teacherStamps) ? [...lesson.teacherStamps] : [];
            updatedStamps.push({
                id: Date.now().toString(),
                type,
                text,
                targetLabel,
                x: "50",
                y: "50"
            });

            await db.collection('users').doc(studentUid).collection('lessons').doc(lessonId)
                .set({ teacherStamps: updatedStamps, lastUpdated: Date.now() }, { merge: true });
            refreshActivePortfolio();
        }

        async function removeMarkbookStamp(studentUid, lessonId, stampId) {
            const lesson = activeLessonsCache[lessonId] || {};
            const updatedStamps = (lesson.teacherStamps || []).filter(s => s.id !== stampId);
            await db.collection('users').doc(studentUid).collection('lessons').doc(lessonId)
                .set({ teacherStamps: updatedStamps }, { merge: true });
            refreshActivePortfolio();
        }

        async function deleteStudentLesson(studentUid, lessonId, lessonTitle) {
            if (confirm(`Delete "${lessonTitle}" for this student?`)) {
                await db.collection('users').doc(studentUid).collection('lessons').doc(lessonId).delete();
                refreshActivePortfolio();
            }
        }

        function refreshActivePortfolio() {
            if (activeStudent) loadStudentPortfolio(activeStudent);
        }

        function toggleLessonCard(index) {
            const clickedCard = document.getElementById(`lesson-card-${index}`);
            if (!clickedCard) return;
            const isAlreadyOpen = clickedCard.classList.contains('open');
            document.querySelectorAll('.lesson-card').forEach(card => card.classList.remove('open'));
            if (!isAlreadyOpen) clickedCard.classList.add('open');
        }

        function escapeHtml(str) {
            return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        window.onload = fetchStudents;
    </script>
</body>
</html>
