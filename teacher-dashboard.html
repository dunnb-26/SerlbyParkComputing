
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Teacher Dashboard - Live Student Work</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        .dashboard-layout {
            display:grid;
            grid-template-columns:280px minmax(0,1fr);
            gap:20px;
            max-width:1500px;
            margin:20px auto;
            padding:0 20px;
        }
        .sidebar,.workspace {
            background:white;
            border-radius:8px;
            padding:20px;
            box-shadow:0 4px 10px #00000012;
            min-width:0;
        }
        .sidebar {
            border-top:6px solid #1e3a8a;
            max-height:85vh;
            overflow:auto;
        }
        .workspace {
            border-top:6px solid #dfaa2b;
            height:85vh;
            display:flex;
            flex-direction:column;
            overflow:hidden;
        }
        .student-btn {
            width:100%;
            padding:12px;
            margin:0 0 8px;
            text-align:left;
            border:1px solid #ddd;
            border-radius:4px;
            background:#f8f9fa;
            cursor:pointer;
            overflow-wrap:anywhere;
        }
        .student-btn.active,.student-btn:hover {
            background:#1e3a8a;
            color:white;
        }
        .student-btn small {
            display:block;
            margin-top:4px;
            opacity:.8;
        }
        #class-filter,#student-search {
            width:100%;
            box-sizing:border-box;
            padding:10px;
            margin-bottom:12px;
        }
        #student-frame {
            width:100%;
            flex:1;
            min-height:0;
            border:1px solid #ddd;
            border-radius:6px;
        }
        .toolbar {
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:10px;
            flex-wrap:wrap;
            margin-bottom:12px;
        }
        .toolbar button {
            padding:9px 14px;
            cursor:pointer;
        }
        @media(max-width:800px) {
            .dashboard-layout {grid-template-columns:1fr;}
            .sidebar {max-height:35vh;}
            .workspace {height:75vh;}
        }
    </style>
</head>
<body>
<header>
    <div class="header-left">
        <a href="index.html"><img src="logo.jpg" alt="Logo"></a>
    </div>
    <div class="header-center"><h1>Teacher Dashboard</h1></div>
    <div class="header-right">
        <button id="refresh-btn" type="button">↻ Refresh</button>
    </div>
</header>

<main class="dashboard-layout">
    <aside class="sidebar">
        <h2>Class Roster</h2>

        <input id="student-search" type="search"
               placeholder="Search students..." aria-label="Search students">

        <select id="class-filter" aria-label="Filter by class">
            <option value="ALL">All Classes</option>
            <optgroup label="Year 7">
                <option>7x1</option><option>7x2</option>
                <option>7y1</option><option>7y2</option>
            </optgroup>
            <optgroup label="Year 8">
                <option>8x1</option><option>8x2</option>
                <option>8y1</option><option>8y2</option>
            </optgroup>
            <optgroup label="Year 9">
                <option>9x1</option><option>9x2</option>
                <option>9y1</option><option>9y2</option>
            </optgroup>
            <optgroup label="GCSE Options">
                <option value="10aEnt1">10aEnt1</option>
                <option value="11aEnt1">11aEnt1</option>
                <option value="10bCim1">10bCim1</option>
                <option value="11bCim1">11bCim1</option>
            </optgroup>
        </select>

        <p id="roster-status" role="status">Checking teacher access...</p>
        <div id="student-list"></div>
    </aside>

    <section class="workspace">
        <div class="toolbar">
            <div>
                <h2 id="view-title">Student workspace</h2>
                <p id="view-status">Select a student from the roster.</p>
            </div>
            <button id="reload-page" type="button" disabled>
                Reload student page
            </button>
        </div>

        <iframe id="student-frame" title="Selected student's website"
                hidden></iframe>
        <div id="empty-view">
            Select a student to open their homepage and navigate their work.
        </div>
    </section>
</main>

<script>
const firebaseConfig = {
    apiKey: "YOUR_EXISTING_FIREBASE_API_KEY",
    authDomain: "serlby-park-computing.firebaseapp.com",
    projectId: "serlby-park-computing",
    storageBucket: "serlby-park-computing.firebasestorage.app",
    messagingSenderId: "648533806051",
    appId: "1:648533806051:web:1e42a4263dfb1fd8e72ed6"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

const list = document.getElementById('student-list');
const status = document.getElementById('roster-status');
const frame = document.getElementById('student-frame');
const filter = document.getElementById('class-filter');
const search = document.getElementById('student-search');

let students = [];
let selectedUid = null;
let authorized = false;

function renderRoster() {
    list.replaceChildren();

    const term = search.value.trim().toLowerCase();
    const className = filter.value;

    const visible = students.filter(student =>
        (className === 'ALL' || student.className === className) &&
        student.username.toLowerCase().includes(term)
    );

    if (!visible.length) {
        list.textContent = 'No students found.';
        return;
    }

    visible.forEach(student => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = 'student-btn' +
            (student.uid === selectedUid ? ' active' : '');

        const name = document.createElement('strong');
        name.textContent = student.username;

        const details = document.createElement('small');
        details.textContent = student.className;

        button.append(name, details);
        button.addEventListener('click', () => selectStudent(student));
        list.appendChild(button);
    });
}

function selectStudent(student) {
    if (!authorized) return;

    selectedUid = student.uid;

    // Same-origin pages in this browsing session can read this context.
    sessionStorage.setItem('teacherMode', 'true');
    sessionStorage.setItem('inspectStudentUid', student.uid);
    sessionStorage.setItem('inspectStudentName', student.username);

    document.getElementById('view-title').textContent =
        'Viewing: ' + student.username;
    document.getElementById('view-status').textContent =
        'Class: ' + student.className;
    document.getElementById('empty-view').hidden = true;
    frame.hidden = false;

    // Start from the student's normal homepage.
    frame.src = 'index.html?teacherView=1&uid=' +
        encodeURIComponent(student.uid);

    document.getElementById('reload-page').disabled = false;
    renderRoster();
}

async function fetchStudents() {
    if (!authorized) return;

    status.textContent = 'Loading students...';
    list.replaceChildren();

    try {
        const snapshot = await db.collection('users').get();

        students = snapshot.docs.map(doc => {
            const data = doc.data();
            return {
                uid: doc.id,
                username: data.username || data.fullName || 'Unknown',
                className: data.className || 'Unassigned'
            };
        }).sort((a, b) => a.username.localeCompare(b.username));

        status.textContent = students.length + ' students';
        renderRoster();
    } catch (error) {
        console.error(error);
        status.textContent = 'Could not load roster: ' + error.message;
    }
}

auth.onAuthStateChanged(async user => {
    authorized = false;

    if (!user) {
        status.textContent = 'Please sign in with your teacher account.';
        return;
    }

    try {
        const token = await user.getIdTokenResult(true);

        if (token.claims.teacher !== true) {
            status.textContent = 'Access denied: teacher permission required.';
            return;
        }

        authorized = true;
        await fetchStudents();
    } catch (error) {
        console.error(error);
        status.textContent = 'Could not verify teacher permissions.';
    }
});

filter.addEventListener('change', renderRoster);
search.addEventListener('input', renderRoster);
document.getElementById('refresh-btn').addEventListener('click', fetchStudents);
document.getElementById('reload-page').addEventListener('click', () => {
    if (frame.src) frame.contentWindow.location.reload();
});
</script>
</body>
</html>
