<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard - Cloud Markbook</title>
    <link rel="stylesheet" href="style.css">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f6f8;
            margin: 0;
        }

        .dashboard-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 20px;
            max-width: 1400px;
            margin: 20px auto;
            padding: 0 20px;
        }

        /* Sidebar */
        .sidebar {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            border-top: 6px solid #1e3a8a;
            height: 85vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .sidebar h3 {
            color: #1e3a8a;
            margin-top: 0;
            margin-bottom: 10px;
        }

        select, .search-box {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-weight: bold;
            box-sizing: border-box;
        }

        .search-box {
            font-weight: normal;
        }

        #student-list {
            flex-grow: 1;
            overflow-y: auto;
            margin-top: 6px;
            padding-right: 4px;
        }

        .student-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            margin-bottom: 8px;
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 6px;
            text-align: left;
            font-weight: bold;
            font-size: 0.95em;
            cursor: pointer;
            transition: 0.2s;
            color: #333;
        }

        .student-btn:hover,
        .student-btn.active {
            background: #1e3a8a;
            color: white;
            border-color: #1e3a8a;
        }

        .student-btn > span:first-child {
            overflow-wrap: anywhere;
        }

        .class-pill {
            background: #dfaa2b;
            color: #1e3a8a;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: bold;
            flex-shrink: 0;
        }

        .sidebar-message {
            color: #64748b;
            font-size: 0.9em;
            text-align: center;
            line-height: 1.5;
            margin: 20px 5px;
        }

        /* Main Markbook View */
        .main-view {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            border-top: 6px solid #dfaa2b;
            height: 85vh;
            overflow-y: auto;
            box-sizing: border-box;
        }

        .student-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 3px solid #1e3a8a;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .toolbar-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 18px;
            background: #f8f9fa;
            padding: 12px 15px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
        }

        /* Lesson Accordion - LIST VIEW */
        .lesson-card {
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            margin-bottom: 10px;
            overflow: hidden;
            background: #fff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .lesson-card.open {
            border-color: #1e3a8a;
            box-shadow: 0 4px 12px rgba(30, 58, 138, 0.12);
            margin-bottom: 18px;
        }

        .lesson-card-header {
            background: #f8fafc;
            color: #1e3a8a;
            padding: 14px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            user-select: none;
            transition: background 0.15s, color 0.15s;
        }

        .lesson-card-header:hover {
            background: #e2e8f0;
        }

        .lesson-card.open .lesson-card-header {
            background: #1e3a8a;
            color: white;
        }

        .lesson-title-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: bold;
            font-size: 1.05em;
        }

        .chevron {
            display: inline-block;
            transition: transform 0.2s ease;
            font-size: 0.85em;
            color: #dfaa2b;
        }

        .lesson-card.open .chevron {
            transform: rotate(90deg);
        }

        .lesson-meta {
            font-size: 0.85em;
            color: #64748b;
            font-weight: bold;
            margin-left: 10px;
            white-space: nowrap;
        }

        .lesson-card.open .lesson-meta {
            color: #dfaa2b;
        }

        /* HIDES ALL WORK BY DEFAULT */
        .lesson-card-body {
            display: none; 
            padding: 20px;
            border-top: 2px solid #e2e8f0;
            background: #ffffff;
        }

        /* SHOWS WORK ONLY WHEN CLICKED */
        .lesson-card.open .lesson-card-body {
            display: block; 
        }

        /* Questions and Answers */
        .qa-row {
            border-bottom: 1px solid #eee;
            padding: 12px 0;
        }

        .qa-row:last-child {
            border-bottom: none;
        }

        .qa-label {
            font-weight: bold;
            color: #1e3a8a;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            font-size: 0.95em;
        }

        .answer-box {
            background: #f8f9fa;
            border: 2px solid #cbd5e1;
            padding: 12px;
            border-radius: 6px;
            color: #1e293b;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font-family: inherit;
            min-height: 24px;
        }

        .answer-box.empty {
            color: #94a3b8;
            font-style: italic;
            background: #f1f5f9;
            border-style: dashed;
        }

        .answer-box.correct {
            border-color: #2e7d32;
            background: #e8f5e9;
        }

        .answer-box.incorrect {
            border-color: #d32f2f;
            background: #ffebee;
        }

        /* Status Badges */
        .status-badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.78em;
            font-weight: bold;
            text-transform: uppercase;
        }

        .badge-correct { background: #2e7d32; color: white; }
        .badge-incorrect { background: #d32f2f; color: white; }
        .badge-verified { background: #dfaa2b; color: #1e3a8a; margin-right: 6px; }

        .screenshot-img {
            max-width: 100%;
            max-height: 380px;
            border: 2px solid #1e3a8a;
            border-radius: 6px;
            margin-top: 10px;
            display: block;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        /* Pixel Art Grid Preview */
        .pixel-preview-wrap {
            margin-top: 10px;
            display: inline-block;
            background: #ffffff;
            padding: 8px;
            border-radius: 6px;
            border: 2px solid #cbd5e1;
            box-shadow: 0 2px 5px rgba(0,0,0,0.06);
        }

        .pixel-preview-grid {
            display: grid;
            grid-template-columns: repeat(10, 22px);
            grid-template-rows: repeat(10, 22px);
            border: 1px solid #94a3b8;
        }

        .pixel-preview-cell {
            width: 22px;
            height: 22px;
            border: 1px solid #e2e8f0;
            box-sizing: border-box;
        }

        .btn-gold {
            background: #dfaa2b;
            color: #1e3a8a;
            border: none;
            padding: 8px 14px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-gold:hover { background: #c99722; }

        .btn-outline {
            background: white;
            color: #1e3a8a;
            border: 1px solid #1e3a8a;
            padding: 7px 12px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85em;
        }

        .btn-outline:hover {
            background: #1e3a8a;
            color: white;
        }
    </style>
</head>

<body>
    <header>
        <div class="header-left">
            <a href="index.html">
                <img src="logo.jpg" alt="Logo">
            </a>
        </div>

        <div class="header-center">
            <h1>Teacher Cloud Markbook</h1>
        </div>

        <div class="header-right">
            <button class="btn-gold" onclick="fetchStudents()">
                Refresh Roster
            </button>
        </div>
    </header>

    <div class="dashboard-layout">

        <!-- Sidebar -->
        <div class="sidebar">
            <h3>Class Filter</h3>

            <select id="class-filter" onchange="handleClassChange()">
                <option value="" disabled selected>Select a class...</option>
                <optgroup label="Year 7">
                    <option value="7x1">7x1</option>
                    <option value="7x2">7x2</option>
                    <option value="7y1">7y1</option>
                    <option value="7y2">7y2</option>
                </optgroup>

                <optgroup label="Year 8">
                    <option value="8x1">8x1</option>
                    <option value="8x2">8x2</option>
                    <option value="8y1">8y1</option>
                    <option value="8y2">8y2</option>
                </optgroup>

                <optgroup label="Year 9">
                    <option value="9x1">9x1</option>
                    <option value="9x2">9x2</option>
                    <option value="9y1">9y1</option>
                    <option value="9y2">9y2</option>
                </optgroup>

                <optgroup label="GCSE Options">
                    <option value="10aEnt1">10aEnt1 (Enterprise)</option>
                    <option value="11aEnt1">11aEnt1 (Enterprise)</option>
                    <option value="10bCim1">10bCim1 (iMedia)</option>
                    <option value="11bCim1">11bCim1 (iMedia)</option>
                </optgroup>

                <option value="Unassigned">Unassigned</option>
            </select>

            <input
                type="text"
                id="student-search"
                class="search-box"
                placeholder="Search student name or username..."
                oninput="renderSidebar()"
            >

            <div id="student-list">
                <p class="sidebar-message">Select a class from the dropdown above to view students.</p>
            </div>
        </div>

        <!-- Main Markbook View -->
        <div class="main-view" id="work-view">
            <h2 style="color:#666; text-align:center; margin-top:80px;">
                Select a class on the left to begin.
            </h2>
        </div>

    </div>

    <script>
        // 1. Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDiRDdgM7VCOxEVob_pZ73AvZaNb7SvA9Y",
            authDomain: "serlby-park-computing.firebaseapp.com",
            projectId: "serlby-park-computing",
            storageBucket: "serlby-park-computing.firebasestorage.app",
            messagingSenderId: "648533806051",
            appId: "1:648533806051:web:1e42a4263dfb1fd8e72ed6",
            measurementId: "G-HDNYEE11WV"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }

        const db = firebase.firestore();

        let allStudents = [];
        let activeStudent = null;
        let portfolioRequestId = 0;

        // Universal Binary & Denary Pixel Art Colour Map
        const pixelColorMap = {
            '0000': '#ffffff', '0': '#ffffff',
            '0001': '#000000', '1': '#000000',
            '0010': '#d32f2f', '2': '#d32f2f',
            '0011': '#388e3c', '3': '#388e3c',
            '0100': '#1976d2', '4': '#1976d2',
            '0101': '#fbc02d', '5': '#fbc02d',
            '0110': '#f57c00', '6': '#f57c00',
            '0111': '#8e24aa', '7': '#8e24aa',
            '1000': '#e91e63', '8': '#e91e63',
            '1001': '#00bcd4', '9': '#00bcd4',
            '1010': '#cddc39', '10': '#cddc39',
            '1011': '#795548', '11': '#795548',
            '1100': '#9e9e9e', '12': '#9e9e9e',
            '1101': '#607d8b', '13': '#607d8b',
            '1110': '#8d6e63', '14': '#8d6e63',
            '1111': '#009688', '15': '#009688'
        };

        // Helper: Render a 10x10 Pixel Art Grid from an array of codes
        function buildPixelArtHtml(gridArray) {
            if (!Array.isArray(gridArray) || gridArray.length === 0) return '';
            const hasPainted = gridArray.some(code => {
                const c = String(code || '').trim();
                return pixelColorMap[c] && pixelColorMap[c] !== '#ffffff';
            });
            if (!hasPainted) return '';

            let cellsHtml = '';
            for (let i = 0; i < 100; i++) {
                const code = String(gridArray[i] || '').trim();
                const bg = pixelColorMap[code] || '#ffffff';
                const titleAttr = code ? `title="Code: ${escapeHtml(code)}"` : '';
                cellsHtml += `<div class="pixel-preview-cell" style="background-color: ${bg};" ${titleAttr}></div>`;
            }

            return `
                <div class="pixel-preview-wrap">
                    <div class="pixel-preview-grid">${cellsHtml}</div>
                </div>
            `;
        }

        // 2. Fetch Students from Firestore
        async function fetchStudents() {
            try {
                const snapshot = await db.collection('users').get();
                allStudents = [];

                snapshot.forEach(doc => {
                    const data = doc.data();
                    allStudents.push({
                        uid: doc.id,
                        username: data.username || doc.id,
                        fullName: data.fullName || data.username || 'Unnamed Student',
                        className: data.className || 'Unassigned'
                    });
                });

                allStudents.sort((a, b) => a.fullName.localeCompare(b.fullName));

                if (activeStudent) {
                    activeStudent = allStudents.find(s => s.uid === activeStudent.uid) || null;
                }

                renderSidebar();

            } catch (err) {
                console.error('Error fetching students:', err);
            }
        }

        // 3. Handle Changing the Selected Class
        function handleClassChange() {
            portfolioRequestId++;
            activeStudent = null;
            document.getElementById('student-search').value = '';

            const viewDiv = document.getElementById('work-view');
            viewDiv.innerHTML = `
                <h2 style="color:#666; text-align:center; margin-top:80px;">
                    Select a student from the roster to view their lesson list.
                </h2>
            `;

            renderSidebar();
        }

        // 4. Render Students Only When a Specific Class Is Selected
        function renderSidebar() {
            const listDiv = document.getElementById('student-list');
            const classFilter = document.getElementById('class-filter').value;
            const searchQuery = document.getElementById('student-search').value.toLowerCase().trim();

            listDiv.innerHTML = '';

            if (!classFilter && !searchQuery) {
                listDiv.innerHTML = `
                    <p class="sidebar-message">
                        Please select a class from the dropdown above.
                    </p>
                `;
                return;
            }

            const filtered = allStudents.filter(student => {
                const studentClasses = String(student.className || "").toLowerCase();
                const selectedFilter = classFilter ? classFilter.toLowerCase() : "";
                
                const matchesClass = !classFilter || studentClasses.includes(selectedFilter);
                
                const matchesSearch = !searchQuery || 
                                      student.fullName.toLowerCase().includes(searchQuery) || 
                                      student.username.toLowerCase().includes(searchQuery);

                return matchesClass && matchesSearch;
            });

            if (filtered.length === 0) {
                listDiv.innerHTML = `
                    <p class="sidebar-message">
                        No students found matching your filters.
                    </p>
                `;
                return;
            }

            filtered.forEach(student => {
                const btn = document.createElement('button');
                btn.className = 'student-btn' + (activeStudent && activeStudent.uid === student.uid ? ' active' : '');

                btn.innerHTML = `
                    <span>
                        ${escapeHtml(student.fullName)}
                        <br>
                        <small style="font-weight:normal; opacity:0.8;">
                            @${escapeHtml(student.username)}
                        </small>
                    </span>
                    <span class="class-pill">
                        ${escapeHtml(student.className)}
                    </span>
                `;

                btn.onclick = () => {
                    activeStudent = student;
                    renderSidebar();
                    loadStudentPortfolio(student);
                };

                listDiv.appendChild(btn);
            });
        }

        // 5. Load a Student's Lesson Portfolio as a List of Names
        async function loadStudentPortfolio(student) {
            const viewDiv = document.getElementById('work-view');
            const requestId = ++portfolioRequestId;

            viewDiv.innerHTML = `
                <h3 style="color:#1e3a8a;">
                    Loading lesson list for ${escapeHtml(student.fullName)}...
                </h3>
            `;

            try {
                const lessonsSnap = await db
                    .collection('users')
                    .doc(student.uid)
                    .collection('lessons')
                    .get();

                if (requestId !== portfolioRequestId || !activeStudent || activeStudent.uid !== student.uid) {
                    return;
                }

                let lessons = [];
                lessonsSnap.forEach(doc => {
                    lessons.push({ id: doc.id, ...doc.data() });
                });

                lessons.sort((a, b) => (b.lastUpdated || 0) - (a.lastUpdated || 0));

                let html = `
                    <div class="student-header">
                        <div>
                            <h2 style="margin:0; color:#1e3a8a;">
                                ${escapeHtml(student.fullName)}
                            </h2>
                            <p style="margin:5px 0 0 0; color:#64748b; font-weight:bold;">
                                Completed Lessons:
                                <strong style="color:#1e3a8a;">${lessons.length}</strong>
                            </p>
                        </div>
                        <button class="btn-gold" onclick="refreshActivePortfolio()">Refresh Work</button>
                    </div>
                `;

                if (lessons.length === 0) {
                    html += `
                        <div style="text-align:center; padding:50px 20px; background:#f8f9fa; border-radius:8px; border:2px dashed #cbd5e1;">
                            <h3 style="color:#64748b; margin-bottom:8px;">No Cloud Work Saved Yet</h3>
                        </div>
                    `;
                    viewDiv.innerHTML = html;
                    return;
                }

                html += `<div id="lessons-accordion-container">`;

                lessons.forEach((lesson, index) => {
                    html += renderLessonCard(lesson, index);
                });

                html += '</div>';
                viewDiv.innerHTML = html;

            } catch (err) {
                console.error('Error loading portfolio:', err);
            }
        }

        function refreshActivePortfolio() {
            if (activeStudent) {
                loadStudentPortfolio(activeStudent);
            }
        }

        // 6. Render the List Bar for Each Lesson (With Full Image & Pixel Art Rendering)
        function renderLessonCard(lesson, index) {
            const title = lesson.pageTitle || lesson.id.replace(/-/g, ' ');

            const updatedDate = lesson.lastUpdated
                ? new Date(lesson.lastUpdated).toLocaleDateString('en-GB', {
                    day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'
                }) : 'Saved';

            let badgesHtml = '';
            if (lesson.scoreText) badgesHtml += `<span class="status-badge badge-verified">${escapeHtml(lesson.scoreText)}</span>`;

            let bodyHtml = '';
            const designs = lesson.userBinaryDesigns || {};
            let renderedDesignKeys = new Set();
            let renderedScreenshotKeys = new Set();

            // Format A: Structured items array
            if (Array.isArray(lesson.items) && lesson.items.length > 0) {
                lesson.items.forEach((item, idx) => {
                    const labelText = item.label || 'Question ' + (idx + 1);
                    const val = (item.value || '').trim();
                    const isEmpty = val === '';
                    let boxClass = 'answer-box' + (isEmpty ? ' empty' : '');
                    let statusPill = '';

                    if (item.status === 'correct') {
                        boxClass += ' correct';
                        statusPill = '<span class="status-badge badge-correct">✓ Correct</span>';
                    } else if (item.status === 'incorrect') {
                        boxClass += ' incorrect';
                        statusPill = '<span class="status-badge badge-incorrect">✗ Incorrect</span>';
                    }

                    // Check if this row corresponds to a Pixel Art design (Tasks 1-4)
                    let extraVisualHtml = '';
                    const lowerLabel = labelText.toLowerCase();
                    let matchedDesignKey = null;
                    if (lowerLabel.includes('red task')) matchedDesignKey = '1';
                    else if (lowerLabel.includes('amber task')) matchedDesignKey = '2';
                    else if (lowerLabel.includes('green task')) matchedDesignKey = '3';
                    else if (lowerLabel.includes('blue task')) matchedDesignKey = '4';

                    if (matchedDesignKey && designs[matchedDesignKey]) {
                        extraVisualHtml += buildPixelArtHtml(designs[matchedDesignKey]);
                        renderedDesignKeys.add(matchedDesignKey);
                    }

                    // Check if this row corresponds to a Pasted Screenshot
                    let matchedImgKey = null;
                    if (lowerLabel.includes('red task')) matchedImgKey = 'img_maroon';
                    else if (lowerLabel.includes('amber task')) matchedImgKey = 'img_amber';
                    else if (lowerLabel.includes('green task')) matchedImgKey = 'img_green';
                    else if (lowerLabel.includes('blue task')) matchedImgKey = 'img_navy';

                    if (matchedImgKey && lesson[matchedImgKey] && String(lesson[matchedImgKey]).startsWith('data:image')) {
                        extraVisualHtml += `<img class="screenshot-img" src="${lesson[matchedImgKey]}" alt="${escapeHtml(labelText)} Screenshot">`;
                        renderedScreenshotKeys.add(matchedImgKey);
                    }

                    bodyHtml += `
                        <div class="qa-row">
                            <div class="qa-label">
                                <span>${escapeHtml(labelText)}</span>
                                ${statusPill}
                            </div>
                            <div class="${boxClass}">${isEmpty ? '(Left blank)' : escapeHtml(val)}</div>
                            ${extraVisualHtml}
                        </div>
                    `;
                });
            } else {
                // Format B: Older input formats
                const inputKeys = Object.keys(lesson)
                    .filter(k => k.startsWith('input_'))
                    .sort((a, b) => parseInt(a.split('_')[1]) - parseInt(b.split('_')[1]));

                inputKeys.forEach(key => {
                    const idx = key.split('_')[1];
                    const val = (lesson[key] || '').trim();
                    const cls = lesson['class_' + idx] || '';
                    const label = lesson['label_' + idx] || lesson['id_' + idx] || `Question ${parseInt(idx) + 1}`;
                    const isEmpty = val === '';
                    let boxClass = 'answer-box' + (isEmpty ? ' empty' : '');
                    let statusPill = '';

                    if (cls.includes('input-correct') || (cls.includes('correct') && !cls.includes('incorrect'))) {
                        boxClass += ' correct';
                        statusPill = '<span class="status-badge badge-correct">✓ Correct</span>';
                    } else if (cls.includes('incorrect')) {
                        boxClass += ' incorrect';
                        statusPill = '<span class="status-badge badge-incorrect">✗ Incorrect</span>';
                    }

                    bodyHtml += `
                        <div class="qa-row">
                            <div class="qa-label">
                                <span>${escapeHtml(label)}</span>
                                ${statusPill}
                            </div>
                            <div class="${boxClass}">${isEmpty ? '(Left blank)' : escapeHtml(val)}</div>
                        </div>
                    `;
                });
            }

            // Render any remaining Pixel Art designs not already attached to a row above
            const designTaskLabels = {
                '1': 'Red Task - Pixel Design',
                '2': 'Amber Task - Pixel Design',
                '3': 'Green Task - Pixel Design',
                '4': 'Blue Task - Pixel Design'
            };
            ['1', '2', '3', '4'].forEach(k => {
                if (!renderedDesignKeys.has(k) && designs[k]) {
                    const gridHtml = buildPixelArtHtml(designs[k]);
                    if (gridHtml) {
                        bodyHtml += `
                            <div class="qa-row">
                                <div class="qa-label"><span>🎨 ${designTaskLabels[k]}</span></div>
                                ${gridHtml}
                            </div>
                        `;
                    }
                }
            });

            // Render any remaining Screenshots not already attached to a row above
            const screenshotLabels = {
                'img_maroon': '📸 Red Task Screenshot',
                'img_amber': '📸 Amber Task Screenshot',
                'img_green': '📸 Green Task Screenshot',
                'img_navy': '📸 Blue Task Screenshot'
            };
            Object.keys(screenshotLabels).forEach(imgKey => {
                if (!renderedScreenshotKeys.has(imgKey) && lesson[imgKey] && String(lesson[imgKey]).startsWith('data:image')) {
                    bodyHtml += `
                        <div class="qa-row">
                            <div class="qa-label"><span>${screenshotLabels[imgKey]}</span></div>
                            <img class="screenshot-img" src="${lesson[imgKey]}" alt="Student Screenshot">
                        </div>
                    `;
                }
            });

            if (Array.isArray(lesson.screenshots)) {
                lesson.screenshots.forEach((src, i) => {
                    if (src && String(src).startsWith('data:image')) {
                        bodyHtml += `
                            <div class="qa-row">
                                <div class="qa-label"><span>📸 Pasted Screenshot ${i + 1}</span></div>
                                <img class="screenshot-img" src="${src}" alt="Pasted Screenshot ${i + 1}">
                            </div>
                        `;
                    }
                });
            }

            if (!bodyHtml) {
                bodyHtml = `<p style="color:#94a3b8; font-style:italic; margin:0;">Student opened this lesson, but no inputs were recorded.</p>`;
            }

            return `
                <div class="lesson-card" id="lesson-card-${index}">
                    <div class="lesson-card-header" onclick="toggleLessonCard(${index})">
                        <div class="lesson-title-wrap">
                            <span class="chevron">&#9654;</span>
                            <span>${escapeHtml(title)}</span>
                        </div>
                        <div style="display:flex; align-items:center; flex-wrap:wrap;">
                            ${badgesHtml}
                            <span class="lesson-meta">${updatedDate}</span>
                        </div>
                    </div>
                    <div class="lesson-card-body">
                        ${bodyHtml}
                    </div>
                </div>
            `;
        }

        // 7. Click to Open Work (Closes all others)
        function toggleLessonCard(index) {
            const clickedCard = document.getElementById(`lesson-card-${index}`);
            if (!clickedCard) return;

            const isAlreadyOpen = clickedCard.classList.contains('open');

            // Close all
            document.querySelectorAll('.lesson-card').forEach(card => {
                card.classList.remove('open');
            });

            // Open just the clicked one
            if (!isAlreadyOpen) {
                clickedCard.classList.add('open');
            }
        }

        // Safely Escape Text
        function escapeHtml(str) {
            return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        window.onload = fetchStudents;
    </script>
</body>
</html>
