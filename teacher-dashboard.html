<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard - Cloud Markbook</title>
    <link rel="stylesheet" href="style.css">

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f4f6f8;
            margin: 0;
        }

        .dashboard-layout {
            display: grid;
            grid-template-columns: 310px 1fr;
            gap: 20px;
            max-width: 1500px;
            margin: 20px auto;
            padding: 0 20px;
        }

        /* Sidebar */
        .sidebar {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            border-top: 6px solid #1e3a8a;
            height: 85vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .sidebar h3 { color: #1e3a8a; margin-top: 0; margin-bottom: 10px; }

        select, .search-box {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-weight: bold;
            box-sizing: border-box;
        }
        .search-box { font-weight: normal; }

        #student-list {
            flex-grow: 1;
            overflow-y: auto;
            margin-top: 6px;
            padding-right: 4px;
        }

        .student-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 12px;
            margin-bottom: 8px;
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 6px;
            text-align: left;
            font-weight: bold;
            font-size: 0.95em;
            cursor: pointer;
            transition: 0.2s;
            color: #333;
        }
        .student-btn:hover, .student-btn.active {
            background: #1e3a8a;
            color: white;
            border-color: #1e3a8a;
        }
        .class-pill {
            background: #dfaa2b;
            color: #1e3a8a;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: bold;
            flex-shrink: 0;
        }
        .sidebar-message {
            color: #64748b;
            font-size: 0.9em;
            text-align: center;
            line-height: 1.5;
            margin: 20px 5px;
        }

        /* Main View */
        .main-view {
            background: white;
            padding: 26px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
            border-top: 6px solid #dfaa2b;
            height: 85vh;
            overflow-y: auto;
            box-sizing: border-box;
        }

        /* Mode Switcher Bar */
        .view-mode-bar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            background: #f1f5f9;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #cbd5e1;
        }
        .mode-tabs { display: flex; gap: 8px; }
        .mode-tab {
            background: white;
            color: #1e3a8a;
            border: 2px solid #cbd5e1;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 13.5px;
            cursor: pointer;
            transition: 0.15s;
        }
        .mode-tab.active {
            background: #1e3a8a;
            color: white;
            border-color: #1e3a8a;
        }

        /* --- CLASS-WIDE MATRIX GRID --- */
        .grid-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            margin-bottom: 16px;
        }
        .grid-controls select {
            width: auto;
            min-width: 280px;
            margin-bottom: 0;
        }
        .matrix-wrapper {
            width: 100%;
            overflow-x: auto;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
        }
        .matrix-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            background: white;
        }
        .matrix-table th {
            background: #1e3a8a;
            color: white;
            padding: 10px 8px;
            text-align: center;
            border: 1px solid #334155;
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 2;
        }
        .matrix-table th.sticky-col,
        .matrix-table td.sticky-col {
            position: sticky;
            left: 0;
            z-index: 3;
            text-align: left;
            min-width: 185px;
            border-right: 2px solid #94a3b8;
        }
        .matrix-table td.sticky-col {
            background: #f8fafc;
            font-weight: bold;
            color: #1e3a8a;
        }
        .grid-student-link {
            cursor: pointer;
            display: inline-block;
            margin-bottom: 4px;
        }
        .grid-student-link:hover {
            text-decoration: underline;
        }
        .matrix-table td {
            padding: 8px 6px;
            border: 1px solid #e2e8f0;
            text-align: center;
            vertical-align: middle;
            min-width: 62px;
        }
        .cell-correct   { background: #e8f5e9; color: #006100; font-weight: bold; }
        .cell-incorrect { background: #ffebee; color: #b71c1c; font-weight: bold; }
        .cell-neutral   { background: #f8fafc; color: #334155; }
        .cell-empty     { background: #ffffff; color: #cbd5e1; }

        .cell-stamp-pill {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 7px;
            border-radius: 4px;
            font-size: 11.5px;
            font-weight: bold;
            margin: 2px;
            border: 1.5px solid;
            white-space: nowrap;
        }
        .st-assisted { background: #e3f2fd; color: #0d47a1; border-color: #1976d2; }
        .st-spag     { background: #fff3e0; color: #e65100; border-color: #f57c00; }
        .st-proud    { background: #fff8e1; color: #7f6000; border-color: #dfaa2b; }
        .st-comment  { background: #f3e5f5; color: #4a148c; border-color: #8e24aa; }

        .stamp-del-btn {
            background: rgba(0,0,0,0.1);
            border: none;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            font-size: 11px;
            line-height: 16px;
            text-align: center;
            cursor: pointer;
            padding: 0;
            color: inherit;
        }
        .stamp-del-btn:hover { background: #d32f2f; color: white; }

        .btn-mini-stamp {
            background: #eef2ff;
            color: #1e3a8a;
            border: 1px dashed #1e3a8a;
            padding: 2px 7px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 3px;
        }
        .btn-mini-stamp:hover { background: #1e3a8a; color: white; }

        .btn-mini-login {
            background: #008f39;
            color: white;
            border: none;
            padding: 3px 7px;
            border-radius: 4px;
            font-size: 10.5px;
            font-weight: bold;
            cursor: pointer;
            display: inline-block;
        }
        .btn-mini-login:hover { background: #006b2b; }

        /* Individual Student Portfolio Styles */
        .student-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 15px;
            border-bottom: 3px solid #1e3a8a;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }
        .lesson-card { border: 2px solid #cbd5e1; border-radius: 8px; margin-bottom: 10px; overflow: hidden; background: #fff; }
        .lesson-card.open { border-color: #1e3a8a; box-shadow: 0 4px 12px rgba(30, 58, 138, 0.12); margin-bottom: 18px; }
        .lesson-card-header { background: #f8fafc; color: #1e3a8a; padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; gap: 12px; cursor: pointer; user-select: none; }
        .lesson-card.open .lesson-card-header { background: #1e3a8a; color: white; }
        .lesson-title-wrap { display: flex; align-items: center; gap: 12px; font-weight: bold; font-size: 1.05em; }
        .chevron { display: inline-block; transition: transform 0.2s ease; font-size: 0.85em; color: #dfaa2b; }
        .lesson-card.open .chevron { transform: rotate(90deg); }
        .lesson-meta { font-size: 0.85em; color: #64748b; font-weight: bold; margin-left: 8px; white-space: nowrap; }
        .lesson-card.open .lesson-meta { color: #dfaa2b; }
        .lesson-card-body { display: none; padding: 20px; border-top: 2px solid #e2e8f0; background: #ffffff; }
        .lesson-card.open .lesson-card-body { display: block; }

        .qa-row { border-bottom: 1px solid #eee; padding: 12px 0; }
        .qa-row:last-child { border-bottom: none; }
        .qa-label { font-weight: bold; color: #1e3a8a; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; font-size: 0.95em; }
        .answer-box { background: #f8f9fa; border: 2px solid #cbd5e1; padding: 10px 12px; border-radius: 6px; color: #1e293b; white-space: pre-wrap; overflow-wrap: anywhere; }
        .answer-box.empty { color: #94a3b8; font-style: italic; background: #f1f5f9; border-style: dashed; }
        .answer-box.correct { border-color: #2e7d32; background: #e8f5e9; }
        .answer-box.incorrect { border-color: #d32f2f; background: #ffebee; }

        .status-badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 0.78em; font-weight: bold; text-transform: uppercase; }
        .badge-correct { background: #2e7d32; color: white; }
        .badge-incorrect { background: #d32f2f; color: white; }
        .badge-verified { background: #dfaa2b; color: #1e3a8a; margin-right: 6px; }
        .btn-gold { background: #dfaa2b; color: #1e3a8a; border: none; padding: 8px 14px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-gold:hover { background: #c99722; }
        .btn-login-student { background: #008f39; color: white; border: none; padding: 8px 14px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-login-student:hover { background: #006b2b; }
        .btn-delete-lesson { background-color: #d32f2f; color: white; border: none; padding: 5px 10px; border-radius: 4px; font-size: 0.8em; font-weight: bold; cursor: pointer; margin-left: 6px; }
        .screenshot-img { max-width: 100%; max-height: 380px; border: 2px solid #1e3a8a; border-radius: 6px; margin-top: 8px; display: block; }
    </style>
</head>

<body>
    <header>
        <div class="header-left"><a href="index.html"><img src="logo.jpg" alt="Logo"></a></div>
        <div class="header-center"><h1>Teacher Cloud Markbook</h1></div>
        <div class="header-right" style="display: flex; gap: 10px; align-items: center;">
            <a href="bulk-importer.html" class="back-btn" style="background-color: #607d8b; color: white;">📥 Bulk Importer</a>
            <a href="leaderboard.html" class="btn-gold" style="background-color: #1e3a8a; color: white; text-decoration: none; font-size: 0.9em;">🏆 Leaderboards</a>
            <button class="btn-gold" onclick="fetchStudents()">Refresh Roster</button>
        </div>
    </header>

    <div class="dashboard-layout">
        <div class="sidebar">
            <h3>Class Filter</h3>
            <select id="class-filter" onchange="handleClassChange()">
                <option value="" disabled selected>Select a class...</option>
                <optgroup label="Year 7">
                    <option value="7x1">7x1</option><option value="7x2">7x2</option><option value="7y1">7y1</option><option value="7y2">7y2</option>
                </optgroup>
                <optgroup label="Year 8">
                    <option value="8x1">8x1</option><option value="8x2">8x2</option><option value="8y1">8y1</option><option value="8y2">8y2</option>
                </optgroup>
                <optgroup label="Year 9">
                    <option value="9x1">9x1</option><option value="9x2">9x2</option><option value="9y1">9y1</option><option value="9y2">9y2</option>
                </optgroup>
                <optgroup label="GCSE Options">
                    <option value="10aEnt1">10aEnt1 (Enterprise)</option><option value="11aEnt1">11aEnt1 (Enterprise)</option>
                    <option value="10bCim1">10bCim1 (iMedia)</option><option value="11bCim1">11bCim1 (iMedia)</option>
                </optgroup>
                <option value="Unassigned">Unassigned</option>
            </select>

            <input type="text" id="student-search" class="search-box" placeholder="Search student name or username..." oninput="renderSidebar()">

            <div id="student-list">
                <p class="sidebar-message">Select a class from the dropdown above to view students.</p>
            </div>
        </div>

        <div class="main-view" id="main-container">
            <div class="view-mode-bar">
                <div class="mode-tabs">
                    <button class="mode-tab active" id="tab-grid" onclick="switchViewMode('grid')">📊 Class Marking Grid</button>
                    <button class="mode-tab" id="tab-student" onclick="switchViewMode('student')">👤 Individual Student Portfolio</button>
                </div>
                <div style="font-size: 13px; color: #475569; font-weight: bold;">
                    Tip: Click any student name to view their portfolio or use 🔑 Login as Student to open their account.
                </div>
            </div>

            <div id="work-view">
                <h2 style="color:#666; text-align:center; margin-top:70px;">Select a class on the left to load the Class Marking Grid.</h2>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDiRDdgM7VCOxEVob_pZ73AvZaNb7SvA9Y",
            authDomain: "serlby-park-computing.firebaseapp.com",
            projectId: "serlby-park-computing",
            storageBucket: "serlby-park-computing.firebasestorage.app",
            messagingSenderId: "648533806051",
            appId: "1:648533806051:web:1e42a4263dfb1fd8e72ed6",
            measurementId: "G-HDNYEE11WV"
        };

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let allStudents = [];
        let activeStudent = null;
        let currentViewMode = 'grid';
        let classLessonsData = {};
        let selectedGridLessonId = '';
        let portfolioRequestId = 0;

        /* --- REAL FIREBASE LOGIN AS STUDENT --- */
        async function loginAsStudent(username, displayName) {
            if (!username) {
                alert("No username found for this student.");
                return;
            }

            const cleanUser = username.trim().toLowerCase();
            const defaultPassword = "123456";
            const candidates = cleanUser.includes('@')
                ? [cleanUser]
                : [`${cleanUser}@deltaschool.local`, `${cleanUser}@serlby.student`];

            try {
                sessionStorage.removeItem('teacherMode');
                sessionStorage.removeItem('inspectStudentUid');
                sessionStorage.removeItem('inspectStudentName');

                await auth.signOut();

                let signedIn = false;
                let lastError = null;

                for (const email of candidates) {
                    try {
                        await auth.signInWithEmailAndPassword(email, defaultPassword);
                        signedIn = true;
                        break;
                    } catch (e) {
                        lastError = e;
                    }
                }

                if (!signedIn) {
                    throw lastError || new Error("Unable to sign in.");
                }

                window.location.href = "index.html";
            } catch (err) {
                console.error("Student login failed:", err);
                alert(`Could not log in as ${displayName || cleanUser}.\n\nTried: ${candidates.join(' and ')}\nError: ${err.message}`);
            }
        }

        async function fetchStudents() {
            try {
                const snapshot = await db.collection('users').get();
                allStudents = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    allStudents.push({
                        uid: doc.id,
                        username: data.username || doc.id,
                        fullName: data.fullName || data.username || 'Unnamed Student',
                        className: data.className || 'Unassigned'
                    });
                });
                allStudents.sort((a, b) => a.fullName.localeCompare(b.fullName));
                if (activeStudent) activeStudent = allStudents.find(s => s.uid === activeStudent.uid) || null;
                renderSidebar();
                if (document.getElementById('class-filter').value && currentViewMode === 'grid') {
                    loadClassGridData();
                }
            } catch (err) {
                console.error('Error fetching students:', err);
            }
        }

        function switchViewMode(mode) {
            currentViewMode = mode;
            document.getElementById('tab-grid').classList.toggle('active', mode === 'grid');
            document.getElementById('tab-student').classList.toggle('active', mode === 'student');

            if (mode === 'grid') {
                loadClassGridData();
            } else {
                if (activeStudent) {
                    loadStudentPortfolio(activeStudent);
                } else {
                    document.getElementById('work-view').innerHTML = `<h2 style="color:#666; text-align:center; margin-top:70px;">Select a student on the left to view their portfolio.</h2>`;
                }
            }
        }

        function handleClassChange() {
            portfolioRequestId++;
            activeStudent = null;
            selectedGridLessonId = '';
            document.getElementById('student-search').value = '';
            renderSidebar();

            if (currentViewMode === 'grid') {
                loadClassGridData();
            } else {
                document.getElementById('work-view').innerHTML = `<h2 style="color:#666; text-align:center; margin-top:70px;">Select a student from the roster to view their portfolio.</h2>`;
            }
        }

        function getFilteredClassStudents() {
            const classFilter = document.getElementById('class-filter').value;
            const searchQuery = document.getElementById('student-search').value.toLowerCase().trim();
            if (!classFilter && !searchQuery) return [];

            return allStudents.filter(student => {
                const studentClasses = String(student.className || "").toLowerCase();
                const matchesClass = !classFilter || studentClasses.includes(classFilter.toLowerCase());
                const matchesSearch = !searchQuery || student.fullName.toLowerCase().includes(searchQuery) || student.username.toLowerCase().includes(searchQuery);
                return matchesClass && matchesSearch;
            });
        }

        function renderSidebar() {
            const listDiv = document.getElementById('student-list');
            const classFilter = document.getElementById('class-filter').value;
            const searchQuery = document.getElementById('student-search').value.toLowerCase().trim();
            listDiv.innerHTML = '';

            if (!classFilter && !searchQuery) {
                listDiv.innerHTML = `<p class="sidebar-message">Please select a class from the dropdown above.</p>`;
                return;
            }

            const filtered = getFilteredClassStudents();
            if (filtered.length === 0) {
                listDiv.innerHTML = `<p class="sidebar-message">No students found matching your filters.</p>`;
                return;
            }

            filtered.forEach(student => {
                const btn = document.createElement('button');
                btn.className = 'student-btn' + (activeStudent && activeStudent.uid === student.uid ? ' active' : '');
                btn.innerHTML = `
                    <span>${escapeHtml(student.fullName)}<br><small style="font-weight:normal; opacity:0.8;">@${escapeHtml(student.username)}</small></span>
                    <span class="class-pill">${escapeHtml(student.className)}</span>
                `;
                btn.onclick = () => {
                    activeStudent = student;
                    renderSidebar();
                    switchViewMode('student');
                };
                listDiv.appendChild(btn);
            });
        }

        /* --- CLASS-WIDE MARKING GRID --- */
        async function loadClassGridData() {
            const classFilter = document.getElementById('class-filter').value;
            const viewDiv = document.getElementById('work-view');
            if (!classFilter) {
                viewDiv.innerHTML = `<h2 style="color:#666; text-align:center; margin-top:70px;">Select a class on the left to load the Class Marking Grid.</h2>`;
                return;
            }

            const students = getFilteredClassStudents();
            viewDiv.innerHTML = `<h3 style="color:#1e3a8a;">Loading Class Marking Grid for ${escapeHtml(classFilter)} (${students.length} students)...</h3>`;

            classLessonsData = {};
            const discoveredLessons = {};

            await Promise.all(students.map(async (stu) => {
                classLessonsData[stu.uid] = {};
                try {
                    const snap = await db.collection('users').doc(stu.uid).collection('lessons').get();
                    snap.forEach(doc => {
                        const d = doc.data();
                        classLessonsData[stu.uid][doc.id] = d;
                        if (!discoveredLessons[doc.id]) {
                            discoveredLessons[doc.id] = d.pageTitle || doc.id.replace(/-/g, ' ');
                        }
                    });
                } catch (e) {
                    console.error("Grid load error for", stu.uid, e);
                }
            }));

            const lessonIds = Object.keys(discoveredLessons);
            if (lessonIds.length === 0) {
                viewDiv.innerHTML = `<div style="text-align:center; padding:50px; background:#f8fafc; border-radius:8px; border:2px dashed #cbd5e1;"><h3 style="color:#64748b;">No cloud work found for ${escapeHtml(classFilter)} yet.</h3></div>`;
                return;
            }

            if (!selectedGridLessonId || !discoveredLessons[selectedGridLessonId]) {
                selectedGridLessonId = lessonIds[0];
            }

            renderClassMatrix(classFilter, students, discoveredLessons);
        }

        function renderClassMatrix(classFilter, students, discoveredLessons) {
            const viewDiv = document.getElementById('work-view');
            const lessonIds = Object.keys(discoveredLessons);

            let optionsHtml = lessonIds.map(id =>
                `<option value="${escapeHtml(id)}" ${id === selectedGridLessonId ? 'selected' : ''}>${escapeHtml(discoveredLessons[id])}</option>`
            ).join('');

            let templateItems = [];
            students.forEach(stu => {
                const l = classLessonsData[stu.uid]?.[selectedGridLessonId];
                if (l && Array.isArray(l.items) && l.items.length > templateItems.length) {
                    templateItems = l.items;
                }
            });

            let headerCellsHtml = `
                <th class="sticky-col">Student (${escapeHtml(classFilter)})</th>
                <th>Score</th>
                <th>Teacher Stamps</th>
            `;
            templateItems.forEach((item, idx) => {
                const shortLabel = (item.label || `Q${idx + 1}`).slice(0, 26);
                headerCellsHtml += `<th title="${escapeHtml(item.label || '')}">Q${idx + 1}<br><small style="font-weight:normal; opacity:0.85;">${escapeHtml(shortLabel)}</small></th>`;
            });

            let rowsHtml = '';
            students.forEach(stu => {
                const lesson = classLessonsData[stu.uid]?.[selectedGridLessonId];
                const stickyStudentCell = `
                    <td class="sticky-col">
                        <span class="grid-student-link" onclick="openStudentFromGrid('${stu.uid}')">${escapeHtml(stu.fullName)}</span><br>
                        <button class="btn-mini-login" onclick="loginAsStudent('${escapeHtml(stu.username)}', '${escapeHtml(stu.fullName)}')">🔑 Login</button>
                    </td>
                `;

                if (!lesson) {
                    rowsHtml += `
                        <tr>
                            ${stickyStudentCell}
                            <td class="cell-empty" colspan="${templateItems.length + 2}" style="text-align:left; padding-left:12px; font-style:italic;">Not started</td>
                        </tr>
                    `;
                    return;
                }

                const stamps = Array.isArray(lesson.teacherStamps) ? lesson.teacherStamps : [];
                let stampsCellHtml = stamps.map(s => {
                    const cls = s.type === 'comment' ? 'st-comment' : `st-${s.type || 'assisted'}`;
                    const where = s.targetLabel ? ` (${s.targetLabel.slice(0, 22)})` : '';
                    return `
                        <span class="cell-stamp-pill ${cls}" title="${escapeHtml(s.text + where)}">
                            ${escapeHtml(s.text)}${escapeHtml(where)}
                            <button class="stamp-del-btn" title="Remove stamp" onclick="removeGridStamp('${stu.uid}', '${selectedGridLessonId}', '${s.id}')">×</button>
                        </span>
                    `;
                }).join('<br>');

                stampsCellHtml += `<div><button class="btn-mini-stamp" onclick="addGridStamp('${stu.uid}', '${selectedGridLessonId}', '')">+ Stamp</button></div>`;

                let qCellsHtml = '';
                const items = Array.isArray(lesson.items) ? lesson.items : [];
                templateItems.forEach((tmpl, idx) => {
                    const item = items[idx];
                    if (!item || !(item.value || '').trim()) {
                        qCellsHtml += `<td class="cell-empty">—</td>`;
                        return;
                    }

                    let cellClass = 'cell-neutral';
                    let icon = '';
                    if (item.status === 'correct') { cellClass = 'cell-correct'; icon = '✓ '; }
                    else if (item.status === 'incorrect') { cellClass = 'cell-incorrect'; icon = '✗ '; }

                    const pinned = stamps.filter(s => s.targetLabel && s.targetLabel === item.label);
                    let pinBadge = pinned.length > 0
                        ? `<div style="margin-top:3px;">${pinned.map(p => `<span class="cell-stamp-pill st-${p.type === 'comment' ? 'comment' : p.type}">${escapeHtml(p.text.split(' ')[0])}</span>`).join('')}</div>`
                        : '';

                    const valPreview = item.value.trim().slice(0, 22) + (item.value.trim().length > 22 ? '…' : '');
                    qCellsHtml += `<td class="${cellClass}" title="${escapeHtml(item.value)}">${icon}${escapeHtml(valPreview)}${pinBadge}</td>`;
                });

                rowsHtml += `
                    <tr>
                        ${stickyStudentCell}
                        <td style="font-weight:bold; color:#1e3a8a; white-space:nowrap;">${escapeHtml(lesson.scoreText || 'Done')}</td>
                        <td style="text-align:left; min-width:170px;">${stampsCellHtml}</td>
                        ${qCellsHtml}
                    </tr>
                `;
            });

            viewDiv.innerHTML = `
                <div class="grid-controls">
                    <label style="font-weight:bold; color:#1e3a8a;">Lesson:</label>
                    <select onchange="selectedGridLessonId = this.value; loadClassGridData();">
                        ${optionsHtml}
                    </select>
                    <button class="btn-gold" onclick="loadClassGridData()">🔄 Refresh Grid</button>
                </div>
                <div class="matrix-wrapper">
                    <table class="matrix-table">
                        <thead><tr>${headerCellsHtml}</tr></thead>
                        <tbody>${rowsHtml}</tbody>
                    </table>
                </div>
            `;
        }

        function openStudentFromGrid(uid) {
            const found = allStudents.find(s => s.uid === uid);
            if (!found) return;
            activeStudent = found;
            renderSidebar();
            switchViewMode('student');
        }

        /* --- ADD / REMOVE STAMPS FROM GRID OR PORTFOLIO --- */
        async function addGridStamp(studentUid, lessonId, targetLabel) {
            const choice = prompt("Choose a stamp number or type a custom comment:\n1 = 🤝 Teacher Assisted\n2 = ✍️ SPaG Issues\n3 = 🏆 Proud Thursday Given\nOr type any custom comment:");
            if (!choice || !choice.trim()) return;

            let type = 'comment';
            let text = "💬 " + choice.trim();
            if (choice.trim() === '1') { type = 'assisted'; text = "🤝 Teacher Assisted"; }
            else if (choice.trim() === '2') { type = 'spag'; text = "✍️ SPaG Issues"; }
            else if (choice.trim() === '3') { type = 'proud'; text = "🏆 Proud Thursday Given"; }

            const docRef = db.collection('users').doc(studentUid).collection('lessons').doc(lessonId);
            const docSnap = await docRef.get();
            const existing = docSnap.exists && Array.isArray(docSnap.data().teacherStamps) ? docSnap.data().teacherStamps : [];

            existing.push({
                id: Date.now().toString(),
                cardId: 'card-prep',
                type,
                text,
                targetLabel,
                x: "50",
                y: "50"
            });

            await docRef.set({ teacherStamps: existing, lastUpdated: Date.now() }, { merge: true });
            if (currentViewMode === 'grid') loadClassGridData();
            else if (activeStudent) loadStudentPortfolio(activeStudent);
        }

        async function removeGridStamp(studentUid, lessonId, stampId) {
            const docRef = db.collection('users').doc(studentUid).collection('lessons').doc(lessonId);
            const docSnap = await docRef.get();
            if (!docSnap.exists) return;

            const updated = (docSnap.data().teacherStamps || []).filter(s => s.id !== stampId);
            await docRef.set({ teacherStamps: updated }, { merge: true });
            if (currentViewMode === 'grid') loadClassGridData();
            else if (activeStudent) loadStudentPortfolio(activeStudent);
        }

        /* --- INDIVIDUAL STUDENT PORTFOLIO VIEW --- */
        async function loadStudentPortfolio(student) {
            const viewDiv = document.getElementById('work-view');
            const requestId = ++portfolioRequestId;
            viewDiv.innerHTML = `<h3 style="color:#1e3a8a;">Loading portfolio for ${escapeHtml(student.fullName)}...</h3>`;

            try {
                const lessonsSnap = await db.collection('users').doc(student.uid).collection('lessons').get();
                if (requestId !== portfolioRequestId || !activeStudent || activeStudent.uid !== student.uid) return;

                let lessons = [];
                lessonsSnap.forEach(doc => lessons.push({ id: doc.id, ...doc.data() }));
                lessons.sort((a, b) => (b.lastUpdated || 0) - (a.lastUpdated || 0));

                let html = `
                    <div class="student-header">
                        <div>
                            <h2 style="margin:0; color:#1e3a8a;">${escapeHtml(student.fullName)}</h2>
                            <p style="margin:5px 0 0 0; color:#64748b; font-weight:bold;">
                                Username: @${escapeHtml(student.username)} • Completed Lessons: <strong style="color:#1e3a8a;">${lessons.length}</strong>
                            </p>
                        </div>
                        <div style="display:flex; gap:8px; flex-wrap:wrap;">
                            <button class="btn-login-student" onclick="loginAsStudent('${escapeHtml(student.username)}', '${escapeHtml(student.fullName)}')">
                                🔑 Login as ${escapeHtml(student.fullName)}
                            </button>
                            <button class="btn-gold" style="background:#1e3a8a; color:white;" onclick="switchViewMode('grid')">&larr; Back to Class Grid</button>
                            <button class="btn-gold" onclick="loadStudentPortfolio(activeStudent)">Refresh Work</button>
                        </div>
                    </div>
                `;

                if (lessons.length === 0) {
                    html += `<div style="text-align:center; padding:50px 20px; background:#f8f9fa; border-radius:8px; border:2px dashed #cbd5e1;"><h3 style="color:#64748b;">No Cloud Work Saved Yet</h3></div>`;
                    viewDiv.innerHTML = html;
                    return;
                }

                html += `<div id="lessons-accordion-container">`;
                lessons.forEach((lesson, index) => {
                    html += renderLessonCard(student.uid, lesson, index);
                });
                html += `</div>`;
                viewDiv.innerHTML = html;
            } catch (err) {
                console.error('Error loading portfolio:', err);
            }
        }

        function renderLessonCard(studentUid, lesson, index) {
            const title = lesson.pageTitle || lesson.id.replace(/-/g, ' ');
            const updatedDate = lesson.lastUpdated
                ? new Date(lesson.lastUpdated).toLocaleDateString('en-GB', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' })
                : 'Saved';

            const stamps = Array.isArray(lesson.teacherStamps) ? lesson.teacherStamps : [];
            let badgesHtml = '';
            if (lesson.scoreText) badgesHtml += `<span class="status-badge badge-verified">${escapeHtml(lesson.scoreText)}</span>`;
            stamps.forEach(s => {
                const cls = s.type === 'comment' ? 'st-comment' : `st-${s.type || 'assisted'}`;
                badgesHtml += `<span class="cell-stamp-pill ${cls}">${escapeHtml(s.text)}</span>`;
            });
            badgesHtml += `<button class="btn-delete-lesson" onclick="event.stopPropagation(); deleteStudentLesson('${studentUid}', '${lesson.id}', '${escapeHtml(title)}')">🗑️ Delete</button>`;

            let bodyHtml = '';
            if (stamps.length > 0) {
                bodyHtml += `<div style="display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; padding:10px; background:#f8fafc; border-left:4px solid #1e3a8a; border-radius:4px;">`;
                stamps.forEach(s => {
                    const cls = s.type === 'comment' ? 'st-comment' : `st-${s.type || 'assisted'}`;
                    const where = s.targetLabel ? ` (${s.targetLabel})` : '';
                    bodyHtml += `
                        <span class="cell-stamp-pill ${cls}" style="font-size:12px; padding:4px 9px;">
                            ${escapeHtml(s.text)}${escapeHtml(where)}
                            <button class="stamp-del-btn" title="Remove stamp" onclick="removeGridStamp('${studentUid}', '${lesson.id}', '${s.id}')">×</button>
                        </span>
                    `;
                });
                bodyHtml += `</div>`;
            }

            if (Array.isArray(lesson.items) && lesson.items.length > 0) {
                lesson.items.forEach((item, idx) => {
                    const labelText = item.label || 'Question ' + (idx + 1);
                    const val = (item.value || '').trim();
                    const isEmpty = val === '';
                    let boxClass = 'answer-box' + (isEmpty ? ' empty' : '');
                    let statusPill = '';

                    if (item.status === 'correct') {
                        boxClass += ' correct';
                        statusPill = '<span class="status-badge badge-correct">✓ Correct</span>';
                    } else if (item.status === 'incorrect') {
                        boxClass += ' incorrect';
                        statusPill = '<span class="status-badge badge-incorrect">✗ Incorrect</span>';
                    }

                    bodyHtml += `
                        <div class="qa-row">
                            <div class="qa-label">
                                <span>${escapeHtml(labelText)}</span>
                                <div>
                                    ${statusPill}
                                    <button class="btn-mini-stamp" onclick="addGridStamp('${studentUid}', '${lesson.id}', '${escapeHtml(labelText)}')">+ Stamp / Note</button>
                                </div>
                            </div>
                            <div class="${boxClass}">${isEmpty ? '(Left blank)' : escapeHtml(val)}</div>
                        </div>
                    `;
                });
            }

            ['maroon', 'amber', 'green', 'navy'].forEach(zone => {
                const imgKey = 'img_' + zone;
                if (lesson[imgKey] && String(lesson[imgKey]).startsWith('data:image')) {
                    bodyHtml += `
                        <div class="qa-row">
                            <div class="qa-label"><span>📸 Task Screenshot (${zone.toUpperCase()})</span></div>
                            <img class="screenshot-img" src="${lesson[imgKey]}" alt="Student Screenshot">
                        </div>
                    `;
                }
            });

            return `
                <div class="lesson-card" id="lesson-card-${index}">
                    <div class="lesson-card-header" onclick="toggleLessonCard(${index})">
                        <div class="lesson-title-wrap"><span class="chevron">&#9654;</span><span>${escapeHtml(title)}</span></div>
                        <div style="display:flex; align-items:center; flex-wrap:wrap; gap: 6px;">${badgesHtml}<span class="lesson-meta">${updatedDate}</span></div>
                    </div>
                    <div class="lesson-card-body">${bodyHtml}</div>
                </div>
            `;
        }

        async function deleteStudentLesson(studentUid, lessonId, lessonTitle) {
            if (confirm(`Delete "${lessonTitle}" for this student?`)) {
                await db.collection('users').doc(studentUid).collection('lessons').doc(lessonId).delete();
                if (activeStudent) loadStudentPortfolio(activeStudent);
            }
        }

        function toggleLessonCard(index) {
            const clickedCard = document.getElementById(`lesson-card-${index}`);
            if (!clickedCard) return;
            const isAlreadyOpen = clickedCard.classList.contains('open');
            document.querySelectorAll('.lesson-card').forEach(card => card.classList.remove('open'));
            if (!isAlreadyOpen) clickedCard.classList.add('open');
        }

        function escapeHtml(str) {
            return String(str ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        window.onload = fetchStudents;
    </script>
</body>
</html>
