<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard - Live Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .dashboard-layout { display: grid; grid-template-columns: 300px 1fr; gap: 20px; max-width: 1400px; margin: 20px auto; padding: 0 20px; }
        .sidebar { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); border-top: 6px solid #1e3a8a; height: 85vh; overflow-y: auto; }
        .main-view { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.08); border-top: 6px solid #dfaa2b; height: 85vh; display: flex; flex-direction: column; overflow: hidden; }
        
        .student-btn { display: block; width: 100%; padding: 12px; margin-bottom: 8px; background: #f8f9fa; border: 1px solid #ddd; border-radius: 4px; text-align: left; font-weight: bold; font-size: 1em; cursor: pointer; transition: 0.2s; }
        .student-btn:hover, .student-btn.active { background: #1e3a8a; color: white; border-color: #1e3a8a; }
        .lesson-count-badge { float: right; background: #dfaa2b; color: #1e3a8a; padding: 2px 8px; border-radius: 12px; font-size: 0.85em; }
        
        select { width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #ccc; font-weight: bold; }
        
        /* The viewing window for the student pages */
        iframe { flex-grow: 1; width: 100%; border: 2px solid #eee; border-radius: 8px; background: #f8f9fa; }
    </style>
</head>
<body>
    <header>
        <div class="header-left"><a href="index.html"><img src="logo.jpg" alt="Logo"></a></div>
        <div class="header-center"><h1>Teacher Dashboard</h1></div>
        <div class="header-right"><button onclick="fetchData()" style="background:#dfaa2b; color:#1e3a8a; border:none; padding:8px 15px; border-radius:4px; font-weight:bold; cursor:pointer;">↻ Refresh</button></div>
    </header>

    <div class="dashboard-layout">
        <!-- Sidebar: Roster View -->
        <div class="sidebar">
            <h3>Class Roster</h3>
            <select id="class-filter" onchange="fetchData()">
                <option value="ALL">All Classes</option>
                <optgroup label="Year 7">
                    <option value="7x1">7x1</option><option value="7x2">7x2</option><option value="7y1">7y1</option><option value="7y2">7y2</option>
                </optgroup>
                <optgroup label="Year 8">
                    <option value="8x1">8x1</option><option value="8x2">8x2</option><option value="8y1">8y1</option><option value="8y2">8y2</option>
                </optgroup>
                <optgroup label="Year 9">
                    <option value="9x1">9x1</option><option value="9x2">9x2</option><option value="9y1">9y1</option><option value="9y2">9y2</option>
                </optgroup>
            </select>
            <div id="student-list" style="margin-top: 20px;"><p style="color: #666; font-size: 0.9em;">Loading class list...</p></div>
        </div>

        <!-- Main View: Dynamic Iframe Window -->
        <div class="main-view" id="work-view">
            <h2 style="color: #666; text-align: center; margin-top: 50px;">&larr; Select a student to log in to their profile</h2>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://zqvmrmhiqxmghtxgjrtk.supabase.co';
        const supabaseKey = 'sb_publishable_iD26_DKTKRUWP7Jj3giEPA_f2xd5OCW';
        let db = null;
        try { if (window.supabase) db = window.supabase.createClient(supabaseUrl, supabaseKey); } catch (e) { console.error("DB init failed"); }
        
        let uniqueStudents = {};

        async function fetchData() {
            const classFilter = document.getElementById('class-filter').value;
            const listDiv = document.getElementById('student-list');
            listDiv.innerHTML = "<p>Loading...</p>";
            if (!db) return;

            let query = db.from('dnc_responses').select('*').order('created_at', { ascending: false });
            if (classFilter !== "ALL") query = query.eq('class_name', classFilter);

            const { data, error } = await query;
            if (error) { listDiv.innerHTML = `<p style="color:red">Error: ${error.message}</p>`; return; }

            uniqueStudents = {};
            (data || []).forEach(record => {
                if (!uniqueStudents[record.student_name]) uniqueStudents[record.student_name] = [];
                uniqueStudents[record.student_name].push(record);
            });

            renderSidebar();
        }

        function renderSidebar() {
            const listDiv = document.getElementById('student-list');
            listDiv.innerHTML = "";
            const studentNames = Object.keys(uniqueStudents).sort();

            if (studentNames.length === 0) {
                listDiv.innerHTML = "<p style='color: #666; font-size: 0.9em;'>No students found.</p>";
                return;
            }

            studentNames.forEach(name => {
                const btn = document.createElement('button');
                btn.className = 'student-btn';
                // Grabs the exact class name from their first database record
                const className = uniqueStudents[name][0].class_name;
                
                btn.innerHTML = `${name} <span class="lesson-count-badge">${uniqueStudents[name].length} Active Files</span>`;
                
                btn.onclick = () => {
                    document.querySelectorAll('.student-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    openStudentHome(name, className);
                };
                listDiv.appendChild(btn);
            });
        }

        function openStudentHome(studentName, className) {
            const viewDiv = document.getElementById('work-view');

            // Set browser memory so the iframe thinks the student is logged in perfectly
            localStorage.setItem('studentName', studentName);
            localStorage.setItem('className', className);
            localStorage.setItem('loggedInName', studentName);
            localStorage.setItem('loggedInClass', className);

            viewDiv.innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 3px solid #1e3a8a; padding-bottom: 10px; margin-bottom: 15px; flex-shrink: 0;">
                    <div>
                        <h2 style="margin: 0; color: #1e3a8a;">${studentName}'s Workspace</h2>
                        <p style="margin: 0; color: #dfaa2b; font-weight: bold;">Class: ${className}</p>
                    </div>
                </div>
                
                <!-- This directly loads the website's index page right inside the dashboard -->
                <iframe src="index.html" onload="lockStudentInputs(this)"></iframe>
            `;
        }

        function lockStudentInputs(iframe) {
            try {
                const doc = iframe.contentWindow.document;
                
                // 1. Force the index page login gate to close, bypassing security for the teacher
                const loginGate = doc.getElementById('login-gate');
                if (loginGate) {
                    loginGate.style.display = 'none';
                    doc.body.classList.remove('locked');
                }

                // 2. Lock all text boxes so the teacher can't accidentally edit them as they browse
                doc.querySelectorAll('input[type="text"], textarea').forEach(el => el.readOnly = true);
                
            } catch(e) {
                console.log("Iframe cross-origin lockdown bypassed.");
            }
        }

        window.onload = () => { fetchData(); };
    </script>
</body>
</html>
