    <!-- HTML to PDF Library -->

    <style>
        /* Task Container Styling */
        .task-container { max-width: 900px; margin: 30px auto; padding: 20px; }
        
        .task-card { 
            background: white; 
            border-radius: 8px; 
            padding: 25px; 
            margin-bottom: 30px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); 
            page-break-inside: avoid; /* Stops the PDF from cutting cards in half! */
        }
        
        /* Section Header Colors */
        .task-prep { border-top: 6px solid #607d8b; } 
        .task-prep h2 { color: #607d8b; margin-top: 0; }
        
        .task-plenary { border-top: 6px solid #673ab7; } 
        .task-plenary h2 { color: #673ab7; margin-top: 0; }

        /* RAGB Colors */
        .task-maroon { border-top: 6px solid #800000; }
        .task-maroon h2 { color: #800000; margin-top: 0; }
        .task-maroon .instruction-box { border-left: 4px solid #800000; }

        .task-amber { border-top: 6px solid #ffb300; }
        .task-amber h2 { color: #ffb300; margin-top: 0; text-shadow: 1px 1px 1px rgba(0,0,0,0.1); }
        .task-amber .instruction-box { border-left: 4px solid #ffb300; }

        .task-green { border-top: 6px solid #008f39; }
        .task-green h2 { color: #008f39; margin-top: 0; }
        .task-green .instruction-box { border-left: 4px solid #008f39; }

        .task-navy { border-top: 6px solid #1e3a8a; }
        .task-navy h2 { color: #1e3a8a; margin-top: 0; }
        .task-navy .instruction-box { border-left: 4px solid #1e3a8a; }

        /* Common Elements */
        .instruction-box { background-color: #f8f9fa; padding: 15px; border-radius: 0 4px 4px 0; font-size: 16px; line-height: 1.5; margin-bottom: 20px; text-align: center; }
        
        /* Inputs & Textareas */
        .question-row { margin-bottom: 20px; }
        .question-label { display: block; font-size: 16px; margin-bottom: 8px; color: #333; font-weight: bold; }
        
        .auto-input { 
            width: 100%; 
            max-width: 350px; /* Keeps the number boxes from stretching too wide */
            padding: 12px; 
            font-size: 16px; 
            border: 2px solid #ccc; 
            border-radius: 4px; 
            transition: all 0.3s ease; 
            box-sizing: border-box; 
            background-color: white; 
            font-family: inherit; /* Uses standard readable font */
        }
        .auto-input:focus { outline: none; border-color: #666; }
        textarea.auto-input { resize: vertical; min-height: 80px; overflow-y: hidden; max-width: 100%; }

        /* Helper Headings for Binary */
        .helper-headings { display: flex; gap: 4px; max-width: 250px; margin-bottom: 4px; }
        .helper-headings span { flex: 1; text-align: center; font-size: 11px; font-weight: bold; color: #666; background: #e9ecef; border-radius: 2px; padding: 2px 0; }
        .helper-headings-8bit { max-width: 400px; }

        /* Correct & Incorrect Answer Styling */
        .input-correct { border-color: #008f39 !important; background-color: #e8f5e9 !important; color: #006100; font-weight: bold; }
        .input-incorrect { border-color: #d32f2f !important; background-color: #ffebee !important; color: #b71c1c; font-weight: bold; }
        
        /* Buttons */
        .btn-submit { background-color: #1e3a8a; color: white; border: none; padding: 12px 20px; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; display: block; width: 100%; max-width: 200px; transition: background-color 0.2s; }
        .btn-submit:hover { background-color: #152960; }
        .btn-pdf { background-color: #217346; color: white; border: none; padding: 15px 30px; border-radius: 4px; font-size: 18px; font-weight: bold; cursor: pointer; transition: background-color 0.2s; display: block; text-align: center; width: 100%; max-width: 300px; }
        .btn-pdf:hover { background-color: #124d2d; }
    </style>
</head>
