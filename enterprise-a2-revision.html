
<script>
/* =========================================================
   GCSE ENTERPRISE A2 REVISION PAGE
   Flexible marking, autosave, reset and PDF download
   ========================================================= */

/* ---------- AUTOSAVE ---------- */

function saveProgress() {
    var inputs = document.querySelectorAll('.auto-input');
    var saved = {};

    inputs.forEach(function(input, index) {
        saved['input_' + index] = input.value;
    });

    try {
        localStorage.setItem('enterpriseA2Memory', JSON.stringify(saved));
    } catch (error) {
        console.error('Unable to save progress:', error);
    }
}

function loadProgress() {
    try {
        var saved = localStorage.getItem('enterpriseA2Memory');
        if (!saved) return;

        var data = JSON.parse(saved);
        var inputs = document.querySelectorAll('.auto-input');

        inputs.forEach(function(input, index) {
            var key = 'input_' + index;

            if (Object.prototype.hasOwnProperty.call(data, key)) {
                input.value = data[key];
            }

            if (input.tagName.toLowerCase() === 'textarea') {
                resizeTextarea(input);
            }
        });

        checkAnswers('a2-input');
    } catch (error) {
        console.error('Unable to load saved progress:', error);
    }
}

function resizeTextarea(textarea) {
    textarea.style.height = 'auto';
    textarea.style.height = textarea.scrollHeight + 'px';
}

document.addEventListener('input', function(event) {
    var input = event.target;

    if (!input.classList.contains('auto-input')) return;

    saveProgress();

    if (input.tagName.toLowerCase() === 'textarea') {
        resizeTextarea(input);
    }

    input.classList.remove(
        'input-correct',
        'input-partial',
        'input-incorrect'
    );

    var feedback = input.nextElementSibling;

    if (feedback && feedback.classList.contains('feedback-msg')) {
        feedback.style.display = 'none';
    }
});

function clearData() {
    if (confirm('Are you sure you want to clear all your work on this page?')) {
        localStorage.removeItem('enterpriseA2Memory');
        window.location.reload();
    }
}

window.addEventListener('load', loadProgress);


/* ---------- ANSWER NORMALISATION ---------- */

function normaliseAnswer(text) {
    return String(text || '')
        .toLowerCase()
        .replace(/&/g, ' and ')
        .replace(/[’']/g, '')
        .replace(/£/g, ' ')
        .replace(/(\d+)\s*%/g, '$1 percent')
        .replace(/[^a-z0-9\s]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();
}

/*
   Matches a complete word or phrase.
   For example, "market share" matches the phrase
   without accidentally matching unrelated words.
*/

function containsTerm(answer, term) {
    var normalAnswer = ' ' + normaliseAnswer(answer) + ' ';
    var normalTerm = normaliseAnswer(term);

    if (!normalTerm) return false;

    return normalAnswer.includes(' ' + normalTerm + ' ');
}


/* ---------- QUESTION SPECIFIC RULES ---------- */

/*
   Question numbers refer to the 80 knowledge check questions.
   These rules allow answers that the original keyword lists
   could mark incorrectly.
*/

var specialRules = {

    1: {
        allRequired: true
    },

    4: {
        allRequired: true
    },

    5: {
        minConcepts: 1
    },

    11: {
        acceptedAnswers: [
            'a phone with a battery that lasts longer than competitors',
            'a phone with a better camera than rival phones',
            'a waterproof phone',
            'free next day delivery',
            'a unique design',
            'a lifetime guarantee',
            'recyclable packaging',
            'personalised products',
            'organic ingredients'
        ]
    },

    18: {
        acceptedAnswers: [
            'a new streaming service launches with a low monthly subscription',
            'a new business sells its product cheaply at launch to attract customers',
            'a new product starts with a low price to gain market share',
            'a new gym offers a cheap introductory membership',
            'a new takeaway offers low prices to attract customers',
            'a new brand sells below competitors prices to attract buyers'
        ]
    },

    23: {
        numericAnswer: 30
    },

    49: {
        acceptedAnswers: [
            'a salesperson explains a cars features to a customer',
            'a shop assistant demonstrates how a product works',
            'a salesperson advises a customer about a product',
            'a salesperson answers a customers questions',
            'a sales assistant helps a customer choose a product',
            'a car salesperson explains the features to a buyer'
        ]
    },

    66: {
        acceptedAnswers: [
            'sales promotion',
            'a sales promotion',
            'buy one get one free is a sales promotion',
            'bogof is a sales promotion'
        ]
    },

    75: {
        allRequired: true,
        minConcepts: 4
    }
};


/* ---------- FEEDBACK DISPLAY ---------- */

function showResult(input, feedback, result, message) {
    input.classList.remove(
        'input-correct',
        'input-partial',
        'input-incorrect'
    );

    input.classList.add('input-' + result);

    feedback.textContent = message;
    feedback.style.display = 'block';

    if (result === 'correct') {
        feedback.style.color = '#006100';
    } else if (result === 'partial') {
        feedback.style.color = '#8a6100';
    } else {
        feedback.style.color = '#b71c1c';
    }
}


/* ---------- ACCEPTED ANSWER CHECK ---------- */

function matchesAcceptedAnswer(studentAnswer, acceptedAnswers) {
    var student = normaliseAnswer(studentAnswer);

    return acceptedAnswers.some(function(modelAnswer) {
        var model = normaliseAnswer(modelAnswer);

        return model !== '' && (
            student === model ||
            student.includes(model)
        );
    });
}


/* ---------- NUMERICAL ANSWER CHECK ---------- */

function matchesNumber(studentAnswer, expectedNumber) {
    var answer = normaliseAnswer(studentAnswer);

    /*
       Accept answers such as:
       £30, 30, 30 pounds, thirty
    */

    var wordNumbers = {
        'thirty': 30,
        'thirty pounds': 30
    };

    if (Object.prototype.hasOwnProperty.call(wordNumbers, answer)) {
        return wordNumbers[answer] === expectedNumber;
    }

    var numbers = answer.match(/\d+(?:\.\d+)?/g);

    if (!numbers || numbers.length === 0) return false;

    /*
       Only accept the expected result if the answer does
       not contain another conflicting number.
    */

    return numbers.some(function(number) {
        return Number(number) === expectedNumber;
    });
}


/* ---------- MAIN MARKING FUNCTION ---------- */

function checkAnswers(groupClass) {
    var inputs = document.getElementsByClassName(groupClass);
    var answered = 0;
    var correct = 0;
    var partial = 0;

    for (var i = 0; i < inputs.length; i++) {
        var input = inputs[i];
        var studentAnswer = input.value.trim();
        var feedback = input.nextElementSibling;
        var rubricText = input.getAttribute('data-rubric');

        if (!rubricText || !feedback ||
            !feedback.classList.contains('feedback-msg')) {
            continue;
        }

        input.classList.remove(
            'input-correct',
            'input-partial',
            'input-incorrect'
        );

        if (!studentAnswer) {
            feedback.style.display = 'none';
            continue;
        }

        answered++;

        var rubric;

        try {
            rubric = JSON.parse(rubricText);
        } catch (error) {
            showResult(
                input,
                feedback,
                'partial',
                'This question has a marking setup error. Please tell your teacher.'
            );
            partial++;
            continue;
        }

        /*
           Question number is based on its position in the
           a2-input collection, not the revision notes box.
        */

        var questionNumber = i + 1;
        var special = specialRules[questionNumber] || {};

        /* Apply special rules for selected questions */

        if (special.numericAnswer !== undefined) {
            if (matchesNumber(studentAnswer, special.numericAnswer)) {
                showResult(
                    input,
                    feedback,
                    'correct',
                    'Correct. 50% of £20 is £10, so the selling price is £30.'
                );
                correct++;
            } else {
                showResult(
                    input,
                    feedback,
                    'incorrect',
                    'Not quite. Calculate 50% of £20, then add that amount to £20. The selling price is £30.'
                );
            }
            continue;
        }

        var acceptedAnswers = (rubric.acceptedAnswers || [])
            .concat(special.acceptedAnswers || []);

        if (matchesAcceptedAnswer(studentAnswer, acceptedAnswers)) {
            showResult(
                input,
                feedback,
                'correct',
                'Correct. Your answer matches an accepted example.'
            );
            correct++;
            continue;
        }

        var keywords = rubric.keywords || [];
        var conceptsFound = 0;

        for (var k = 0; k < keywords.length; k++) {
            var group = Array.isArray(keywords[k])
                ? keywords[k]
                : [keywords[k]];

            var found = group.some(function(term) {
                return containsTerm(studentAnswer, term);
            });

            if (found) {
                conceptsFound++;
            }
        }

        if (keywords.length === 0) {
            showResult(
                input,
                feedback,
                'partial',
                'This answer needs to be checked against your revision notes.'
            );
            partial++;
            continue;
        }

        /*
           By default, every concept in the existing rubric
           is required. Questions with special rules can
           override this requirement.
        */

        var requiredConcepts = Number.isInteger(special.minConcepts)
            ? special.minConcepts
            : Number.isInteger(rubric.minConcepts)
                ? rubric.minConcepts
                : keywords.length;

        requiredConcepts = Math.max(
            1,
            Math.min(requiredConcepts, keywords.length)
        );

        var isCorrect = conceptsFound >= requiredConcepts;

        /*
           Questions that explicitly require every concept
           cannot pass by meeting a lower threshold.
        */

        if (special.allRequired) {
            isCorrect = conceptsFound === keywords.length;
        }

        if (isCorrect) {
            showResult(
                input,
                feedback,
                'correct',
                'Correct. ' + (
                    rubric.success ||
                    'You have included the required key concepts.'
                )
            );
            correct++;

        } else if (conceptsFound > 0) {
            showResult(
                input,
                feedback,
                'partial',
                'Partially correct: ' + conceptsFound + ' of ' +
                keywords.length + ' concepts identified. ' +
                (rubric.feedback || 'Add more relevant detail.')
            );
            partial++;

        } else {
            showResult(
                input,
                feedback,
                'incorrect',
                'Your answer has not matched the marking points yet. ' +
                (rubric.feedback || 'Review your notes and try again.')
            );
        }
    }

    /* Optional overall summary, added if not already present */

    var summary = document.getElementById('marking-summary');

    if (!summary) {
        summary = document.createElement('div');
        summary.id = 'marking-summary';
        summary.className = 'feedback-msg';
        summary.setAttribute('aria-live', 'polite');

        var button = document.querySelector(
            'button[onclick*="checkAnswers"]'
        );

        if (button) {
            button.parentNode.insertBefore(summary, button);
        }
    }

    summary.textContent =
        'Results: ' + correct + ' correct, ' +
        partial + ' partially correct, from ' +
        answered + ' answered questions. ' +
        'Automated marking is a guide. Check longer exam answers against your revision notes.';

    summary.style.display = 'block';
    summary.style.padding = '12px';
    summary.style.backgroundColor = '#f8f9fa';
    summary.style.borderRadius = '4px';

    saveProgress();
}


/* ---------- PDF DOWNLOAD ---------- */

function downloadPDF() {
    if (typeof html2pdf === 'undefined') {
        alert('The PDF library has not loaded. Check your internet connection and try again.');
        return;
    }

    var buttons = document.querySelectorAll('.no-print');
    var oldDisplays = [];

    buttons.forEach(function(button, index) {
        oldDisplays[index] = button.style.display;
        button.style.display = 'none';
    });

    var actionButtons = document.getElementById('action-buttons');
    var oldActionDisplay = actionButtons
        ? actionButtons.style.display
        : '';

    if (actionButtons) actionButtons.style.display = 'none';

    var textInputs = document.querySelectorAll(
        '#pdf-content input[type="text"]'
    );

    textInputs.forEach(function(input) {
        input.setAttribute('value', input.value);
    });

    var textareas = document.querySelectorAll('#pdf-content textarea');
    var oldTextareaState = [];

    textareas.forEach(function(textarea, index) {
        oldTextareaState[index] = {
            height: textarea.style.height,
            html: textarea.innerHTML
        };

        textarea.innerHTML = textarea.value
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');

        textarea.style.height = Math.max(
            textarea.scrollHeight,
            80
        ) + 'px';
    });

    var options = {
        margin: 0.3,
        filename: 'A2_4Ps_Marketing_Mix.pdf',
        image: {
            type: 'jpeg',
            quality: 0.98
        },
        html2canvas: {
            scale: 2,
            useCORS: true,
            scrollY: 0
        },
        jsPDF: {
            unit: 'in',
            format: 'a4',
            orientation: 'portrait'
        },
        pagebreak: {
            mode: ['css', 'legacy']
        }
    };

    function restorePage() {
        buttons.forEach(function(button, index) {
            button.style.display = oldDisplays[index];
        });

        if (actionButtons) {
            actionButtons.style.display = oldActionDisplay || 'flex';
        }

        textareas.forEach(function(textarea, index) {
            textarea.style.height = oldTextareaState[index].height;
            textarea.innerHTML = oldTextareaState[index].html;
        });
    }

    html2pdf()
        .set(options)
        .from(document.getElementById('pdf-content'))
        .save()
        .then(restorePage)
        .catch(function(error) {
            console.error('PDF generation failed:', error);
            restorePage();
            alert('The PDF could not be generated. Please try again.');
        });
}
</script>
